<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2x2 차트 (15분 / 3분 / 일봉 / 1시간)</title>
<style>
  :root { --bg:#ffffff; --panel:#ffffff; --text:#111827; --grid:#e5e7eb; --border:#d1d5db; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --panel:#111827; --text:#e5e7eb; --grid:#1f2937; --border:#334155; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { height: 100dvh; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  /* 최상단 시세 바: #top(자리 유지용 slot) > .top-pane(확대 대상) > .cropbox > .top-view(내용) */
  /* --top-scale: 시세 바 글자 배율 (1 = 원래 크기, 3 = 3배). 바뀐 만큼 바 높이가 늘고 차트 영역은 줄어듦 */
  #top { display: none; position: relative; --top-scale: 3; }
  .top-pane { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .top-pane .cropbox { height: auto; }
  .top-pane .top-view { display: flex; flex-wrap: wrap; align-items: baseline; height: auto;
    gap: calc(4px * var(--top-scale)) calc(16px * var(--top-scale));
    padding: calc(5px * var(--top-scale)) 38px calc(5px * var(--top-scale)) calc(12px * var(--top-scale));   /* 오른쪽 38px = 확대 버튼 자리 */
    font-size: calc(15px * var(--top-scale)); }
  .top-view .nm { font-weight: 700; font-size: calc(17px * var(--top-scale)); }
  .top-view .px { font-weight: 700; font-size: calc(17px * var(--top-scale)); font-variant-numeric: tabular-nums; }
  .top-view .lb { opacity: .6; font-size: calc(12px * var(--top-scale)); margin-right: calc(4px * var(--top-scale)); }
  .top-view .chg { font-variant-numeric: tabular-nums; }
  .top-view .flat { opacity: .7; }
  .top-view .asof { margin-left: auto; font-size: calc(12px * var(--top-scale)); opacity: .6; }
  .top-view .asof.stale { color: #d97706; opacity: 1; }
  /* 확대 시: 글자를 화면 크기에 맞춰 키움 */
  .top-pane.max .cropbox { height: 100%; }
  .top-pane.max .top-view { height: 100%; align-content: center; justify-content: center; gap: 1vh 4vw; padding: 2vh 4vw; font-size: clamp(1rem, 3vw, 3rem); }
  .top-pane.max .nm { font-size: clamp(2rem, 7vw, 7rem); }
  .top-pane.max .px { font-size: clamp(3rem, 12vw, 12rem); }
  .top-pane.max .lb { font-size: .5em; }
  .top-pane.max .asof { margin-left: 0; width: 100%; text-align: center; font-size: clamp(.9rem, 2vw, 2rem); }
  .grid { flex: 1; min-height: 0; display: grid; gap: 6px;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  /* .slot 이 grid 칸 자리를 지키고, .cell 은 그 안을 채움 → 하나를 확대해도 나머지 칸 크기/위치가 변하지 않음 */
  .slot { position: relative; min-width: 0; min-height: 0; }
  .cell { position: absolute; inset: 0; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  /* 확대: 화면 전체를 덮음 (CSS 만 바꾸므로 차트는 다시 만들어지지 않음) */
  .cell.max, .top-pane.max { position: fixed; inset: 0; z-index: 1000; border-radius: 0; }

  /* 확대/축소 버튼 */
  .expand { position: absolute; top: 4px; right: 6px; z-index: 30; width: 24px; height: 24px; padding: 0;
    display: grid; place-items: center; font-size: 14px; line-height: 1; color: var(--text); opacity: .55;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .expand:hover { opacity: 1; }
  .max .expand { top: 10px; right: 12px; width: 32px; height: 32px; font-size: 18px; }

  /* 영역 확대(crop): data-crop="x1 x2 y1 y2" (0~100 %) 를 가진 요소가 자르고, 안의 .cropee 를 키워서 그 영역이 꽉 차게 함 */
  .cropbox { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .chartbox { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .cropee { display: block; width: 100%; height: 100%; transform-origin: 0 0; }

  .head { display: flex; justify-content: space-between; gap: 8px; padding: 5px 38px 5px 10px; font-size: 13px;
    border-bottom: 1px solid var(--border); }
  .head b { font-weight: 700; }
  .up { color: #e0393e; } .down { color: #1e6fd9; }   /* 한국식: 상승 빨강, 하락 파랑 */
  .chart { flex: 1; min-height: 0; }
  .msg { z-index: 20; position: absolute; inset: 40px 0 0 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 16px; font-size: 13px; opacity: .8; pointer-events: none; }
  #log { display:none; position:fixed; left:0; right:0; bottom:0; max-height:35vh; overflow:auto; margin:0;
    padding:8px 10px; font:12px/1.5 ui-monospace, Consolas, monospace; white-space:pre-wrap; word-break:break-all;
    background:#fff3cd; color:#7a4b00; border-top:2px solid #e0a800; z-index:9999; }
  @media (prefers-color-scheme: dark) { #log { background:#3b2f06; color:#ffd666; border-color:#a67c00; } }
  /* 모바일/PC 모두 2x2 고정. 좁은 화면에서는 헤더만 작게 */
  @media (max-width: 800px), (orientation: portrait) {
    .wrap { padding: 3px; gap: 3px; }
    .top-pane .top-view { padding: calc(3px * var(--top-scale)) 34px calc(3px * var(--top-scale)) calc(8px * var(--top-scale));
      gap: calc(2px * var(--top-scale)) calc(10px * var(--top-scale)); font-size: calc(12px * var(--top-scale)); }
    .top-view .nm, .top-view .px { font-size: calc(14px * var(--top-scale)); }
    .grid { gap: 3px; }
    .head { flex-direction: column; gap: 0; padding: 3px 34px 3px 6px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 영역 확대 data-crop = "x1 x2 y1 y2" (0~100 %, 왼→오 / 위→아래). 0 100 0 100 = 전체. data-crop-fit="contain" 을 같이 쓰면 비율 유지 -->
  <div id="top">
    <div class="top-pane">
      <button class="expand" type="button" title="확대 / 축소 (Esc)" aria-label="확대">⤢</button>
      <div class="cropbox" data-crop="0 100 0 100"><div class="cropee top-view" id="topview"></div></div>
    </div>
  </div>
  <div class="grid">
    <!-- data-interval: Worker에 넘기는 값(15, 3, 60, D) / data-refresh: 갱신 주기(ms) / data-label: 제목 뒤에 붙는 봉 이름 -->
    <div class="slot">
      <section class="cell" data-interval="15" data-refresh="15000" data-label="15분">
        <button class="expand" type="button" title="확대 / 축소 (Esc)" aria-label="확대">⤢</button>
        <div class="head"><b>차트 · 15분</b><span class="info">-</span></div>
        <div class="chartbox" data-crop="0 100 0 100"><div class="chart cropee"></div></div><div class="msg"></div>
      </section>
    </div>
    <div class="slot">
      <section class="cell" data-interval="3" data-refresh="15000" data-label="3분">
        <button class="expand" type="button" title="확대 / 축소 (Esc)" aria-label="확대">⤢</button>
        <div class="head"><b>차트 · 3분</b><span class="info">-</span></div>
        <div class="chartbox" data-crop="0 100 0 100"><div class="chart cropee"></div></div><div class="msg"></div>
      </section>
    </div>
    <div class="slot">
      <section class="cell" data-interval="D" data-refresh="60000" data-label="일봉">
        <button class="expand" type="button" title="확대 / 축소 (Esc)" aria-label="확대">⤢</button>
        <div class="head"><b>차트 · 일봉</b><span class="info">-</span></div>
        <div class="chartbox" data-crop="0 100 0 100"><div class="chart cropee"></div></div><div class="msg"></div>
      </section>
    </div>
    <div class="slot">
      <section class="cell" data-interval="60" data-refresh="30000" data-label="1시간">
        <button class="expand" type="button" title="확대 / 축소 (Esc)" aria-label="확대">⤢</button>
        <div class="head"><b>차트 · 1시간</b><span class="info">-</span></div>
        <div class="chartbox" data-crop="0 100 0 100"><div class="chart cropee"></div></div><div class="msg"></div>
      </section>
    </div>
  </div>
</div>
<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
  // 배포한 Cloudflare Worker 주소로 바꾸세요 (끝에 / 없이, .workers.dev 까지만)
  const API_BASE = "https://kospi-proxy.YOUR-SUBDOMAIN.workers.dev";
  // 종목 코드: 비워두면(="") Cloudflare Worker의 SYMBOL 변수를 따름.
  // 값을 넣으면(예: "005930.KS") 이 값이 Cloudflare 설정보다 우선함. 코드표는 worker.js 상단 주석 참고.
  const SYMBOL = "";
  // 화면에 보이는 캔들 수 = 차트 폭(px) / BAR_PX 를 MIN_BARS~MAX_BARS 로 제한 (좁으면 적게, 넓으면 많게)
  const BAR_PX = 12;          // 캔들 1개당 가로 px (클수록 캔들이 적게, 굵게 보임)
  const MIN_BARS = 20;        // 최소 캔들 수
  const MAX_BARS = 100;       // 최대 캔들 수
  const visibleBars = w => Math.max(MIN_BARS, Math.min(MAX_BARS, Math.round(w / BAR_PX)));
  const RIGHT_PAD = 4;        // 오른쪽 여백(캔들 몇 개 분량)

  const logEl = document.getElementById("log");
  function logLine(t) { logEl.style.display = "block"; logEl.textContent += t + "\n"; logEl.scrollTop = logEl.scrollHeight; }
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // ── 최상단: 종목명 / 현재가 / 전일대비 등락폭 / 등락률 ──
  // 전일 종가 = 일봉의 마지막에서 두 번째 봉 종가, 현재가 = 가장 최근 봉의 종가
  const topEl = document.getElementById("top");        // 자리 유지용 바깥 상자 (데이터가 오기 전에는 숨김)
  const topView = document.getElementById("topview");  // 실제 내용이 들어가는 곳
  const topState = { symbol: null, name: "", dec: 2, prev: null, price: null, priceTime: -1, asOf: null };
  function renderTop() {
    const s = topState;
    if (s.price === null) return;
    const fmt = v => v.toLocaleString(undefined, { minimumFractionDigits: s.dec, maximumFractionDigits: s.dec });
    let html = `<span class="nm">${s.name}</span><span class="px">${fmt(s.price)}</span>`;
    if (s.prev) {
      const diff = s.price - s.prev;
      const pct = diff / s.prev * 100;
      const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "-";
      const sign = diff > 0 ? "+" : diff < 0 ? "-" : "";
      html += `<span class="chg ${cls}"><span class="lb">전일대비</span>${arrow} ${fmt(Math.abs(diff))}</span>`
            + `<span class="chg ${cls}"><span class="lb">등락률</span>${sign}${Math.abs(pct).toFixed(2)}%</span>`;
    }
    if (s.asOf) {
      const mins = Math.max(0, Math.round((Date.now() / 1000 - s.asOf) / 60));
      const hhmm = new Date(s.asOf * 1000).toLocaleTimeString("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", hour12: false });
      html += `<span class="asof ${mins >= 5 ? "stale" : ""}">데이터 ${hhmm} 기준 (${mins < 1 ? "방금" : mins + "분 전"})</span>`;
    }
    topView.innerHTML = html;
    topEl.style.display = "block";
  }
  function reportTop(d, interval, dec) {
    const s = topState;
    if (s.symbol !== d.symbol) Object.assign(s, { symbol: d.symbol, prev: null, price: null, priceTime: -1, asOf: null });
    s.name = d.name || d.symbol;
    s.dec = dec;
    if (d.asOf && (s.asOf === null || d.asOf > s.asOf)) s.asOf = d.asOf;
    const c = d.candles, last = c[c.length - 1];
    if (interval === "D") {
      s.prev = c.length >= 2 ? c[c.length - 2].close : null;
      if (s.price === null) s.price = last.close;
    } else if (last.time >= s.priceTime) {
      s.price = last.close; s.priceTime = last.time;
    }
    renderTop();
  }

  setInterval(renderTop, 30000);   // '몇 분 전' 표시 갱신

  // ── 확대/축소: 5개 영역(시세 바 + 차트 4개) 어느 것이든 버튼으로 화면 전체로 확대, Esc 로 복귀 ──
  function setMax(pane, on) {
    document.querySelectorAll(".cell.max, .top-pane.max").forEach(p => {
      p.classList.remove("max");
      p.querySelector(".expand").textContent = "⤢";
      if (p.classList.contains("top-pane")) p.parentElement.style.minHeight = "";
    });
    if (on) {
      // 시세 바는 높이가 내용에 따라 정해지므로, 확대 중에도 원래 자리의 높이를 유지
      if (pane.classList.contains("top-pane")) pane.parentElement.style.minHeight = pane.offsetHeight + "px";
      pane.classList.add("max");
      pane.querySelector(".expand").textContent = "✕";
    }
  }
  document.querySelectorAll(".expand").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    const pane = btn.closest(".cell, .top-pane");
    setMax(pane, !pane.classList.contains("max"));
  }));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { const open = document.querySelector(".cell.max, .top-pane.max"); if (open) setMax(open, false); }
  });

  // ── 영역 확대(crop): data-crop="x1 x2 y1 y2" (0~100 %) 영역이 상자 전체를 채우도록 .cropee 를 확대/이동 ──
  // 기본은 영역이 상자를 정확히 채움(비율이 다르면 늘어남). data-crop-fit="contain" 이면 비율 유지(영역을 상자 안에 맞춰 가운데 배치).
  function applyCrop(box) {
    const target = box.querySelector(".cropee");
    if (!target) return;
    const clear = () => { target.style.transform = ""; target._cropScale = null; };
    const v = (box.dataset.crop || "").trim().split(/[\s,]+/).map(Number);
    const W = box.clientWidth, H = box.clientHeight;
    if (v.length !== 4 || v.some(isNaN) || !W || !H) return clear();
    const [x1, x2, y1, y2] = v;
    const rw = (x2 - x1) / 100, rh = (y2 - y1) / 100;
    if (rw <= 0 || rh <= 0) return clear();
    if (x1 <= 0 && x2 >= 100 && y1 <= 0 && y2 >= 100) return clear();   // 전체 보기: 변형 없음
    let sx, sy, tx, ty;
    if (box.dataset.cropFit === "contain") {
      sx = sy = Math.min(1 / rw, 1 / rh);
      tx = W / 2 - sx * ((x1 + x2) / 200) * W;
      ty = H / 2 - sy * ((y1 + y2) / 200) * H;
    } else {
      sx = 1 / rw; sy = 1 / rh;
      tx = -sx * (x1 / 100) * W;
      ty = -sy * (y1 / 100) * H;
    }
    target.style.transform = `translate(${tx}px, ${ty}px) scale(${sx}, ${sy})`;
    target._cropScale = { x: sx, y: sy };
  }
  const cropObserver = new ResizeObserver(entries => entries.forEach(e => applyCrop(e.target)));
  document.querySelectorAll("[data-crop]").forEach(box => {
    cropObserver.observe(box);
    new MutationObserver(() => applyCrop(box)).observe(box, { attributes: true, attributeFilter: ["data-crop", "data-crop-fit"] });
    applyCrop(box);
  });

  // ── 확대된 차트의 마우스/터치 위치 보정 ──
  // lightweight-charts 는 (clientX - getBoundingClientRect().left) 로 차트 안 좌표를 계산하는데,
  // CSS 로 확대하면 이 값이 확대 배율만큼 어긋나 십자선/드래그가 틀어짐 → 입력 이벤트 처리 중에만 사각형을 보정해서 돌려줌.
  let lastPtr = null, ptrTimer = 0;
  const trackPtr = e => {
    const p = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    if (typeof p.clientX === "number") lastPtr = { x: p.clientX, y: p.clientY };
    clearTimeout(ptrTimer); ptrTimer = setTimeout(() => { lastPtr = null; }, 0);
  };
  ["mousemove", "mousedown", "mouseup", "touchstart", "touchmove", "touchend", "wheel", "pointermove", "pointerdown", "pointerup"]
    .forEach(t => window.addEventListener(t, trackPtr, { capture: true, passive: true }));
  const nativeRect = Element.prototype.getBoundingClientRect;
  Element.prototype.getBoundingClientRect = function () {
    const r = nativeRect.call(this);
    if (!lastPtr || !this.closest) return r;
    const host = this.closest(".cropee");
    const s = host && host._cropScale;
    if (!s) return r;
    return new DOMRect(lastPtr.x - (lastPtr.x - r.left) / s.x, lastPtr.y - (lastPtr.y - r.top) / s.y, r.width / s.x, r.height / s.y);
  };

  function setup(cell) {
    const interval = cell.dataset.interval;
    const label = cell.dataset.label || interval;
    const refresh = parseInt(cell.dataset.refresh, 10) || 15000;
    const daily = interval === "D";
    const box = cell.querySelector(".chart");
    const info = cell.querySelector(".info");
    const msg = cell.querySelector(".msg");
    const ttl = cell.querySelector(".head b");

    const chart = LightweightCharts.createChart(box, {
      autoSize: true,
      layout: { background: { color: css("--panel") }, textColor: css("--text") },
      grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
      timeScale: { timeVisible: !daily, secondsVisible: false, rightOffset: RIGHT_PAD },
      rightPriceScale: { borderColor: css("--border") },
      crosshair: { mode: 0 },
    });
    const series = chart.addCandlestickSeries({
      upColor: "#e0393e", borderUpColor: "#e0393e", wickUpColor: "#e0393e",
      downColor: "#1e6fd9", borderDownColor: "#1e6fd9", wickDownColor: "#1e6fd9",
    });

    let first = true;
    let barCount = 0;
    let curSymbol = null;
    function showLast() {
      if (!barCount) return;
      const n = visibleBars(box.clientWidth);
      chart.timeScale().setVisibleLogicalRange({ from: barCount - n, to: barCount - 1 + RIGHT_PAD });
    }
    new ResizeObserver(showLast).observe(box);   // 창 크기/회전이 바뀌면 캔들 수 재계산

    function fail(text, detail) {
      msg.textContent = text; msg.style.display = "flex"; info.textContent = "오류";
      logLine(`[${interval}] ${text}` + (detail ? "\n  " + detail : ""));
    }

    async function load() {
      if (API_BASE.includes("YOUR-SUBDOMAIN")) { return fail("API_BASE를 Worker 주소로 바꿔주세요."); }
      const url = `${API_BASE}/api/candles?interval=${interval}` + (SYMBOL ? `&symbol=${encodeURIComponent(SYMBOL)}` : "");
      try {
        const r = await fetch(url);
        const raw = await r.text();
        let d; try { d = JSON.parse(raw); } catch (_) { throw new Error("JSON이 아닌 응답 (HTTP " + r.status + "): " + raw.slice(0, 120)); }
        if (!r.ok || d.error) throw new Error(d.error || ("HTTP " + r.status));
        if (!Array.isArray(d.candles) || d.candles.length === 0) {
          return fail("서버 응답은 정상이나 캔들이 0개입니다. (Yahoo 데이터 없음: " + d.symbol + ")");
        }

        // 종목이 바뀌었으면(Cloudflare에서 SYMBOL 변경) 화면 범위를 처음처럼 다시 잡음
        if (curSymbol !== null && curSymbol !== d.symbol) first = true;
        curSymbol = d.symbol;

        // 가격 표시 자릿수 (Worker가 알려줌: 외환 5, 주식·지수 2)
        const dec = Number.isInteger(d.decimals) ? d.decimals : 2;
        series.applyOptions({ priceFormat: { type: "price", precision: dec, minMove: Math.pow(10, -dec) } });

        ttl.textContent = `${d.name || d.symbol} · ${label}`;
        document.title = `${d.name || d.symbol} 2x2 차트`;

        const rng = chart.timeScale().getVisibleLogicalRange();
        const oldCount = barCount;
        series.setData(d.candles);
        barCount = d.candles.length;
        if (first) { showLast(); first = false; }
        else if (rng && barCount !== oldCount && rng.to >= oldCount - 1) {
          // 최신 봉을 보고 있던 경우: 새 봉이 생겨도 같은 구간(줌 유지)으로 따라가기
          const delta = barCount - oldCount;
          chart.timeScale().setVisibleLogicalRange({ from: rng.from + delta, to: rng.to + delta });
        }

        const last = d.candles[d.candles.length - 1];
        const prev = d.candles[d.candles.length - 2] || last;
        const diff = last.close - prev.close;
        info.innerHTML = `<span class="${diff >= 0 ? "up" : "down"}">${last.close.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec })} (${diff >= 0 ? "+" : ""}${diff.toFixed(dec)})</span> · ${d.candles.length}봉`;
        msg.style.display = "none";
        reportTop(d, interval, dec);
      } catch (e) {
        console.error("[chart]", e);
        fail("데이터를 불러오지 못했습니다: " + e.message, `요청 주소: ${url}\n  페이지 주소: ${location.href}`);
      }
    }
    load();
    setInterval(load, refresh);
  }

  document.querySelectorAll(".cell").forEach(setup);
</script>
</body>
</html>
