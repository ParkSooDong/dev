<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOSPI 1x2 차트 (15분 / 3분)</title>
<style>
  :root { --bg:#ffffff; --panel:#f3f4f6; --text:#111827; --border:#d1d5db; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --panel:#1e293b; --text:#e5e7eb; --border:#334155; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { display: flex; flex-direction: column; height: 100dvh; padding: 6px; gap: 6px; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cell { display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .label { padding: 4px 10px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border); }
  .chart { flex: 1; min-height: 0; }
  /* 세로 화면(모바일/좁은 화면)에서는 위아래로 배치 */
  @media (max-width: 800px), (orientation: portrait) {
    .grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <section class="cell">
      <div class="label">KOSPI · 15분</div>
      <div class="chart" id="chart_left"></div>
    </section>
    <section class="cell">
      <div class="label">KOSPI · 3분</div>
      <div class="chart" id="chart_right"></div>
    </section>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
  const SYMBOL = "KRX:KOSPI";
  const theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

  function makeChart(containerId, interval) {
    new TradingView.widget({
      container_id: containerId,
      symbol: SYMBOL,
      interval: String(interval),   // 분 단위: "15", "3"
      timezone: "Asia/Seoul",
      locale: "kr",
      theme: theme,
      style: "1",                   // 캔들
      autosize: true,               // 컨테이너 크기에 맞춰 자동 조절
      allow_symbol_change: true,
      hide_side_toolbar: false,
      save_image: false
    });
  }

  makeChart("chart_left", 15);
  makeChart("chart_right", 3);
</script>
</body>
</html>
