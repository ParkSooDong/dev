window.NEWMM_SHARED_STYLES = [":root {\n  --bg: #f3f1ec;\n  --ink: #1c1b19;\n  --mute: #76726a;\n  --line: #d9d5cb;\n  --card: #fffefb;\n  --mfg: #2b8a3e;\n  --ok: #2e7d32;\n  --err: #b3261e;\n  box-sizing: border-box;\n  padding-top: env(safe-area-inset-top,0px);\n  padding-bottom: env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme:dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #17161a;\n    --ink: #ecebe6;\n    --mute: #8d8a82;\n    --line: #34322f;\n    --card: #1e1d21;\n    --mfg: #4cc764;\n    --ok: #81c784;\n    --err: #ff8a80;\n  }\n}\n* {\n  box-sizing: border-box;\n}\nhtml,body {\n  height: 100%;\n  margin: 0;\n}\nbody {\n  background: var(--bg);\n  color: var(--ink);\n  font-family: \"Pretendard\",\"Noto Sans KR\",system-ui,sans-serif;\n  display: flex;\n  flex-direction: column;\n  padding: 12px;\n  gap: 8px;\n}\nheader {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: flex-start;\n  align-items: center;\n  gap: 6px 10px;\n}\n.fbbtn {\n  flex: none;\n  font: inherit;\n  font-size: 13px;\n  font-weight: 600;\n  padding: 2px 12px;\n  border-radius: 999px;\n  background: transparent;\n  color: var(--ink);\n  border: 1.5px solid var(--line);\n  cursor: pointer;\n}\n.fbbtn[aria-pressed=true] {\n  background: var(--ink);\n  color: var(--bg);\n  border-color: var(--ink);\n}\n.fbbtn:focus-visible {\n  outline: 2px solid var(--ink);\n  outline-offset: 2px;\n}\n#dbGrp {\n  display: inline-flex;\n  gap: 4px;\n  align-items: center;\n}\n#dbGrp[hidden] {\n  display: none;\n}\n#dbPause[hidden] {\n  display: none;\n}\n.dbbtn {\n  font-size: 11px;\n  padding: 1px 9px;\n}\n.dbbtn:disabled {\n  opacity: .4;\n  cursor: not-allowed;\n}\nh1 {\n  font-size: 17px;\n  margin: 0;\n  letter-spacing: -.01em;\n}\n#st {\n  font-size: 12px;\n  color: var(--mute);\n}\n#st:empty {\n  display: none;\n}", "header h1::after {\n  content: \"\";\n  display: inline-block;\n  width: 1px;\n  height: 12px;\n  background: var(--line);\n  margin-right: 10px;\n : transparent;\n  color: var(--ink);\n  cursor: pointer;\n  white-space: nowrap;\n  text-align: left;\n}\n.imgx-pop button:hover {\n  background: var(--line);\n}\n.imgx-pop {\n  color: var(--ink);\n}\n.imgx-bar .imgx-sl {\n  display: inline-flex;\n  flex-direction: row;\n  align-items: center;\n  gap: 5px;\n  font-size: 13px;\n  color: var(--ink);\n  white-space: nowrap;\n  min-width: auto;\n  flex: none;\n}\n.imgx-bar .imgx-sl input[type=range] {\n  width: 130px;\n  flex: none;\n  margin: 0;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  height: auto;\n  min-width: 0;\n}\n.imgx-bar .imgx-sl input[type=number] {\n  width: 58px;\n  flex: none;\n  height: 28px;\n  padding: 0 4px;\n  font-size: 13px;\n}\n.imgx-grip.gr {\n  right: -10px;\n  bottom: auto;\n  top: calc(50% - 10px);\n  border-radius: 6px;\n  cursor: ew-resize;\n}\n.imgx-grip.gb {\n  bottom: -10px;\n  right: auto;\n  left: calc(50% - 10px);\n  border-radius: 6px;\n  cursor: ns-resize;\n}\n.imgx-grip {\n  position: absolute;\n  right: -10px;\n  bottom: -10px;\n  width: 20px;\n  height: 20px;\n  border-radius: 50%;\n  background: #339af0;\n  border: 2px solid #fff;\n  box-shadow: 0 1px 4px rgba(0,0,0,.4);\n  cursor: nwse-resize;\n  pointer-events: auto;\n  touch-action: none;\n}\n.imgx-bar {\n  flex: none;\n  position: static;\n  margin-bottom: 6px;\n  padding: 4px;\n  background: var(--card);\n  border: 1.5px solid var(--line);\n  border-radius: 10px;\n  color: var(--ink);\n}\n.imgx-row {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 4px;\n}\n.imgx-bar .imgx-row+.imgx-row {\n  margin-top: 4px;\n  padding-top: 4px;\n  border-top: 1px solid var(--line);\n}\n.imgx-bar button {\n  flex: none;\n  width: auto;\n  height: auto;\n  margin: 0;\n  font: inherit;\n  font-size: 13px;\n  font-weight: 400;\n  padding: 4px 9px;\n  border-radius: 7px;\n  border: 1px solid var(--line);\n  background: transparent;\n  color: var(--ink);\n  cursor: pointer;\n  white-space: nowrap;\n}\n.imgx-         ro.observe(ed2);
    }
    function closeCmp() {
        clearGaps();
        clearHl();
        st = null;
        if (panel)
            panel.hidden = true;
        if (wrapEl.classList.contains("cmpm")) {
            wrapEl.classList.remove("cmpm");

    }
    window.closeCmp = closeCmp;
    function ensurePanel() {
        if (panel)
            return;

        panel.id = "cmp";
        panel.setAttribute("role", "dialog");

        panel.hidden = true;

        h.appendChild(sumEl);
        const x = mk("button", "", "✕");

        vsp1 = mkHandle("vsp1", "원본과 변경본 사이 폭 조절", 1);
        document.getElementById("spl").after(vsp1);
        vsp2 = mkHandle("vsp2", "변경본과 비교 결과 사이 폭 조절", 2);

    function goTo(it, el) {
        if (!st)
            return;

        el.classList.add("on");

        if (it.a >= 0)
            ls.push(st.A[it.a]);
        if (it.b >= 0)
            ls.push(st.B[it.b]);
        if (CH)
            CSS.highlights.set("cmp-cur", new Highlight(...ls.map(rng)));
        for (const L of ls) {

    function addTableSerials(A, B, rows) {
        // 양쪽 영역이 각각 표 하나인 경우에만 번호 열을 추가해요.
        const ta = ed1.querySelectorAll("table"), tb = ed2.querySelectorAll("table");
        if (ta.length !== 1 || tb.length !== 1)
            return false;
        const tableA = ta[0], tableB = tb[0];
        const trsA = Array.from(tableA.rows), trsB = Array.from(tableB.rows);
        if (!trsA.length || !trsB.length)
            return false;
        // 제목 행은 실제 표 구조(THEAD 또는 첫 행의 TH)로 판단해요.
        // 첫 행이 일반 TD라면 제목 행으로 보지 않고 첫 행부터 번호를 매겨요.
        const isHeaderRow = tr => !!tr && ((tr.parentElement && tr.parentElement.tagName === "THEAD") ||
            Array.from(tr.cells).some(c => c.tagName === "TH" && !c.classList.contains("cmp-serial-cell")));
        const headerA = isHeaderRow(trsA[0]) ? 1 : 0;
        const headerB = isHeaderRow(trsB[0]) ? 1 : 0;
        // 한 표 행 안에 여러 DIV 등이 있어 비교 줄이 나뉘더라도
        // 각 비교 줄이 어느 실제 TR에 속하는지 연결해요.
        const rowFor = L => {
            for (const n of (L.nodes || [])) {
                const e = n && (n.nodeType === 1 ? n : n.parentElement);
                const tr = e && e.closest ? e.closest("tr") : null;
                if (tr)
                    return tr;
            }
            return null;
        };
        const lineRowsA = A.map(rowFor), lineRowsB = B.map(rowFor);
        if (lineRowsA.some(tr => !tr || !tableA.contains(tr)) ||
            lineRowsB.some(tr => !tr || !tableB.contains(tr)))
            return false;
        const indexB = new Map(trsB.map((tr, i) => [tr, i]));
        const pairedA = new Map();
        // 비교 결과에서 대응되는 가·나 줄을 실제 표 행 단위로 연결해요.
        for (const pair of rows) {
            const [i, j] = pair;
            if (i \u003c 0 || j \u003c 0 || i >= lineRowsA.length || j >= lineRowsB.length)
                continue;
            const ar = lineRowsA[i], br = lineRowsB[j];
            if (!ar || !br)
                continue;
            const bi = indexB.get(br);
            if (bi == null || bi \u003c headerB)
                continue;
            // 동일한 가 행이 여러 비교 줄과 연결되면 첫 대응 행을 사용해요.
            if (!pairedA.has(ar))
                pairedA.set(ar, bi - headerB + 1);
        }
        const putCell = (tr, value, header) => {
            const tag = header ? "TH" : "TD";
            let cell = Array.from(tr.children).find(c => c.classList && c.classList.contains("cmp-serial-cell"));
            if (cell && cell.tagName !== tag) {
                const replacement = document.createElement(tag);
                replacement.className = "cmp-serial-cell";
                replacement.setAttribute("contenteditable", "false");
                replacement.style.cssText = cell.style.cssText;

                cell.style.textAlign = "center";
                cell.style.minWidth = "3.2em";

        if (headerB)
            putCell(trsB[0], "번호", true);

            putCell(trsB[j], j - headerB + 1, false);
        // 가 영역: 나 영역과 대응되는 번호만 부여하고, 나에만 있는 행은 공란으로 둬요.
        if (headerA)
            putCell(trsA[0], "번호", true);
        for (let i = headerA; i \u003c trsA.length; i++)
            putCell(trsA[i], pairedA.get(trsA[i]) || "", false);
        return true;
    }
    function run() {
        ensurePanel();
        clearHl();
        clearGaps();
        // barcode 는 확대해야 두 영역이 모두 보여요

            setMemoMax(true);

        sumEl.className = "cmps";
        if (!A.length && !B.length) {
            sumEl.textContent = "비교할 내용이 없어요 (가·나 메모가 모두 비어 있어요)";
            return;
        }

        st.rows = rows;
        st.approx = approx;
        addTableSerials(A, B, rows);
        if (!approx) {
            align(A, B, rows);
            lw1 = ed1.clientWidth;
            lw2 = ed2.clientWidth;
        } // 같은 줄이 좌우 같은 높이에 오도록 빈 칸 끼워 넣기
        const c = { chg: 0, del: 0, add: 0 };
        hs.forEach(h => c[h.k]++);
        if (!hs.length) {
            sumEl.className = "cmps ok";
            sumEl.textContent = "✔ 일치해요 (가 " + A.length + "행 = 나 " + B.length + "행)";

        }

        if (approx)
            listEl.appendChild(mk("div", "cmm", "※ 내용이 너무 많아 순서는 무시하고 '있다/없다'만 비교했어요."));
        const hl = { "cmp-del": [], "cmp-add": [], "cmp-chg": [] };
        hs.forEach((it, idx) => {
            if (it.k === "chg") {
                hl["cmp-chg"].push(rng(A[it.a]), rng(B[it.b]));
            }
            else if (it.k === "del")
                hl["cmp-del"].push(rng(A[it.a]));
            else
                hl["cmp-add"].push(rng(B[it.b]));

                return; // 목록은 300건까지만
            const el = mk("div", "ci"), badge = mk("span", "cb " + it.k, it.k === "chg" ? "변경" : it.k === "del" ? "삭제" : "추가");
            el.appendChild(badge);
            el.appendChild(mk("span", "cn", it.k === "chg" ? "가 " + (it.a + 1) + "행 → 나 " + (it.b + 1) + "행" : it.k === "del" ? "가 " + (it.a + 1) + "행 (나에 없음)" : "나 " + (it.b + 1) + "행 (가에 없음)"));
            if (it.k === "chg") {
                const [ra, rb] = wordDiff(A[it.a].n, B[it.b].n);
                const r1 = mk("div", "cr"), r2 = mk("div", "cr");
                r1.appendChild(mk("i", "", "가"));
                r2.appendChild(mk("i", "", "나"));
                const s1 = mk("span"), s2 = mk("span");
                fill(s1, ra, "del");
                fill(s2, rb, "ins");
                r1.appendChild(s1);
                r2.appendChild(s2);
                el.append(r1, r2);
            }
            else {
                const r = mk("div", "cr");
                r.appendChild(mk("i", "", it.k === "del" ? "가" : "나"));
                r.appendChild(mk("span", "", (it.k === "del" ? A[it.a] : B[it.b]).n));
                el.appendChild(r);
            }
            el.addEventListener("click", () => goTo(it, el));
            listEl.appendChild(el);
        });
        if (hs.length > 300)
            listEl.appendChild(mk("div", "cmm", "목록에는 처음 300건만 보여요. (색 표시는 전부 적용돼요)"));
        if (CH)
            for (const k in hl)
                if (hl[k].length)
                    CSS.highlights.set(k, new Highlight(...hl[k]));

    }

    document.getElementById("cmpBtn").addEventListener("click", run);
    onEd("input", () => {

        sumEl.className = "cmps stale";
        sumEl.textContent = "내용이 바뀌었어요. [비교]를 다시 눌러 주세요.";

/* 모바일: 가로 스크롤 없이 7열 x 6행이 한 화면에 모두 보이게 (자세히 보려면 확대 버튼 / 더블 탭) */
@media (max-width:720px) {
  body {
    padding: 8px 6px;
    gap: 6px;
  }
  #calgrid {
    gap: 2px;
    overflow: hidden;
  }
  .calcell {
    position: relative;
    min-height: 0;
    border-width: 1px;
    border-radius: 5px;
  }
  .calcell:not(.zoom) .calhd {
    padding: 1px 2px;
    gap: 1px;
    font-size: 9px;
    letter-spacing: -.04em;
  }
  .calcell:not(.zoom) .calhdt {
    flex: 0 1 auto;
  }
  /* 모바일 7x6 작은 칸: 음력·공휴일 이름은 숨기고(공휴일은 빨간색만), 확대하면 긴 형태로 보여요 */
  .calcell:not(.zoom) .calhdt .s .x {
    display: none;
  }
  /* 모바일 확대 머리글: 양력 · 음력 · 공휴일을 한 줄에 (넘칠 때만 자연스럽게 줄바꿈) */
  .calcell.zoom .calhd {
    white-space: normal;
  }
  .calcell.zoom .calhdt {
    white-space: normal;
    overflow: visible;
  }
  .calcell.zoom .calhdt .l .sep {
    display: inline;
  }
  .calcell.zoom .calhdt .l .lx {
    display: inline;
    font-size: 12px;
    font-weight: 600;
  }
  .calcell:not(.zoom) .calzoom {
    margin-left: auto;
    width: 13px;
    height: 13px;
    font-size: 10px;
    opacity: .9;
  }
  /* 요일 오른쪽 빈 자리에 */
  .calcell:not(.zoom) .calzoom::after {
    content: "";
    position: absolute;
    inset: -3px;
  }
  /* 모바일 작은 칸: 제목이 있으면 제목이 칸을 채우고(본문은 확대해서 봐요), 제목이 없으면 한 줄 제목칸 + 본문 미리보기 */
  .calcell:not(.zoom) .caltt {
    padding: 2px 3px;
    font-size: 9px;
    line-height: 1.25;
    height: calc(1.25em + 4px);
    letter-spacing: -.03em;
  }
  .calcell:not(.zoom).has-t .caltt {
    flex: 1;
    min-height: 0;
    height: auto;
    white-space: normal;
    border-bottom: 0;
  }
  .calcell:not(.zoom).has-t .rich {
    display: none;
  }
  .calcell:not(.zoom) .rich {
    padding: 2px 3px;
    font-size: 10px;
    line-height: 1.3;
    overflow: hidden;
    touch-action: manipulation;
  }
}
/* 모바일 세로: 7x6 을 한 화면에 억지로 욱여넣으면 칸이 너무 낮아 윗줄 제목과 아랫줄 날짜가 겹쳐요
   → 한 칸의 최소 높이(76px: 날짜줄 + 제목 3줄이 들어가는 높이)를 보장하고, 모자라면 달력 영역(#calgrid)만 세로로 스크롤해요.
   (화면이 충분히 높으면 예전처럼 6행이 화면을 꽉 채워요. 가로 모드는 그대로) */
@media (max-width:720px) and (orientation:portrait) {
  #calgrid {
    grid-template-rows: repeat(6,minmax(76px,1fr));
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  #calgrid.zooming {
    overflow: hidden;
  }
}

    /* 두 iframe에서 공통으로 쓰는 제목 전환 스타일과 동작 */
    const SWITCH_CSS = `
    html.newmm-in { padding-top: 0 !important; padding-bottom: 0 !important; }
    html.newmm-in header h1 {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html.newmm-in header h1:hover { text-decoration: underline; text-underline-offset: 4px; }
    html.newmm-in header h1:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      border-radius: 4px;
    }
  `;
    function setupSharedSwitch(frame, name) {
        const doc = frame.contentDocument;
        if (!doc)
            return;
        doc.documentElement.classList.add("newmm-in");
        const style = doc.createElement("style");
        style.id = "newmm-switch-css";
        style.textContent = SWITCH_CSS;
        doc.head.appendChild(style);
        const heading = doc.querySelector("header h1");
        if (!heading)
            return;
        heading.setAttribute("role", "button");
        heading.tabIndex = 0;
        heading.title = `클릭하면 [${VIEWS[name].other === "cal" ? VIEWS.cal.label : VIEWS.memo.label}]로 전환해요`;
        // 같은 출처의 srcdoc iframe에서는 부모의 전환 함수를 직접 호출합니다.
        // postMessage만 사용하면 임베딩/브라우저 환경에 따라 요청이 전달되어도
        // 부모 쪽 source 판별에서 누락될 수 있어 직접 호출을 우선합니다.
        const go = (event) => {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            try {
                if (typeof frame.contentWindow.parent.__NEWMM_SWITCH__ === "function") {
                    frame.contentWindow.parent.__NEWMM_SWITCH__(name);
                    return;
                }
            }
            catch (error) { }
            try {
                frame.contentWindow.parent.postMessage({ newmm: "switch", from: name }, "*");
            }
            catch (error) { }
        };
        heading.addEventListener("click", go, true);
        heading.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                go();
            }
        });
    }
    // 메모장 헤더의 최소 높이를 달력 메모 헤더와 동기화합니다.
    function syncHeaderHeight() {
        const memoHeader = frames.memo && frames.memo.contentDocument && frames.memo.contentDocument.querySelector("header");
        const calHeader = frames.cal && frames.cal.contentDocument && frames.cal.contentDocument.querySelector("header");
        if (!memoHeader || !calHeader)
            return;
        memoHeader.style.minHeight = Math.ceil(calHeader.getBoundingClientRect().height) + "px";
    }
    window.addEventListener("resize", syncHeaderHeight, { passive: true });
    function composeApp(name, options = null) {
        let html = APPS[name];
        // 두 화면이 같이 쓰는 툴바·팝업 HTML을 원래 자리에 삽입하고, 화면마다 다른 부분은 슬롯으로 채웁니다.
        html = html.replace("\u003c!-- NEWMM_SHARED_HTML:editorChrome -->", () => SHARED_HTML.editorChrome);
        html = html.replace(/\u003c!--NEWMM_SLOT:(\w+)-->/g, (all, key) => (APP_SLOTS[name] && APP_SLOTS[name][key]) || "");
        // 공통 JavaScript 조각은 화면 스크립트의 원래 자리에 그대로 끼워 넣어 같은 스코프에서 실행합니다.
        // (조각 안에 다른 조각 표식이 있어도 풀리도록 더 바뀔 것이 없을 때까지 반복합니다.)
        for (let pass = 0; pass < 10; pass++) {
            const before = html;
            html = html.replace(/\/\* NEWMM_SHARED_CODE:(\w+) \*\//g, (all, key) => {
                if (!Object.prototype.hasOwnProperty.call(SHARED_CODE, key))
                    throw new Error("공통 코드 조각이 없습니다: " + key);
                return SHARED_CODE[key];
            });
            if (html === before)
                break;
        }
        // 공통 CSS는 원래 선언 위치에 삽입해 화면별 CSS 우선순위를 그대로 유지합니다.
        SHARED_STYLES.forEach((css, index) => {
            html = html.replace(`/* NEWMM_SHARED_STYLE_${index} */`, () => css);
        });
        // 이미지 편집 엔진은 각 화면의 편집 영역 참조를 유지한 채 원본 코드만 한 곳에서 관리합니다.
        html = html.replace("/* NEWMM_SHARED_IMAGE_EDITOR */", () => SHARED_SCRIPTS.imageEditor);
        // 공통 JavaScript 도우미는 화면별 앱 스크립트보다 앞에서 실행합니다.
        for (const [key, code] of Object.entries(SHARED_SCRIPTS)) {
            if (key === "imageEditor")
                continue;
            html = html.replace(`\u003c!-- NEWMM_SHARED_${key.toUpperCase()} -->`, () => `\u003cscript>${code}\u003c/script>`);
        }
        // 템플릿에 명시한 DB 버튼 전용 슬롯만 채웁니다. 기존 버튼을 정규식으로 찾아 제거하지 않습니다.
        const dbButtons = window.NEWMM_DB_URLS.map((url, index) => {
            if (!url)
                return "";
            return `<button type="button" class="fbbtn dbbtn" data-i="${index}">DB${index + 1}</button>`;
        }).join("");
        html = html.replace('<span id="dbButtonsSlot"></span>', dbButtons);
        // 달력의 DB 작은 편집칸(여유 칸 수만큼)은 메모장 앱을 그대로 재사용하되, 각 칸의 DB 번호를 고정하고 기본은 로컬로 시작합니다.
        if (options && Number.isInteger(options.dbSlotIndex)) {
            const slotIndex = Math.max(0, Math.min(41, options.dbSlotIndex));
            html = html.replace(/let dbIdx = 0;[^\n]*\n\s*try\s*\{[\s\S]*?localStorage\.getItem\(DBSEL\)[\s\S]*?\n\s*\}\s*catch\s*\(e\)\s*\{\s*\}/, `let dbIdx = ${slotIndex}; // DB 슬롯은 해당 번호에 고정`);
            html = html.replace('let useFb = !!(saved && saved.fb === true);', 'let useFb = false;');
            html = html.replace('const KEY = "memo-state";', `const KEY = "memo-dbslot-${slotIndex + 1}";`);
            html = html.replace('const stateKey = () => dbIdx === 0 ? KEY : KEY + "-" + (dbIdx + 1);', 'const stateKey = () => KEY;');
            const slotCss = `
        #dbGrp .dbloc, #dbGrp .dbbtn:not(.dbloc) { display:none !important; }
        body.dbslot-mini { display:block !important; position:relative !important; padding:0 !important; margin:0 !important; gap:0 !important; overflow:hidden !important; }
        body.dbslot-mini > header, body.dbslot-mini .tb, body.dbslot-mini #tbar, body.dbslot-mini #fbar,
        body.dbslot-mini #toast, body.dbslot-mini #pwBox, body.dbslot-mini .imgx-bar,
        body.dbslot-mini .imgx-box, body.dbslot-mini .imgx-hint, body.dbslot-mini #edgut { display:none !important; }
        /* 미니창에서는 % 높이 계산이 중첩 flex/grid에 의해 축소되는 것을 피하기 위해 iframe viewport 기준으로 배치 */
        body.dbslot-mini #edwrap, body.dbslot-mini #edsplit { display:block !important; position:fixed !important; visibility:visible !important; inset:0 !important; width:100vw !important; height:100vh !important; min-width:0 !important; min-height:0 !important; margin:0 !important; padding:0 !important; overflow:hidden !important; }
        body.dbslot-mini #memo, body.dbslot-mini #memo2 { display:block !important; visibility:visible !important; opacity:1 !important; position:fixed !important; top:0 !important; bottom:18px !important; left:auto !important; right:auto !important; width:50vw !important; height:auto !important; min-width:0 !important; min-height:0 !important; max-width:none !important; max-height:none !important; margin:0 !important; padding:3px 4px !important; overflow:auto !important; box-sizing:border-box !important; border:1px solid rgba(118,85,201,.42) !important; border-bottom:0 !important; border-radius:4px 4px 0 0 !important; background:var(--card) !important; color:var(--mfg) !important; -webkit-text-fill-color:var(--mfg) !important; font-size:10px !important; line-height:1.25 !important; transform:none !important; clip:auto !important; clip-path:none !important; }
        body.dbslot-mini #memo { left:0 !important; }
        body.dbslot-mini #memo2 { left:50vw !important; }
        body.dbslot-mini #memo::before, body.dbslot-mini #memo2::before { content:none !important; display:none !important; }
        .dbslot-pane-title { display:none !important; }
        body.dbslot-mini .dbslot-pane-title { display:flex !important; visibility:visible !important; opacity:1 !important; position:fixed !important; bottom:0 !important; top:auto !important; width:50vw !important; height:18px !important; min-width:0 !important; min-height:0 !important; max-width:none !important; max-height:18px !important; margin:0 !important; padding:0 1px !important; overflow:hidden !important; box-sizing:border-box !important; align-items:center !important; justify-content:center !important; text-align:center !important; border:1px solid rgba(118,85,201,.42) !important; border-top:0 !important; border-radius:0 0 4px 4px !important; background:rgba(118,85,201,.10) !important; color:var(--ink) !important; font-size:7px !important; font-weight:700 !important; line-height:7px !important; }
        body.dbslot-mini .dbslot-pane-a { left:0 !important; right:auto !important; }
        body.dbslot-mini .dbslot-pane-b { left:50vw !important; right:0 !important; }
        body.dbslot-mini #edsplit > :not(#memo):not(#memo2):not(.dbslot-pane-title) { display:none !important; }
        body.dbslot-mini #edwrap.c1, body.dbslot-mini #edwrap.c2, body.dbslot-mini #edwrap.c3 { visibility:visible !important; }
      `;
            html = html.replace('</head>', `<style id="newmm-db-slot-css">${slotCss}</style></head>`);
        }
        return html;
    }
    window.NEWMM_COMPOSE_APP = (name, options) => composeApp(name, options);
    function pick() {
        const hash = (location.hash || "").slice(1);
        if (VIEWS[hash])
            return hash;
        try {
            const saved = localStorage.getItem(KEY);
            if (VIEWS[saved])
                return saved;
        }
        catch (error) { }
        return "memo";
    }
    /* 화면은 처음 필요할 때 만들고 이후 계속 유지해 입력·커서·확대 상태를 보존합니다. */
    function create(name, done) {
        const frame = document.createElement("iframe");
        frame.title = VIEWS[name].label;
        frame.setAttribute("allow", "clipboard-read; clipboard-write; local-fonts; fullscreen");
        frame.addEventListener("load", function onLoad() {
            frame.__ready = true;
            setupSharedSwitch(frame, name);
            if (name === "cal" && window.ResizeObserver) {
                const calHeader = frame.contentDocument && frame.contentDocument.querySelector("header");
                if (calHeader) {
                    frame.__headerObserver = new ResizeObserver(syncHeaderHeight);
                    frame.__headerObserver.observe(calHeader);
                }
            }
            syncHeaderHeight();
            if (done) {
                const callback = done;
                done = null;
                callback(frame);
            }
        });
        frame.srcdoc = composeApp(name);
        frames[name] = frame;
        stage.appendChild(frame);
        return frame;
    }
    /* 저장 위치 선택 읽기/맞추기: -1 = Local PC 사용, 0~4 = DB1~DB5 */
    function dbState(frame) {
        try {
            const doc = frame.contentDocument;
            const localButton = doc.getElementById("fbBtn");
            if (localButton && localButton.getAttribute("aria-pressed") === "true")
                return -1;
            const buttons = doc.querySelectorAll(".dbbtn[data-i]");
            for (let i = 0; i < buttons.length; i++) {
                if (buttons[i].getAttribute("aria-pressed") === "true") {
                    return Number(buttons[i].getAttribute("data-i"));
                }
            }
        }
        catch (error) { }
        return null;
    }
    function setDb(frame, index) {
        try {
            const doc = frame.contentDocument;
            const button = index < 0
                ? doc.getElementById("fbBtn")
                : doc.querySelector(`.dbbtn[data-i="${index}"]`);
            if (button && !button.disabled && dbState(frame) !== index)
                button.click();
        }
        catch (error) { }
    }
    function show(name) {
        Object.keys(frames).forEach((key) => {
            const isActive = key === name;
            const frame = frames[key];
            frame.classList.toggle("on", isActive);
            frame.setAttribute("aria-hidden", isActive ? "false" : "true");
            if (isActive)
                frame.removeAttribute("inert");
            else
                frame.setAttribute("inert", "");
            try {
                frame.contentWindow.__NEWMM_ACTIVE__ = isActive;
                if (isActive && typeof frame.contentWindow.__NEWMM_RESUME_POLL__ === "function") {
                    frame.contentWindow.__NEWMM_RESUME_POLL__();
                }
            }
            catch (error) { }
        });
        cur = name;
        document.title = VIEWS[name].label;
        try {
            localStorage.setItem(KEY, name);
        }
        catch (error) { }
        try {
            history.replaceState(null, "", "#" + name);
        }
        catch (error) { }
        try {
            frames[name].contentWindow.focus();
        }
        catch (error) { }
    }
    function switchTo(name) {
        if (!VIEWS[name] || name === cur)
            return;
        // 전환 요청이 대상 iframe 로딩 중에 들어와도 버리지 않고,
        // 로딩이 끝나는 즉시 전환합니다.
        const state = SYNC_DB && cur && frames[cur] ? dbState(frames[cur]) : null;
        const go = (target) => {
            if (state !== null)
                setDb(target, state);
            show(name);
        };
        const frame = frames[name];
        if (!frame) {
            create(name, go);
            return;
        }
        if (frame.__ready) {
            go(frame);
            return;
        }
        if (frame.__switchWaiters)
            return;
        frame.__switchWaiters = true;
        frame.addEventListener("load", function onSwitchReady() {
            frame.removeEventListener("load", onSwitchReady);
            frame.__switchWaiters = false;
            if (frame.__ready && cur !== name)
                go(frame);
        });
    }
    // iframe에서 직접 호출하는 전환 진입점
    window.__NEWMM_SWITCH__ = function (from) {
        if (!VIEWS[from])
            return;
        switchTo(VIEWS[from].other);
    };
    window.addEventListener("message", function (event) {
        const data = event.data;
        if (!data || data.newmm !== "switch")
            return;
        if (data.from && VIEWS[data.from]) {
            switchTo(VIEWS[data.from].other);
            return;
        }
        for (const key in frames) {
            if (frames[key].contentWindow === event.source) {
                switchTo(VIEWS[key].other);
                return;
            }
        }
    });
    window.addEventListener("hashchange", function () {
        const hash = (location.hash || "").slice(1);
        if (VIEWS[hash])
            switchTo(hash);
    });
    const first = pick();
    create(first, () => show(first));
})();</script>
