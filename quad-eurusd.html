<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUR/USD 차트</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e3e6ea;
      --gap: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --card: #1c1f27;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --border: #2b2f3a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: var(--gap);
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    /* 상단 시세 (TradingView Single Ticker 위젯) */
    .top {
      flex: 0 0 auto;
      height: 120px;
      display: flex;
      gap: var(--gap);
    }
    .single {
      min-width: 0;
      height: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 8px;
      overflow: hidden;
      contain: size layout paint;
    }
    /* 차트 한 칸 폭과 동일 (전체 폭으로 하려면 flex: 1 1 0; 로 변경) */
    .single { flex: 0 0 calc((100% - var(--gap)) / 2); }
    .single > tv-single-ticker {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 남은 공간을 2x2 칸으로 균등 분할 */
    .grid {
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: var(--gap);
    }
    section {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    h2 {
      font-size: 0.8rem;
      line-height: 1.2;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 6px 2px;
    }
    .box {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      contain: size layout paint;
    }
    .box > tv-advanced-chart {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 640px) {
      html, body { height: auto; }
      .top { flex-direction: column; height: auto; }
      .single { height: 120px; flex: none; }
      .grid {
        flex: none;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: none;
        grid-auto-rows: 460px;
      }
    }
  </style>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-single-ticker.js"></script>
</head>
<body>
  <div class="top">
    <div class="single">
      <tv-single-ticker symbol="FX:EURUSD"></tv-single-ticker>
    </div>
  </div>

  <div class="grid">
    <section>
      <h2>Advanced Chart · 15분</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="15" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>

    <section>
      <h2>Advanced Chart · 3분</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="3" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>

    <section>
      <h2>Advanced Chart · 일</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="1D" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>

    <section>
      <h2>Advanced Chart · 1시간</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="60" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>
  </div>
</body>
</html>
