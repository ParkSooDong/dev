<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synced Chart</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e3e6ea;
      --gap: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --card: #1c1f27;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --border: #2b2f3a;
      }
    }
    svg.kr { display: inline-block; vertical-align: -0.2em; fill: currentColor; overflow: visible; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: var(--gap);
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }
    body.has-max { overflow: hidden; }

    .slot { position: relative; min-width: 0; min-height: 0; }
    .pane {
      position: absolute;
      inset: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .pane.max { position: fixed; inset: 0; z-index: 1000; border-radius: 0; }

    .expand {
      position: absolute;
      top: 6px;
      right: 8px;
      z-index: 5;
      width: 26px;
      height: 26px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 15px;
      line-height: 1;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    .expand:hover { color: var(--text); border-color: var(--muted); }
    .pane.single .expand { top: auto; bottom: 6px; }
    .pane.max .expand { top: 10px; right: 12px; bottom: auto; width: 32px; height: 32px; font-size: 18px; }

    .top { flex: 0 0 auto; height: 120px; display: flex; gap: var(--gap); }
    .slot-single  { flex: 0 0 calc((100% - var(--gap)) / 2); }
    .slot-readout { flex: 1 1 0; }

    .pane.single { padding: 0; contain: size layout paint; }

    /* ---------- Right-to-left scrolling ticker ---------- */
    .mq-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
              mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
    }
    .mq-track {
      display: flex;
      flex: none;
      width: max-content;
      animation: mq-scroll var(--mq-dur, 40s) linear infinite;
      will-change: transform;
    }
    .mq-viewport:hover .mq-track { animation-play-state: paused; }
    .mq-group { display: flex; flex: none; }
    @keyframes mq-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .mq-item {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      padding: 0 26px;
      border-right: 1px solid var(--border);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .mq-top  { display: flex; align-items: baseline; gap: 8px; }
    .mq-code  { font-size: 1.05rem; font-weight: 800; }
    .mq-name  { font-size: 0.85rem; color: var(--muted); }
    .mq-price { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
    .mq-chg   { font-size: 0.95rem; font-weight: 700; }
    .mq-item .up   { color: #089981; }
    .mq-item .down { color: #f23645; }
    .mq-item .flat { color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      .mq-item .up   { color: #22ab94; }
      .mq-item .down { color: #f7525f; }
    }
    .mq-msg { padding: 0 26px; color: var(--muted); font-size: 0.95rem; white-space: nowrap; }
    .mq-status {
      position: absolute; left: 10px; bottom: 3px; z-index: 4;
      font-size: 0.68rem; color: var(--muted);
      max-width: calc(100% - 52px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      background: var(--card); padding: 0 4px; border-radius: 4px;
    }
    .pane.single.max .mq-price { font-size: clamp(2.5rem, 6vw, 6rem); }
    .pane.single.max .mq-code  { font-size: clamp(1.5rem, 3vw, 3rem); }
    .pane.single.max .mq-name  { font-size: clamp(1rem, 2vw, 2rem); }
    .pane.single.max .mq-chg   { font-size: clamp(1.1rem, 2.4vw, 2.4rem); }

    /* the old single ticker is removed from view; it only stays as an off-screen data source for the readout pane */
    .mq-src { position: fixed; left: -10000px; top: 0; width: 320px; opacity: 0; pointer-events: none; }
    .mq-src > * { display: block; width: 320px; height: 120px; }
    .hidden-src { position: fixed; left: -10000px; top: 0; width: 320px; height: 120px; opacity: 0; pointer-events: none; }

    .cropbox { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .cropee  { display: block; width: 100%; height: 100%; transform-origin: 0 0; }

    .readout-view {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      align-content: center;
      gap: 2px 20px;
      padding: 8px 16px;
    }
    .readout .name  { font-size: 1.8rem; font-weight: 800; }
    .readout .price { font-size: 2.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .readout .chg   { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .readout .time  { width: 100%; font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .readout .up   { color: #089981; }
    .readout .down { color: #f23645; }
    .readout .flat { color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      .readout .up   { color: #22ab94; }
      .readout .down { color: #f7525f; }
    }
    .pane.readout.max .readout-view { justify-content: center; align-content: center; gap: 1vh 4vw; }
    .readout.max .name  { font-size: clamp(2rem, 7vw, 7rem); }
    .readout.max .price { font-size: clamp(3rem, 12vw, 12rem); }
    .readout.max .chg   { font-size: clamp(1.5rem, 5vw, 5rem); }
    .readout.max .time  { font-size: clamp(1rem, 2vw, 2rem); text-align: center; }

    .grid {
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: var(--gap);
    }
    .pane.chart {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 8px;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 34px 6px 2px;
    }
    h2 {
      font-size: 0.8rem;
      line-height: 1.2;
      color: var(--muted);
      font-weight: 600;
      margin: 0;
    }
    .symform { display: flex; gap: 4px; margin-left: auto; }
    .symform input {
      width: 140px;
      font-size: 0.75rem;
      padding: 2px 6px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
    }
    .symform button {
      font-size: 0.75rem;
      padding: 2px 8px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
    }

    .head { position: relative; }
    .keys-pop {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 20;
      width: 300px;
      max-height: 70vh;
      overflow: auto;
      padding: 10px 12px;
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    .keys-pop.open { display: block; }
    .keys-pop .sep { margin: 6px 0; border: 0; border-top: 1px solid var(--border); }
    .keys-pop .row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
    .keys-pop kbd {
      font-family: inherit;
      font-size: 0.72rem;
      padding: 0 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      white-space: nowrap;
    }
    .keys-pop .note { margin-top: 8px; font-size: 0.7rem; color: var(--muted); }
    .box {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      contain: size layout paint;
    }
    .box > tv-advanced-chart { display: block; width: 100%; height: 100%; }

    @media (max-width: 640px) {
      html, body { height: auto; }
      .top { flex-direction: column; height: auto; }
      .slot-single, .slot-readout { flex: none; height: 120px; }
      .readout .name  { font-size: 1.3rem; }
      .readout .price { font-size: 1.8rem; }
      .readout .chg   { font-size: 1.1rem; }
      .grid {
        flex: none;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: none;
        grid-auto-rows: 460px;
      }
    }
  </style>
  <script>
    const _attachShadow = Element.prototype.attachShadow;
    Element.prototype.attachShadow = function (init) {
      return _attachShadow.call(this, { ...init, mode: 'open' });
    };
  </script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-single-ticker.js"></script>
</head>

  <script>
    // ---------- Expand / collapse ----------
    function setMax(pane, on) {
      document.querySelectorAll('.pane.max').forEach(p => {
        p.classList.remove('max');
        p.querySelector('.expand').textContent = '⤢';
      });
      if (on) {
        pane.classList.add('max');
        pane.querySelector('.expand').textContent = '✕';
      }
      document.body.classList.toggle('has-max', on);
      window.dispatchEvent(new Event('resize'));
    }
    document.querySelectorAll('.pane').forEach(pane => {
      pane.querySelector('.expand').addEventListener('click', e => {
        e.stopPropagation();
        setMax(pane, !pane.classList.contains('max'));
      });
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const open = document.querySelector('.pane.max');
        if (open) setMax(open, false);
      }
    });

    // ---------- Crop / zoom ----------
    function applyCrop(box) {
      const target = box.querySelector('.cropee');
      if (!target) return;
      const v = (box.dataset.crop || '').trim().split(/[\s,]+/).map(Number);
      const W = box.clientWidth, H = box.clientHeight;
      if (v.length !== 4 || v.some(isNaN) || !W || !H) { target.style.transform = ''; return; }
      const [x1, x2, y1, y2] = v;
      const rw = (x2 - x1) / 100, rh = (y2 - y1) / 100;
      if (rw <= 0 || rh <= 0) { target.style.transform = ''; return; }
      if (x1 <= 0 && x2 >= 100 && y1 <= 0 && y2 >= 100) { target.style.transform = ''; return; }
      if (box.dataset.cropFit === 'contain') {
        const s = Math.min(1 / rw, 1 / rh);
        const cx = ((x1 + x2) / 200) * W, cy = ((y1 + y2) / 200) * H;
        target.style.transform = `translate(${W / 2 - s * cx}px, ${H / 2 - s * cy}px) scale(${s})`;
      } else {
        const sx = 1 / rw, sy = 1 / rh;
        target.style.transform = `translate(${-sx * (x1 / 100) * W}px, ${-sy * (y1 / 100) * H}px) scale(${sx}, ${sy})`;
      }
    }
    const cropObserver = new ResizeObserver(entries => entries.forEach(e => applyCrop(e.target)));
    document.querySelectorAll('[data-crop]').forEach(box => {
      cropObserver.observe(box);
      new MutationObserver(() => applyCrop(box)).observe(box, { attributes: true, attributeFilter: ['data-crop', 'data-crop-fit'] });
      applyCrop(box);
    });

    // ---------- Single ticker readout ----------
    let $ticker = document.querySelector('tv-single-ticker');
    const $name = document.getElementById('r-name');
    const $price = document.getElementById('r-price');
    const $chg = document.getElementById('r-chg');
    const $time = document.getElementById('r-time');
    const fmtTime = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Seoul', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
    });

    function collect(root, out) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
      let n;
      while ((n = walker.nextNode())) {
        if (n.nodeType === Node.TEXT_NODE) {
          const p = n.parentElement;
          if (p && /^(STYLE|SCRIPT)$/.test(p.tagName)) continue;
          const t = n.textContent.trim();
          if (t) out.texts.push(t);
        } else {
          if (n.tagName === 'IFRAME') out.iframe = true;
          if (n.shadowRoot) collect(n.shadowRoot, out);
        }
      }
    }
    function read() {
      const out = { texts: [], iframe: false };
      if ($ticker.shadowRoot) collect($ticker.shadowRoot, out);
      collect($ticker, out);
      const joined = out.texts.join(' ');
      // price: allow 2-6 decimals so non-FX symbols (e.g. 5432.10) also parse
      const m = joined.match(/(\d[\d,]*\.\d{2,6})\s*(?:[A-Z]{3})?\s*([+\-−]?\d[\d,]*\.\d+)\s*([+\-−]?\d+\.\d+)\s*%/);
      return { out, joined, m };
    }
    let lastPrice = null;
    function update() {
      const { out, joined, m } = read();
      if (!m) {
        $time.textContent = out.iframe
          ? 'Cannot read: widget is rendered in an iframe'
          : ($ticker.shadowRoot ? 'Value not found (check tvRaw in the console)' : 'Reading…');
        window.tvRaw = joined;
        return;
      }
      const price = m[1];
      const pctNum = parseFloat(m[3].replace('−', '-'));
      const sign = m[3].replace('−', '-').startsWith('-') ? '-' : (pctNum > 0 ? '+' : '');
      const cls = pctNum > 0 ? 'up' : pctNum < 0 ? 'down' : 'flat';
      const absChg = m[2].replace(/^[+\-−]/, '');
      $price.textContent = price;
      $chg.className = 'chg ' + cls;
      $chg.textContent = `Change ${sign}${absChg} (${sign}${m[3].replace(/^[+\-−]/, '')}%)`;
      if (price !== lastPrice) {
        lastPrice = price;
        $time.textContent = 'Last update ' + fmtTime.format(new Date()) + ' KST (browser time)';
      }
    }
    setInterval(update, 500);

    // ---------- Symbol sync: master chart -> all other charts + ticker ----------
    let master = document.getElementById('master');
    const symInput = document.getElementById('symInput');
    let currentSymbol = 'FX:EURUSD';

    function normalize(s) {
      s = String(s || '').trim().toUpperCase().replace(/\s+/g, '');
      if (!s) return '';
      if (!s.includes(':') && /^[A-Z]{6}$/.test(s)) s = 'FX:' + s;   // EURUSD -> FX:EURUSD
      return s;
    }

    function replaceWith(oldEl, tag, attrs) {
      const el = document.createElement(tag);
      el.className = oldEl.className;
      for (const [k, v] of Object.entries(attrs)) if (v !== null) el.setAttribute(k, v);
      oldEl.replaceWith(el);
      return el;
    }

    function applySymbol(raw, source) {
      const sym = normalize(raw);
      if (!sym) return;
      currentSymbol = sym;
      symInput.value = sym;

      // 1) all four charts (recreated so the new symbol is loaded for sure)
      document.querySelectorAll('tv-advanced-chart').forEach(old => {
        const isMaster = old === master;
        const box = old.closest('[data-crop]');
        const el = replaceWith(old, 'tv-advanced-chart', {
          symbol: sym,
          interval: old.getAttribute('interval'),
          timezone: old.getAttribute('timezone'),
          'allow-symbol-change': ''
        });
        if (isMaster) { el.id = 'master'; master = el; }
        if (box) requestAnimationFrame(() => applyCrop(box));
      });

      // 2) the top ticker + the readout title
      const t = replaceWith($ticker, 'tv-single-ticker', { symbol: sym });
      $ticker = t;
      lastPrice = null;
      $price.textContent = '--';
      $chg.className = 'chg flat';
      $chg.textContent = 'Change --';
      $time.textContent = 'Reading ticker value…';
      $name.textContent = sym.split(':').pop();
      const tbox = t.closest('[data-crop]');
      if (tbox) requestAnimationFrame(() => applyCrop(tbox));
    }

    // symbol input drives all 4 charts + ticker
    document.getElementById('symform').addEventListener('submit', e => {
      e.preventDefault();
      applySymbol(symInput.value, 'input');
    });

    // ---------- Scrolling rate ticker ----------
    // src 'tv'   : read from hidden TradingView widgets (same symbols as wonforecast.com's rates table)
    // src 'naver': Naver Finance JSON (KRX symbols are blocked in TradingView's free embed widgets)
    const MQ_ITEMS = [
      { code: 'USDKRW',   src: 'tv', sym: 'FX_IDC:USDKRW', name: '달러' },
      { code: 'EURUSD',   src: 'tv', sym: 'FX_IDC:EURUSD', name: '유로 / 달러' },
      { code: 'USDJPY',   src: 'tv', sym: 'FX_IDC:USDJPY', name: '달러 / 일본 엔' },
      { code: 'XAUUSD',   src: 'tv', sym: 'FX_IDC:XAUUSD', name: '달러 골드 $' },
      { code: 'USOIL',    src: 'tv', sym: 'TVC:USOIL',     name: '원유 WTI $' },
      { code: 'KOSPI',    src: 'naver', naver: 'KOSPI',    name: '코스피' },
      { code: 'KOSPI200', src: 'naver', naver: 'KPI200',   name: '코스피200' }
    ];
    const MQ_SPEED_PX_S = 70;
    const MQ_NAVER_MS = 5000;
    const MQ_RE = /(\d[\d,]*\.\d{2,6})\s*(?:[A-Z]{3})?\s*([+\-−]?\d[\d,]*\.\d+)\s*([+\-−]?\d+\.\d+)\s*%/;
    // direct first; if the browser blocks it (CORS / file://), fall back to a public relay
    const MQ_NAVER_ROUTES = [
      u => u,
      u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)
    ];
    const $mqTrack = document.getElementById('mqTrack');
    const $mqView = document.getElementById('mqViewport');
    const $mqStatus = document.getElementById('mqStatus');
    const $mqSrc = document.getElementById('mqSrc');
    const mqStart = Date.now();
    let mqData = {};            // code -> {price, chg, pct, dir}
    let mqLastTv = '', mqLastNaver = '';
    let mqNaverRoute = 0;       // index of the route that worked last
    const mqNaverErr = {};      // code -> last error text

    MQ_ITEMS.filter(it => it.src === 'tv').forEach(it => {
      const el = document.createElement('tv-single-ticker');
      el.setAttribute('symbol', it.sym);
      $mqSrc.appendChild(el);
      it.el = el;
    });

    const mqNum = s => parseFloat(String(s).replace(/[,%\s]/g, '').replace('−', '-'));
    const mqNeg = s => /^\s*[\-−]/.test(String(s));
    const mqAbs = s => String(s).replace(/^[+\-−]\s*/, '');
    function mqMake(m) {
      const dir = (mqNeg(m[3]) || mqNeg(m[2])) ? -1 : ((mqNum(m[3]) > 0 || mqNum(m[2]) > 0) ? 1 : 0);
      return { price: m[1], chg: mqAbs(m[2]), pct: mqAbs(m[3]), dir };
    }

    function mqFill(el, it) {
      const d = mqData[it.code];
      el.querySelector('.mq-price').textContent = d ? d.price : '--';
      const chg = el.querySelector('.mq-chg');
      chg.className = 'mq-chg ' + (!d ? 'flat' : d.dir > 0 ? 'up' : d.dir < 0 ? 'down' : 'flat');
      if (!d) { chg.textContent = '--'; return; }
      const sg = d.dir > 0 ? '+' : d.dir < 0 ? '-' : '';
      const arrow = d.dir > 0 ? '▲ ' : d.dir < 0 ? '▼ ' : '';
      chg.textContent = `${arrow}${sg}${d.chg} (${sg}${d.pct}%)`;
    }

    function mqBuildItem(it) {
      const el = document.createElement('div');
      el.className = 'mq-item';
      el.dataset.code = it.code;
      const top = document.createElement('div'); top.className = 'mq-top';
      const code = document.createElement('span'); code.className = 'mq-code'; code.textContent = it.code;
      const name = document.createElement('span'); name.className = 'mq-name'; name.textContent = it.name;
      top.append(code, name);
      const price = document.createElement('div'); price.className = 'mq-price';
      const chg = document.createElement('div'); chg.className = 'mq-chg flat';
      el.append(top, price, chg);
      mqFill(el, it);
      return el;
    }

    function mqRender() {
      const makeGroup = n => {
        const g = document.createElement('div'); g.className = 'mq-group';
        for (let i = 0; i < n; i++) MQ_ITEMS.forEach(it => g.appendChild(mqBuildItem(it)));
        return g;
      };
      $mqTrack.replaceChildren(makeGroup(1));
      const gw = $mqTrack.firstChild.offsetWidth || 1;
      const vw = $mqView.clientWidth || 1;
      const n = Math.max(1, Math.ceil(vw / gw) + 1);
      const g1 = makeGroup(n), g2 = makeGroup(n);
      $mqTrack.replaceChildren(g1, g2);
      const w = g1.offsetWidth || gw;
      $mqTrack.style.setProperty('--mq-dur', Math.max(15, w / MQ_SPEED_PX_S) + 's');
    }

    // store a new value; rebuild once when an item first appears (widths change), otherwise update text in place
    function mqApply(it, d) {
      const old = mqData[it.code];
      if (old && old.price === d.price && old.chg === d.chg && old.pct === d.pct && old.dir === d.dir) return false;
      mqData[it.code] = d;
      if (!old) mqRender();
      else $mqTrack.querySelectorAll(`.mq-item[data-code="${it.code}"]`).forEach(el => mqFill(el, it));
      return true;
    }

    function mqStatusUpdate() {
      const parts = [];
      if (mqLastTv) parts.push('TradingView ' + mqLastTv);
      if (mqLastNaver) parts.push('네이버 ' + mqLastNaver + (mqNaverRoute ? ' (relay)' : ''));
      let msg = parts.length ? parts.join(' · ') + ' KST' : '';
      const missing = MQ_ITEMS.filter(i => !mqData[i.code]);
      if (missing.length && Date.now() - mqStart > 15000) {
        const diag = missing.map(it => {
          if (it.src === 'naver') return `${it.code}: ${mqNaverErr[it.code] || 'waiting'}`;
          const out = { texts: [], iframe: false };
          if (it.el.shadowRoot) collect(it.el.shadowRoot, out);
          collect(it.el, out);
          const raw = out.texts.join(' ').replace(/\s+/g, ' ').trim();
          return `${it.code}: ${raw ? '"' + raw.slice(0, 70) + '"' : (it.el.shadowRoot ? 'empty' : 'widget not loaded')}${out.iframe ? ' [iframe]' : ''}`;
        });
        window.mqDiag = diag;
        msg += (msg ? ' · ' : '') + 'No data → ' + diag.join(' | ');
      }
      if (msg !== $mqStatus.textContent) { $mqStatus.textContent = msg; $mqStatus.title = msg; }
    }

    // --- TradingView widgets (polled every second) ---
    function mqPollTv() {
      MQ_ITEMS.filter(it => it.src === 'tv').forEach(it => {
        const out = { texts: [], iframe: false };
        if (it.el.shadowRoot) collect(it.el.shadowRoot, out);
        collect(it.el, out);
        const m = out.texts.join(' ').match(MQ_RE);
        if (m && mqApply(it, mqMake(m))) mqLastTv = fmtTime.format(new Date());
      });
      mqStatusUpdate();
    }

    // --- Naver Finance JSON ---
    async function mqNaverOne(it) {
      const url = 'https://m.stock.naver.com/api/index/' + it.naver + '/basic';
      const errs = [];
      for (let k = 0; k < MQ_NAVER_ROUTES.length; k++) {
        const i = (mqNaverRoute + k) % MQ_NAVER_ROUTES.length;
        const ctrl = new AbortController();
        const to = setTimeout(() => ctrl.abort(), 8000);
        try {
          const r = await fetch(MQ_NAVER_ROUTES[i](url), { signal: ctrl.signal, cache: 'no-store' });
          if (!r.ok) { errs.push(`route${i} HTTP ${r.status}`); continue; }
          const j = await r.json();
          if (!j || !j.closePrice) { errs.push(`route${i} no closePrice`); continue; }
          const nm = j.compareToPreviousPrice && j.compareToPreviousPrice.name;
          const dir = /RISING|UPPER/.test(nm) ? 1 : /FALLING|LOWER/.test(nm) ? -1
                    : (mqNeg(j.fluctuationsRatio) ? -1 : (mqNum(j.fluctuationsRatio) > 0 ? 1 : 0));
          mqNaverRoute = i;
          delete mqNaverErr[it.code];
          if (mqApply(it, { price: j.closePrice, chg: mqAbs(j.compareToPreviousClosePrice), pct: mqAbs(j.fluctuationsRatio), dir })) {
            mqLastNaver = fmtTime.format(new Date());
          }
          return;
        } catch (e) {
          errs.push(`route${i} ${e.name === 'AbortError' ? 'timeout' : e.message}`);
        } finally { clearTimeout(to); }
      }
      mqNaverErr[it.code] = errs.join(', ');
    }
    let mqNaverBusy = false;
    async function mqNaverTick() {
      if (mqNaverBusy) return;
      mqNaverBusy = true;
      try { await Promise.all(MQ_ITEMS.filter(it => it.src === 'naver').map(mqNaverOne)); }
      finally { mqNaverBusy = false; }
      mqStatusUpdate();
    }

    mqRender();
    setInterval(mqPollTv, 1000);
    mqNaverTick();
    setInterval(mqNaverTick, MQ_NAVER_MS);
    let mqResizeT;
    window.addEventListener('resize', () => { clearTimeout(mqResizeT); mqResizeT = setTimeout(mqRender, 200); });

    // ---------- Shortcut help popover ----------
    const keysBtn = document.getElementById('keysBtn');
    const keysPop = document.getElementById('keysPop');
    keysBtn.addEventListener('click', e => { e.stopPropagation(); keysPop.classList.toggle('open'); });
    keysPop.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => keysPop.classList.remove('open'));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') keysPop.classList.remove('open'); });
  </script>
</body>
</html>
