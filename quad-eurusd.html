<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUR/USD Chart</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e3e6ea;
      --gap: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --card: #1c1f27;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --border: #2b2f3a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: var(--gap);
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    /* Top quote (TradingView Single Ticker widget) */
    .top {
      flex: 0 0 auto;
      height: 120px;
      display: flex;
      gap: var(--gap);
    }
    .single {
      min-width: 0;
      height: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 8px;
      overflow: hidden;
      contain: size layout paint;
    }
    /* Same width as one chart cell (change to flex: 1 1 0; for full width) */
    .single { flex: 0 0 calc((100% - var(--gap)) / 2); }
    .single > tv-single-ticker {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Values read from the single ticker */
    .readout {
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      align-content: center;
      gap: 2px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 16px;
      overflow: hidden;
    }
    .readout .name  { font-size: 1.8rem; font-weight: 800; }
    .readout .price { font-size: 2.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .readout .chg   { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .readout .time  { width: 100%; font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .readout .up   { color: #089981; }
    .readout .down { color: #f23645; }
    .readout .flat { color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      .readout .up   { color: #22ab94; }
      .readout .down { color: #f7525f; }
    }

    /* Split the remaining space evenly into 2x2 cells */
    .grid {
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: var(--gap);
    }
    section {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    h2 {
      font-size: 0.8rem;
      line-height: 1.2;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 6px 2px;
    }
    .box {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      contain: size layout paint;
    }
    .box > tv-advanced-chart {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 640px) {
      html, body { height: auto; }
      .top { flex-direction: column; height: auto; }
      .single { height: 120px; flex: none; }
      .readout { height: 120px; flex: none; }
      .readout .name  { font-size: 1.3rem; }
      .readout .price { font-size: 1.8rem; }
      .readout .chg   { font-size: 1.1rem; }
      .grid {
        flex: none;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: none;
        grid-auto-rows: 460px;
      }
    }
  </style>
  <!-- Runs before the widget scripts: turns closed shadow DOMs into open ones so inner text can be read -->
  <script>
    const _attachShadow = Element.prototype.attachShadow;
    Element.prototype.attachShadow = function (init) {
      return _attachShadow.call(this, { ...init, mode: 'open' });
    };
  </script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-single-ticker.js"></script>
</head>
<body>
  <div class="top">
    <div class="single">
      <tv-single-ticker symbol="FX:EURUSD"></tv-single-ticker>
    </div>
    <div class="readout" id="readout">
      <span class="name">EURUSD</span>
      <span class="price" id="r-price">--</span>
      <span class="chg flat" id="r-chg">Change --</span>
      <span class="time" id="r-time">Reading ticker value…</span>
    </div>
  </div>

  <div class="grid">
    <section>
      <h2>Advanced Chart · 15m</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="15" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>

    <section>
      <h2>Advanced Chart · 3m</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="3" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>

    <section>
      <h2>Advanced Chart · 1D</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="1D" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>

    <section>
      <h2>Advanced Chart · 1h</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="60" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>
  </div>

  <script>
    // Collect text inside the single ticker (including shadow DOM) and parse price / change
    const $ticker = document.querySelector('tv-single-ticker');
    const $price = document.getElementById('r-price');
    const $chg = document.getElementById('r-chg');
    const $time = document.getElementById('r-time');
    const fmtTime = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Seoul', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
    });

    function collect(root, out) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
      let n;
      while ((n = walker.nextNode())) {
        if (n.nodeType === Node.TEXT_NODE) {
          const p = n.parentElement;
          if (p && /^(STYLE|SCRIPT)$/.test(p.tagName)) continue;
          const t = n.textContent.trim();
          if (t) out.texts.push(t);
        } else {
          if (n.tagName === 'IFRAME') out.iframe = true;
          if (n.shadowRoot) collect(n.shadowRoot, out);
        }
      }
    }

    function read() {
      const out = { texts: [], iframe: false };
      if ($ticker.shadowRoot) collect($ticker.shadowRoot, out);
      collect($ticker, out);
      const joined = out.texts.join(' ');
      const m = joined.match(/(\d+\.\d{3,6})\s*(?:USD)?\s*([+\-−]?\d+\.\d+)\s*([+\-−]?\d+\.\d+)\s*%/);
      return { out, joined, m };
    }

    let lastPrice = null;
    function update() {
      const { out, joined, m } = read();
      if (!m) {
        $time.textContent = out.iframe
          ? 'Cannot read: widget is rendered in an iframe'
          : ($ticker.shadowRoot ? 'Value not found (check tvRaw in the console)' : 'Reading…');
        window.tvRaw = joined;
        return;
      }
      const price = m[1];
      const pctNum = parseFloat(m[3].replace('−', '-'));
      const sign = m[3].replace('−', '-').startsWith('-') ? '-' : (pctNum > 0 ? '+' : '');
      const cls = pctNum > 0 ? 'up' : pctNum < 0 ? 'down' : 'flat';
      const absChg = m[2].replace(/^[+\-−]/, '');
      $price.textContent = price;
      $chg.className = 'chg ' + cls;
      $chg.textContent = `Change ${sign}${absChg} (${sign}${m[3].replace(/^[+\-−]/, '')}%)`;
      if (price !== lastPrice) {
        lastPrice = price;
        $time.textContent = 'Last update ' + fmtTime.format(new Date()) + ' KST (browser time)';
      }
    }
    setInterval(update, 500);
  </script>
</body>
</html>
