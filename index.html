<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUR/USD 차트</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e3e6ea;
      --gap: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --card: #1c1f27;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --border: #2b2f3a;
      }
    }
    * { box-sizing: border-box; }
    /* 화면 크기와 상관없이 전체 영역을 1024x768로 고정 (여백 포함) */
    body {
      width: 1024px;
      height: 768px;
      margin: 0;
      padding: var(--gap);
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }

    /* 2x2 칸을 고정 크기로 균등 분할 (화면 크기와 무관, 현재 고정값: 1024x768 → 각 칸 약 500x372)
       계산식: 가로 = (전체폭 - 좌우여백 16 - 칸간격 8) / 2
               세로 = (전체높이 - 상하여백 16 - 칸간격 8) / 2
       다른 크기로 바꾸려면 아래 body의 width/height만 수정:
         - 1280x1024 → 각 칸 약 628 x 500
         - 1024x768  → 각 칸 약 500 x 372  (현재)
         - 800x600   → 각 칸 약 388 x 288
    */
    .grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: var(--gap);
    }
    section {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    h2 {
      font-size: 0.8rem;
      line-height: 1.2;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 6px 2px;
    }
    /* 위젯이 칸 밖으로 늘어나지 않도록 칸 크기에 고정 */
    .box {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      contain: size layout paint;
    }
    .box > tv-advanced-chart {
      display: block;
      width: 100%;
      height: 100%;
    }

  </style>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>
</head>
<body>
  <div class="grid">
    <!-- 상단 왼쪽: 15분 -->
    <section>
      <h2>Advanced Chart · 15분</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="15" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>

    <!-- 상단 오른쪽: 3분 -->
    <section>
      <h2>Advanced Chart · 3분</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="3" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>

    <!-- 하단 왼쪽: 일봉 -->
    <section>
      <h2>Advanced Chart · 일</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="1D" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>

    <!-- 하단 오른쪽: 1시간 -->
    <section>
      <h2>Advanced Chart · 1시간</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="60" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>
  </div>
</body>
</html>
