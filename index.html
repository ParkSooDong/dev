<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUR/USD 차트</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e3e6ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --card: #1c1f27;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --border: #2b2f3a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    section.wide { grid-column: 1 / -1; }
    h2 {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 12px;
    }
    tv-mini-chart, tv-seasonal-chart { display: block; }
    tv-advanced-chart { display: block; height: 600px; }
  </style>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-mini-chart.js"></script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-seasonal-chart.js"></script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>
</head>
<body>
  <main>
    <h1>EUR/USD 차트</h1>

    <div class="grid">
      <section>
        <h2>Mini Chart 1W</h2>
        <tv-mini-chart symbol="eurusd" time-frame="7D" line-chart-type="Baseline"></tv-mini-chart>
      </section>

      <section>
        <h2>Mini Chart 1D</h2>
        <tv-mini-chart symbol="eurusd" line-chart-type="Baseline"></tv-mini-chart>
      </section>

      <section class="wide">
        <h2>Seasonal Chart</h2>
        <tv-seasonal-chart symbol="eurusd"></tv-seasonal-chart>
      </section>

      <section class="wide">
        <h2>Advanced Chart</h2>
        <tv-advanced-chart symbol="eurusd" interval="15" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </section>
    </div>
  </main>
</body>
</html>
