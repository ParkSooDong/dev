<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUR/USD 차트</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e3e6ea;
      --gap: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --card: #1c1f27;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --border: #2b2f3a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: var(--gap);
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }

    /* 화면 전체를 2x2 칸으로 정확히 균등 분할 (1280x1024 기준 각 칸 약 628x500) */
    .grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: var(--gap);
    }
    section {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    h2 {
      font-size: 0.8rem;
      line-height: 1.2;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 6px 2px;
    }
    /* 위젯이 칸 밖으로 늘어나지 않도록 칸 크기에 고정 */
    .box {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      contain: size layout paint;
    }
    .box > tv-advanced-chart,
    .box > tv-seasonal-chart,
    .box > tv-mini-chart {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 좁은 화면(모바일 등)에서는 한 줄씩 세로로 배치 */
    @media (max-width: 900px) {
      html, body { height: auto; }
      .grid {
        height: auto;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: none;
        grid-auto-rows: 460px;
      }
    }
  </style>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-seasonal-chart.js"></script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-mini-chart.js"></script>
</head>
<body>
  <div class="grid">
    <!-- 위쪽 왼쪽 -->
    <section>
      <h2>Advanced Chart</h2>
      <div class="box">
        <tv-advanced-chart symbol="eurusd" interval="15" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
      </div>
    </section>

    <!-- 위쪽 오른쪽 -->
    <section>
      <h2>Seasonal Chart</h2>
      <div class="box">
        <tv-seasonal-chart symbol="eurusd"></tv-seasonal-chart>
      </div>
    </section>

    <!-- 아래쪽 왼쪽 -->
    <section>
      <h2>Mini Chart LASTSESSION</h2>
      <div class="box">
        <tv-mini-chart symbol="eurusd" time-frame="LASTSESSION" line-chart-type="Baseline"></tv-mini-chart>
      </div>
    </section>

    <!-- 아래쪽 오른쪽 -->
    <section>
      <h2>Mini Chart 1W</h2>
      <div class="box">
        <tv-mini-chart symbol="eurusd" time-frame="7D" line-chart-type="Baseline"></tv-mini-chart>
      </div>
    </section>
  </div>
</body>
</html>
