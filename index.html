<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUR/USD 차트</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e3e6ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --card: #1c1f27;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --border: #2b2f3a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    main { max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 20px; }
    .grid {
      display: grid;
      /* 넓은 화면: 왼쪽 Advanced / 오른쪽 Seasonal, 좁은 화면: 세로로 쌓임 */
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      align-items: start;
      gap: 16px;
    }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    section.wide { grid-column: 1 / -1; }
    h2 {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 12px;
    }
    /* 위젯이 커져도 박스 밖으로 번지지 않도록 크기를 완전히 고정 */
    .box {
      position: relative;
      width: 100%;
      overflow: hidden;
      contain: size layout paint;
    }
    .box.seasonal { height: 600px; max-height: 600px; }
    .box.advanced { height: 600px; max-height: 600px; }
    .box > tv-seasonal-chart,
    .box > tv-advanced-chart {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-seasonal-chart.js"></script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>
</head>
<body>
  <main>
    <h1>EUR/USD 차트</h1>

    <div class="grid">
      <section>
        <h2>Advanced Chart</h2>
        <div class="box advanced">
          <tv-advanced-chart symbol="eurusd" interval="15" timezone="Asia/Seoul" allow-symbol-change></tv-advanced-chart>
        </div>
      </section>

      <section>
        <h2>Seasonal Chart</h2>
        <div class="box seasonal">
          <tv-seasonal-chart symbol="eurusd"></tv-seasonal-chart>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
