<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOSPI 차트</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e3e6ea;
      --gap: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --card: #1c1f27;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --border: #2b2f3a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: var(--gap);
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }

    /* 화면 전체를 2x2 칸으로 정확히 균등 분할 */
    .grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: var(--gap);
    }
    section {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin: 0 2px 6px;
    }
    h2 {
      font-size: 0.8rem;
      line-height: 1.2;
      color: var(--muted);
      font-weight: 600;
      margin: 0;
    }
    .head a {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }
    /* 차트가 칸 밖으로 늘어나지 않도록 칸 크기에 고정 */
    .box {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      contain: size layout paint;
    }
    .box > iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* 좁은 화면(모바일 등)에서는 한 줄씩 세로로 배치 */
    @media (max-width: 640px) {
      html, body { height: auto; }
      .grid {
        height: auto;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: none;
        grid-auto-rows: 460px;
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <!-- 상단 왼쪽: 15분 -->
    <section>
      <div class="head"><h2>KOSPI · 15분</h2><a href="https://www.tradingview.com/chart/?symbol=KRX%3AKOSPI&interval=15" target="_blank" rel="noopener">새 창</a></div>
      <div class="box">
        <iframe src="https://www.tradingview.com/chart/?symbol=KRX%3AKOSPI&interval=15" title="KOSPI 15분" allow="fullscreen"></iframe>
      </div>
    </section>

    <!-- 상단 오른쪽: 3분 -->
    <section>
      <div class="head"><h2>KOSPI · 3분</h2><a href="https://www.tradingview.com/chart/?symbol=KRX%3AKOSPI&interval=3" target="_blank" rel="noopener">새 창</a></div>
      <div class="box">
        <iframe src="https://www.tradingview.com/chart/?symbol=KRX%3AKOSPI&interval=3" title="KOSPI 3분" allow="fullscreen"></iframe>
      </div>
    </section>

    <!-- 하단 왼쪽: 일봉 -->
    <section>
      <div class="head"><h2>KOSPI · 일</h2><a href="https://www.tradingview.com/chart/?symbol=KRX%3AKOSPI&interval=D" target="_blank" rel="noopener">새 창</a></div>
      <div class="box">
        <iframe src="https://www.tradingview.com/chart/?symbol=KRX%3AKOSPI&interval=D" title="KOSPI 일" allow="fullscreen"></iframe>
      </div>
    </section>

    <!-- 하단 오른쪽: 1시간 -->
    <section>
      <div class="head"><h2>KOSPI · 1시간</h2><a href="https://www.tradingview.com/chart/?symbol=KRX%3AKOSPI&interval=60" target="_blank" rel="noopener">새 창</a></div>
      <div class="box">
        <iframe src="https://www.tradingview.com/chart/?symbol=KRX%3AKOSPI&interval=60" title="KOSPI 1시간" allow="fullscreen"></iframe>
      </div>
    </section>
  </div>
</body>
</html>
