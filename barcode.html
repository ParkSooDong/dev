<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미니 바코드 3×3</title>
<style>
:root{--bg:#f3f1ec;--ink:#1c1b19;--mute:#76726a;--line:#d9d5cb;--card:#fff;--acc:#1c1b19;--accfg:#fff;
--wk:#ffe08a;--wkb:#d9a400;--warn:#c62828;--note:#b85500;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#17161a;--ink:#ecebe6;--mute:#8d8a82;--line:#34322f;--card:#1f1e22;--acc:#ecebe6;--accfg:#17161a;
--wk:#6b5200;--wkb:#d4a91c;--warn:#ff8a80;--note:#ffb74d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;padding:20px 12px}
main{width:100%;max-width:1600px;margin:0 auto}
h1{font-size:18px;margin:0 0 14px;letter-spacing:-.01em}
.top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) repeat(2,minmax(0,.8fr));gap:8px;align-items:end;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);min-width:0}
input,select{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);min-width:0}
select option{color:#111}
#w{background:var(--wk);border-color:var(--wkb)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cell{border:1.5px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cell.wk{background:var(--wk);border-color:var(--wkb)}
.cell.wk input{background:transparent;border-color:var(--wkb)}
.view{background:var(--card);border-radius:6px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px 3px;overflow:hidden;width:100%}
.view svg{display:block;width:100%;height:clamp(40px,8vw,110px)}
.txt{color:#111;font:clamp(8px,1.5vw,14px) ui-monospace,Menlo,monospace;margin-top:3px;word-break:break-all;text-align:center}
.empty,.err{font-size:11px;color:var(--mute);text-align:center}
.err{color:#b3261e}
.cell input{font-size:13px;padding:6px 7px}
.btns{display:flex;gap:4px}
button{flex:1;font:inherit;font-size:12px;font-weight:600;padding:6px 2px;border-radius:6px;border:1.5px solid var(--acc);background:var(--acc);color:var(--accfg);cursor:pointer}
button:disabled{opacity:.35;cursor:default}
textarea{width:100%;font:inherit;font-size:14px;line-height:1.5;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);resize:vertical;min-height:110px}
textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{color:var(--mute);font-size:12px;margin:12px 0 0}
.warn{color:var(--warn);font-size:13px;font-weight:600}
.note{color:var(--note);font-size:13px;font-weight:600;margin-top:6px}
@media (max-width:560px){.top{grid-template-columns:repeat(3,minmax(0,1fr))}.btns{flex-direction:column}}
</style>
</head>
<body>
<main>
<h1>미니 바코드 3×3</h1>
<div class="top">
<label>작업자 코드<input id="w" value="T8836853" autocomplete="off"></label>
<label>사업장 코드<input id="s" value="136" inputmode="numeric" maxlength="3" autocomplete="off"></label>
<label>년도<input id="y" value="" inputmode="numeric" autocomplete="off"></label>
<label>모드<select id="m"><option value="light">라이트</option><option value="dark">다크</option></select></label>
<label>저장 형식<select id="f"><option value="png">PNG</option><option value="svg">SVG</option></select></label>
</div>
<div class="grid" id="g"></div>
<label style="margin-top:12px">메모<textarea id="memo" rows="5" placeholder="이 곳에 메모하면 이 컴퓨터의 이 브라우저를 사용한다면, 컴퓨터를 다시 껐다가 켜도 메모가 유지됩니다."></textarea></label>
<p>Code 128 · 선택한 모드가 화면과 저장 파일에 모두 적용돼요. 4번은 작업자 코드, 나머지는 직접 입력도 가능해요. 사업장 코드(앞 3자리-)와 년도(○○○-XX 뒤 2자리)를 바꾸면 1~9번 전체에 일괄 적용돼요.</p>
<p class="warn" role="alert">입력하거나 수정한 내용은 이 기기의 브라우저에 자동 저장되므로, 웹페이지를 닫았다가 다시 열어도 직전 상태가 다시 보입니다.</p>
<p class="note">화면 상단의 코드와 년도, 1~9번의 바코드를 변경하면 브라우저를 다시 열어도 그 변경한 값이 유지됩니다.</p>
</main>
<script>
const P="212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(" ");
const $=id=>document.getElementById(id);
const THEME={light:{fg:"#000",bg:"#fff"},dark:{fg:"#fff",bg:"#111111"}};
function encode(s){
  const c=[104];
  for(const ch of s){const k=ch.charCodeAt(0);if(k<32||k>126)throw new Error("지원하지 않는 문자: "+ch);c.push(k-32)}
  let sum=104;for(let i=1;i<c.length;i++)sum+=c[i]*i;
  c.push(sum%103,106);return c.map(v=>P[v]).join("");
}
function build(s,t){
  const w=encode(s),q=10,m=2;let x=q,r="";
  for(let i=0;i<w.length;i++){const n=+w[i]*m;if(i%2===0)r+=`<rect x="${x}" y="0" width="${n}" height="60" fill="${t.fg}"/>`;x+=n}
  const W=x+q;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} 60" width="${W}" height="60"><rect width="${W}" height="60" fill="${t.bg}"/>${r}</svg>`;
}
const defs=()=>{const S=$("s").value,Y=$("y").value.replace(/\D/g,"").slice(-2);return ["","","",$("w").value,`${S}-XY0-1-5`,`${S}-XY0-1-6`,`${S}-XX${Y}-1-501`,`${S}-XY0-1-10`,`${S}-13G10-13-401`]};
const cells=[];let yEdited=false;
const KEY="bc9-state";
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
const saved=loadState();
$("y").value=new Date().getFullYear();
if(saved){
  if(typeof saved.w==="string")$("w").value=saved.w;
  if(typeof saved.s==="string")$("s").value=saved.s;
  if(saved.y){$("y").value=saved.y;yEdited=true}
  if(["light","dark"].includes(saved.m))$("m").value=saved.m;
  if(["png","svg"].includes(saved.f))$("f").value=saved.f;
  if(typeof saved.memo==="string")$("memo").value=saved.memo;
}
function applyTheme(){document.documentElement.setAttribute("data-theme",$("m").value)}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify({w:$("w").value,s:$("s").value,y:yEdited?$("y").value:null,m:$("m").value,f:$("f").value,memo:$("memo").value,cells:cells.map(c=>c.inp.value)}))}catch(e){}}
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function fname(i,mode,ext){
  const safe=v=>v.replace(/[^\w-]+/g,"_");
  return `${safe($("y").value)||"year"}_${safe(cells[i].inp.value)}_${mode}.${ext}`;
}
function download(i,mode){
  const v=cells[i].inp.value;if(!v)return;
  let svg;try{svg=build(v,THEME[mode])}catch(e){return}
  if($("f").value==="svg"){save(new Blob([svg],{type:"image/svg+xml"}),fname(i,mode,"svg"));return}
  const img=new Image();
  img.onload=()=>{const k=3,c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>save(b,fname(i,mode,"png")))};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function draw(i){
  const {inp,view,bl}=cells[i],v=inp.value;
  bl.disabled=true;view.textContent="";view.style.background=THEME[$("m").value].bg;
  const d=document.createElement("div");
  if(!v){d.className="empty";d.textContent="코드를 입력하세요";view.append(d);return}
  try{view.insertAdjacentHTML("beforeend",build(v,THEME[$("m").value]));
    const sv=view.querySelector("svg");sv.removeAttribute("width");sv.removeAttribute("height");sv.setAttribute("preserveAspectRatio","none");
    const t=document.createElement("div");t.className="txt";t.textContent=v;t.style.color=THEME[$("m").value].fg;view.append(t);bl.disabled=false}
  catch(e){d.className="err";d.textContent=e.message;view.append(d)}
}
const drawAll=()=>cells.forEach((_,i)=>draw(i));
function init(){
  const g=$("g"),d=defs();
  for(let i=0;i<9;i++){
    const el=document.createElement("div");el.className="cell"+(i===3?" wk":"");
    el.innerHTML=`<div class="view"></div><input aria-label="바코드 ${i+1}번 내용${i===3?" (작업자)":""}" placeholder="${i+1}번" autocomplete="off"><div class="btns"><button>저장</button></div>`;
    const c={inp:el.querySelector("input"),view:el.querySelector(".view"),bl:el.querySelector("button")};
    c.inp.value=d[i];
    c.inp.addEventListener("input",()=>{draw(i);saveState()});
    c.bl.onclick=()=>download(i,$("m").value);
    cells.push(c);g.append(el);
  }
}
/* 사업장 코드: 값이 'ddd-'로 시작하면 1~9번 모두 앞 3자리를 교체 */
function applyShop(){
  const S=$("s").value.trim();if(!/^\d{3}$/.test(S))return;
  cells.forEach(c=>{if(/^\d{3}-/.test(c.inp.value))c.inp.value=S+c.inp.value.slice(3)});
}
/* 년도: 'ddd-XXdd' 구성이면 1~9번 모두 뒤 두 자리를 교체 */
function applyYear(){
  const D=$("y").value.replace(/\D/g,"");if(D.length<2)return;
  const Y=D.slice(-2);
  cells.forEach(c=>{c.inp.value=c.inp.value.replace(/^(\d{3}-XX)\d{2}(?!\d)/,(m,a)=>a+Y)});
}
init();
if(saved&&Array.isArray(saved.cells)){cells.forEach((c,i)=>{const v=saved.cells[i];if(typeof v==="string")c.inp.value=v})}
cells[3].inp.value=$("w").value;
if(!yEdited)applyYear();
applyTheme();drawAll();
$("m").addEventListener("change",()=>{applyTheme();drawAll();saveState()});
$("w").addEventListener("input",()=>{cells[3].inp.value=$("w").value;draw(3);saveState()});
$("s").addEventListener("input",()=>{applyShop();drawAll();saveState()});
$("y").addEventListener("input",()=>{yEdited=true;applyYear();drawAll();saveState()});
$("f").addEventListener("change",saveState);$("memo").addEventListener("input",saveState);
saveState();
</script>
</body>
</html>
