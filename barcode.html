<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<script>
/* 모바일 브라우저의 강제 다크모드 방지: 저장된 모드가 dark일 때만 dark, 그 외에는 항상 light */
(function(){var m="light";try{var s=JSON.parse(localStorage.getItem("bc9-state"));if(s&&s.m==="dark")m="dark"}catch(e){}
document.documentElement.setAttribute("data-theme",m);
document.querySelector('meta[name="color-scheme"]').setAttribute("content",m==="dark"?"dark":"only light")})();
</script>
<title>미니 바코드/QR 3×3</title>
<style>
:root{--bg:#f3f1ec;--ink:#1c1b19;--mute:#76726a;--line:#d9d5cb;--card:#fff;--acc:#1c1b19;--accfg:#fff;
--link:#1a5fd0;--wk:#ffe08a;--wkb:#d9a400;--warn:#c62828;--note:#b85500;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:only light}
:root[data-theme="dark"]{--bg:#17161a;--ink:#ecebe6;--mute:#8d8a82;--line:#34322f;--card:#1f1e22;--acc:#ecebe6;--accfg:#17161a;
--link:#8ab8ff;--wk:#6b5200;--wkb:#d4a91c;--warn:#ff8a80;--note:#ffb74d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;padding:20px 12px}
main{width:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column}
main>*{flex:none}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
.hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;margin:0 0 14px}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* 슬라이드: 오른쪽 끝(버튼 쪽)을 기준으로 왼쪽으로 펼쳐지고, 접힐 때는 반대로 접힘 */
.tmwrap{display:flex;justify-content:flex-end;overflow:hidden;flex:none;width:0;transition:width .5s cubic-bezier(.34,1.56,.64,1),visibility 0s}   /* 펼칠 때: 목표 너비를 살짝 넘었다가 돌아오는 스프링 */
.tmwrap.off{visibility:hidden;transition:width .3s ease-in,visibility 0s .3s}
@media (prefers-reduced-motion:reduce){.tmwrap,.tmwrap.off{transition:none}}
.tmbtn{font-size:16px;padding:6px 16px}
.tm{display:flex;align-items:center;gap:8px 14px;flex-wrap:nowrap;white-space:nowrap;flex:none;padding:4px 12px;border-radius:10px;border:1.5px solid transparent;font-size:16px;color:var(--ink)}
.tm.pink{background:#ffe3ec;border-color:#f4a9c0;color:#3a1020}
:root[data-theme="dark"] .tm.pink{background:#4a2332;border-color:#a8506d;color:#ffe3ec}
.tm label{flex-direction:row;align-items:center;gap:6px;font-size:inherit;color:inherit;white-space:nowrap}
.tm input{width:4.6em;text-align:center;font-weight:700;font-size:18px;padding:2px 6px;font-variant-numeric:tabular-nums;color:inherit;border-color:currentColor}
.tm .rm{white-space:nowrap}
#rem{display:inline-block;min-width:4.8em;font:700 24px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:left}
#rem.neg{color:var(--warn)}
#kind{cursor:pointer;color:var(--link);font-weight:800;border-bottom:2px dashed var(--link);user-select:none;-webkit-user-select:none}
#kind:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) repeat(2,minmax(0,.8fr));gap:8px;align-items:end;margin-bottom:14px}
label,.lbl{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--mute);min-width:0}
input,select{width:100%;font:inherit;font-size:18px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);min-width:0}
select option{color:#111}
#w{background:var(--wk);border-color:var(--wkb)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cell{border:1.5px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cell.wk{background:var(--wk);border-color:var(--wkb)}
.cell.wk input{background:transparent;border-color:var(--wkb)}
.view{background:var(--card);border-radius:6px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px 3px;overflow:hidden;width:100%}
.view svg{display:block;width:100%;height:clamp(40px,12vw,110px)}
.view[data-k=qr] svg{width:auto;max-width:100%;aspect-ratio:1;height:clamp(70px,24vw,200px)}
.txt{color:#111;font:clamp(10px,1.6vw,18px) ui-monospace,Menlo,monospace;margin-top:3px;word-break:break-all;text-align:center}
.empty,.err{font-size:14px;color:var(--mute);text-align:center}
.err{color:#b3261e}
.cell input{font-size:16px;padding:5px 7px}
.btns{display:flex;gap:4px}
button{flex:1;font:inherit;font-size:15px;font-weight:600;padding:5px 2px;border-radius:6px;border:1.5px solid var(--acc);background:var(--acc);color:var(--accfg);cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.rich{display:block;overflow:auto;word-break:break-word;outline:none}
.rich:empty::before{content:attr(data-ph);color:var(--mute);pointer-events:none}
.rich img{display:inline-block;vertical-align:middle;max-width:100%;height:auto;margin:2px 0}
/* 이미지 크기 조절 / 도형 넣기 */
.imgx-box{position:fixed;z-index:110;border:2px solid #339af0;box-sizing:border-box;pointer-events:none}
.imgx-grip{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;border-radius:50%;background:#339af0;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:nwse-resize;pointer-events:auto;touch-action:none}
.imgx-bar{position:fixed;z-index:111;max-width:calc(100vw - 8px);padding:4px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.2);color:var(--ink)}
.imgx-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.imgx-bar button{flex:none;width:auto;height:auto;margin:0;font:inherit;font-size:13px;font-weight:400;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.imgx-bar button:hover{background:var(--line)}
.imgx-bar button:disabled{opacity:.4;cursor:default;background:transparent}
.imgx-bar button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.imgx-bar .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.imgx-bar button.ic{padding:3px 5px;line-height:0}.imgx-bar button.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.imgx-bar button.ic[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.imgx-bar [hidden]{display:none}
.imgx-bar input[type=color]{width:34px;height:28px;padding:1px;margin:0;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer}
.imgx-bar select{width:auto;height:28px;margin:0;padding:0 4px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.imgx-tbox{position:fixed;z-index:112}
.imgx-tbox textarea{display:block;box-sizing:border-box;margin:0;padding:2px 4px;border:1px dashed #339af0;border-radius:2px;background:transparent;font-family:inherit;line-height:1.3;white-space:pre;overflow:hidden;resize:none;outline:none;min-width:40px}
.imgx-tgrip{position:absolute;left:-22px;top:-2px;width:20px;height:20px;border-radius:5px;background:#339af0;color:#fff;font-size:13px;line-height:20px;text-align:center;cursor:move;touch-action:none;user-select:none}
.imgx-box[hidden],.imgx-bar[hidden],.imgx-row[hidden]{display:none}
.imgx-ov{position:fixed;z-index:109;display:block;overflow:hidden;touch-action:none;cursor:crosshair;background:conic-gradient(#cfcfcf 25%,#fff 0 50%,#cfcfcf 0 75%,#fff 0) 0 0/16px 16px}
.imgx-ov.er{cursor:none}
.imgx-ov>canvas,.imgx-ov>svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.imgx-bar textarea{width:150px;height:44px;margin:0;padding:4px 6px;font:inherit;font-size:13px;line-height:1.3;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);resize:none}
.imgx-bar textarea[hidden]{display:none}
.rich table{border-collapse:collapse;margin:4px 0}
.rich td,.rich th{border:1px solid var(--line);padding:2px 6px;vertical-align:top;min-width:2em}
.rich a{color:inherit}
/* 파일 첨부 칩 */
.rich .att{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;padding:2px 10px;margin:2px 4px 2px 0;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font-size:.95em;line-height:1.5;cursor:pointer;user-select:none}
.rich .att:hover{background:var(--line)}
.tb .pop#attPop{max-width:min(380px,80vw)}
#attPop .row{display:flex;gap:2px;align-items:center}
#attPop .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block;text-align:left;line-height:32px}
#attPop .row .rm{min-width:32px;flex:none;padding:0}
.rich{width:100%;font:inherit;font-size:13px;line-height:1.5;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);resize:vertical;min-height:calc(4.5em + 23px)}
.rich:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rich[contenteditable=false]{opacity:.6}
/* 메모 확대(expand): .mslot 이 원래 자리의 높이를 지키고 .mpane 이 확대 대상 */
.mhead{display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:6px 10px}
.fbbtn{flex:none;width:auto;font-size:13px;font-weight:600;padding:2px 12px;border-radius:999px;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.fbbtn[aria-pressed=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#mst{font-size:12px;font-weight:400;text-align:left;color:var(--mute)}
#mst:empty{display:none}
/* 제목 줄: 메모 | Firebase 버튼 | 상태 | DB 글자 수 — 왼쪽부터 차례로, 구분선만 둠 */
.mhead>span:first-child::after{content:"";display:inline-block;width:1px;height:12px;background:var(--line);margin-right:10px;vertical-align:-1px;margin-left:10px}
#mst::before,#cnt::before{content:"";display:inline-block;width:1px;height:12px;background:var(--line);margin-right:10px;vertical-align:-1px}
body.has-max #mst::before,body.has-max #cnt::before{display:none}
#mst.ok{color:#2e7d32}
:root[data-theme="dark"] #mst.ok{color:#81c784}
#mst.err{color:var(--warn)}
#cnt{font-size:12px;font-weight:400;color:var(--mute);white-space:nowrap}
#cnt.cw{color:#e8590c}
#cnt.ce{color:var(--warn);font-weight:600}
body.has-max #cnt{position:fixed;right:20px;bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 34px);z-index:101;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;opacity:.92}
body.has-max #mst{position:fixed;right:20px;bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:101;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;opacity:.92}
.mslot{position:relative}
.mpane{position:relative}
.mpane .rich{padding-right:44px}
.expand{flex:none;position:absolute;top:6px;right:8px;z-index:5;width:28px;height:28px;padding:0;display:grid;place-items:center;font-size:15px;font-weight:400;line-height:1;color:var(--ink);opacity:.55;background:var(--card);border:1.5px solid var(--line);border-radius:7px;cursor:pointer}
.expand:hover,.expand:focus-visible{opacity:1}
.mpane.max{position:fixed;inset:0;z-index:100;background:var(--bg);padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.mpane.max .rich{height:100%;min-height:0;resize:none;padding:14px 48px 14px 14px;border-radius:10px}
.mpane.max .expand{top:max(20px,calc(env(safe-area-inset-top,0px) + 8px));right:26px}
.rich h1{font-size:1.6em;line-height:1.3;margin:.5em 0 .25em;letter-spacing:-.01em}
.rich h2{font-size:1.3em;line-height:1.3;margin:.5em 0 .25em}
.rich h3{font-size:1.1em;line-height:1.3;margin:.5em 0 .25em}
.rich ul,.rich ol{margin:.3em 0;padding-left:1.6em}
.rich hr{border:0;border-top:1.5px solid var(--line);margin:.8em 0}
.rich blockquote{margin:.5em 0;padding:.1em 0 .1em 12px;border-left:3px solid var(--line);color:var(--mute)}
.rich pre{margin:.4em 0;padding:8px 10px;border-radius:7px;background:var(--line);font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:.92em;white-space:pre-wrap}
/* 찾기 */
.fbar{flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.fbar[hidden]{display:none}
.fbar input{flex:1;min-width:0;font:inherit;font-size:14px;padding:4px 8px;border:1.5px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.fbar button{font:inherit;font-size:14px;min-width:32px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer}
.fbar button:hover{background:var(--line)}
.fbar span{font-size:12px;color:var(--mute);min-width:3.5em;text-align:center}
::highlight(find){background:#ffe066;color:#1c1b19}
::highlight(findcur){background:#ff922b;color:#1c1b19}
/* 서식 툴바 */
.tb{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.tb button{font:inherit;font-size:14px;min-width:32px;height:32px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer}
.tb button:hover{background:var(--line)}
.tb button[aria-pressed=true]{background:var(--acc);color:var(--accfg)}
.tb button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.tb .menu{position:relative}
.tb .menu.dim>button{opacity:.45}
.tbar{position:fixed;z-index:30;display:flex;flex-wrap:wrap;gap:2px;max-width:calc(100vw - 16px);padding:3px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tbar[hidden]{display:none}
.tbar button{font:inherit;font-size:12.5px;height:28px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.tbar button:hover{background:var(--line)}
.tbar button.del{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);max-width:88vw;padding:9px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:60;pointer-events:none}
.toast[hidden]{display:none}
.pwb{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.pwb[hidden]{display:none}
.pwb form{width:min(340px,90vw);padding:18px;border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 8px 28px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
.pwb p{margin:0;font-size:13px;line-height:1.45;color:var(--mute)}
.pwb input{font:inherit;font-size:15px;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.pwb input[hidden]{display:none}
.pwb .pwe{min-height:1.3em;font-size:13px;color:var(--err,#b3261e)}
.pwb .pwr{display:flex;justify-content:flex-end;gap:8px}
.pwb .pwr button{font:inherit;font-size:14px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.pwb .pwr button[type=submit]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,101,149,.0)}50%{box-shadow:0 0 0 4px rgba(240,101,149,.55)}}
.tb .menu.pulse>button{animation:pulse .9s ease-in-out 3}
.tb .pop{position:absolute;top:calc(100% + 4px);left:0;z-index:10;display:flex;flex-direction:column;min-width:150px;padding:4px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.tb .pop[hidden]{display:none}
.tb .pop.r{left:auto;right:0}
.tb .pop button{justify-content:flex-start;padding:0 10px;white-space:nowrap}
.tb .pop.pal:not([hidden]){display:grid;grid-template-columns:repeat(4,32px);gap:4px;min-width:0}
.tb .pop.pal button{min-width:0;width:32px;padding:0;justify-content:center}
.tb .pop.pal button.sw{border:1.5px solid var(--line)}
.tb .pop.pal button.rs{grid-column:1/-1;width:auto;font-size:13px;padding:0 8px}
.tb .pop.pal.wide:not([hidden]){grid-template-columns:repeat(12,20px);gap:3px}
.tb .pop.pal.wide button.sw{width:20px;height:20px;border-radius:4px}
.tb .pop.pal.wide button.rs{height:30px}
/* 이 페이지의 기본 button 스타일(flex:1, 굵게, 배경색)을 툴바 버튼에서는 되돌림 */
.tb button,.tbar button,.fbar button{flex:none;font-weight:400}
.tb button.expand{margin-left:auto}
/* 확대 버튼은 툴바 맨 오른쪽으로 */
.mpane .tb .expand{position:static;width:32px;height:32px;font-size:15px;opacity:.7;background:transparent;border:0;border-radius:7px;display:inline-flex;align-items:center;justify-content:center}
.mpane .tb .expand:hover,.mpane .tb .expand:focus-visible{opacity:1;background:var(--line)}
.mpane .rich{padding-right:10px}
.mpane:not(.max)>.tb,.mpane:not(.max)>.fbar{margin-bottom:6px}
.mpane.max{display:flex;flex-direction:column;gap:6px}
.mpane.max .rich{flex:1;height:auto;padding:14px}
body.has-max{overflow:hidden}
p{color:var(--mute);font-size:14px;margin:12px 0 0}
.warn{color:var(--warn);font-size:16px;font-weight:600}
/* 가로 1280 이상: 1280x1024 고정(모든 내용이 한 화면). 미만: 가로폭 반응형 */
@media (min-width:1280px){
body{padding:12px 0}
main{width:1280px;height:1000px;padding:0 12px}
h1{margin:0 0 8px}
.top{margin-bottom:8px}
.grid{flex:1 1 0;min-height:0;grid-template-rows:repeat(3,minmax(0,1fr))}
.cell{min-height:0}
.view{flex:1 1 0;min-height:0}
.view svg,.view[data-k=qr] svg{flex:1 1 0;min-height:0;height:auto}
.view[data-k=qr] svg{width:auto;max-width:100%;aspect-ratio:1}
label[for-memo],main>label,main>.lbl{margin-top:8px!important}
.rich{height:calc(4.5em + 15px);min-height:0;resize:none;padding:6px 10px}
p{margin:6px 0 0}
}
@media (max-width:560px){.mhead{grid-template-columns:auto 1fr}#mst{grid-column:1/-1;text-align:left}.top{grid-template-columns:repeat(3,minmax(0,1fr))}.btns{flex-direction:column}}
</style>
</head>
<body>
<main>
<div class="hd">
<h1>미니 <span id="kind" role="button" tabindex="0" title="클릭하면 바코드/QR 전환">바코드</span> 3×3</h1>
<div class="tr">
<div class="tmwrap" id="tmw">
<div class="tm pink" id="tm" role="timer" aria-live="off">
<label>목표 시각<input id="tt" value="17:00" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="HH:MM" aria-label="목표 시각 (시:분)"></label>
<span class="rm">남은 시간 <span id="rem">--:--:--</span></span>

/* ===== Firebase Realtime Database 사용/미사용 (memo 파일과 같은 DB 경로 /memo 를 사용해요) ===== */

const DB_URL = "https://parksoodong-memo-default-rtdb.asia-southeast1.firebasedatabase.app";
/* ▲▲ 예: https://my-memo-12345-default-rtdb.asia-southeast1.firebasedatabase.app ▲▲ */
const MAX_BYTES=10000000,POLL_MS=3000,IDLE_MS=3000,MAX_WAIT_MS=30000;   /* 메모 최대 크기(UTF-8 바이트): Firebase 문자열 1개 한도 10MB. 규칙의 글자 수 숫자(10000000)와 함께 바꿔요 */

const BASE=DB_URL.replace(/\/+$/,""),URL_MEMO=BASE+"/memo.json",URL_AT=BASE+"/memo/updatedAt.json";

const memoEl=$("memo"),mst=$("mst"),fbBtn=$("fbBtn");

/* ===== DB 저장 크기(바이트) 표시 =====
   Firebase 에 저장되는 값(서식·표·이미지 데이터까지 포함한 메모 전체)의 크기(UTF-8 바이트)를 한도(MAX_BYTES)와 함께 보여줘요.
   - 입력·붙여넣기·불러오기·서식 변경 등 메모 내용이 바뀔 때마다 갱신 (MutationObserver)
   - 글자를 칠 때마다 계산하지 않고, 계산에 걸린 시간의 10배 이상 간격을 둬서 입력 속도에 영향을 주지 않아요 */
const cnt = document.getElementById("cnt");
let cntT = null;
function updateCnt() {
  cntT = null;
  const t0 = performance.now();
  const v = memoEl.value, n = Math.ceil((utf8Len(v) + 16) / 3) * 4, vis = memoEl.textContent.replace(/\u200b/g, "").length, pct = n / MAX_BYTES * 100;
  cnt.textContent = "DB " + n.toLocaleString("ko-KR") + " / " + MAX_BYTES.toLocaleString("ko-KR") + "바이트";
  cnt.className = n > MAX_BYTES ? "ce" : pct >= 80 ? "cw" : "";
  cnt.title = "Firebase 에 저장되는 크기 (암호화 후 약 1.33배, 바이트, 서식·이미지·첨부 파일 데이터 포함, 한도의 " + (pct < 0.1 && n ? "0.1% 미만" : pct.toFixed(1) + "%") + ")\n= " + (n / 1048576).toFixed(2) + " MB / 글자 수: " + v.length.toLocaleString("ko-KR") + "자 / 눈에 보이는 글자: " + vis.toLocaleString("ko-KR") + "자";
  cntDelay = Math.max(250, (performance.now() - t0) * 10);
}
let cntDelay = 250;
new MutationObserver(() => { if (!cntT) cntT = setTimeout(updateCnt, cntDelay); })
  .observe(memoEl, { childList: true, subtree: true, characterData: true, attributes: true });
updateCnt();
let useFb=false,dirty=false,knownAt=0,ready=false,saving=false,connecting=false,firstTry=false,idleT=null,maxT=null;

function clearTimers(){clearTimeout(idleT);clearTimeout(maxT);idleT=maxT=null}

/* ===== 암호화: 비밀번호 → PBKDF2(SHA-256, 250000회) → AES-GCM 256. DB 에는 암호문만 올라가고 비밀번호는 저장하지 않아요 ===== */
const PWK = "memo-pw";   // 비밀번호는 이 PC(브라우저)에 기억해요: 처음 한 번만 묻고, 틀리면 다시 물어요
let pw = null, dbSalt = null;
try { pw = localStorage.getItem(PWK) || null; } catch (e) {}
const setPw = p => { pw = p; try { localStorage.setItem(PWK, p); } catch (e) {} };
const keyCache = new Map();
const b64e = u => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
function forgetPw() { pw = null; dbSalt = null; keyCache.clear(); try { localStorage.removeItem(PWK); } catch (e) {} }
async function getKey(saltB64) {
  let k = keyCache.get(saltB64);
  if (!k) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(saltB64), iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    keyCache.set(saltB64, k);
  }
  return k;
}
async function encryptMemo(text, at) {
  if (!dbSalt) dbSalt = b64e(crypto.getRandomValues(new Uint8Array(16)));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await getKey(dbSalt), new TextEncoder().encode(text));
  return { enc: 1, salt: dbSalt, iv: b64e(iv), ct: b64e(new Uint8Array(ct)), updatedAt: at };
}
async function decryptMemo(d) {   // 비밀번호가 틀리면 예외 (AES-GCM 인증 실패)
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(d.iv) }, await getKey(d.salt), b64d(d.ct));
  return new TextDecoder().decode(pt);
}
const isEnc = d => !!d && d.enc === 1 && typeof d.ct === "string" && typeof d.iv === "string" && typeof d.salt === "string";

/* 비밀번호 입력창 (입력 마스킹). mode: "enter" 입력 / "new" 새로 정하기 / "legacy" 암호화 안 된 DB 를 암호화로 전환. 취소하면 null */
function askPw(mode, msg) {
  return new Promise(resolve => {
    const $ = id => document.getElementById(id);
    const box = $("pwBox"), form = $("pwForm"), p1 = $("pw1"), p2 = $("pw2"), err = $("pwE"), isNew = mode !== "enter";
    $("pwT").textContent = isNew ? "새 비밀번호 설정" : "비밀번호 입력";
    $("pwD").textContent = mode === "legacy" ? "DB 의 메모가 암호화되어 있지 않아요. 비밀번호를 정하면 암호화해서 다시 저장해요. 분실하면 복구할 수 없어요."
      : isNew ? "이 비밀번호로 메모를 암호화해서 DB 에 저장해요. 분실하면 복구할 수 없어요 (8자 이상)." : "DB 의 메모를 열려면 비밀번호가 필요해요.";
    p1.value = p2.value = ""; p2.hidden = !isNew; err.textContent = msg || "";
    p1.autocomplete = isNew ? "new-password" : "current-password";
    box.hidden = false; setTimeout(() => p1.focus(), 0);
    const done = v => { box.hidden = true; form.onsubmit = $("pwCancel").onclick = box.onkeydown = null; p1.value = p2.value = ""; resolve(v); };
    form.onsubmit = e => {
      e.preventDefault();
      if (!p1.value) { err.textContent = "비밀번호를 입력해 주세요"; return; }
      if (isNew) {
        if (p1.value.length < 8) { err.textContent = "8자 이상으로 정해 주세요"; return; }
        if (p1.value !== p2.value) { err.textContent = "두 비밀번호가 달라요"; return; }
      }
      done(p1.value);
    };
    $("pwCancel").onclick = () => done(null);
    box.onkeydown = e => { if (e.key === "Escape") { e.preventDefault(); done(null); } };
  });
}
/* 암호화된 DB 열기: 맞는 비밀번호가 나올 때까지 반복, 취소하면 null */
async function unlock(d) {
  let msg = "";
  for (;;) {
    if (!pw) { const p = await askPw("enter", msg); if (p === null) return null; setPw(p); }
    try { const t = await decryptMemo(d); dbSalt = d.salt; return t; }
    catch (e) { forgetPw(); msg = "비밀번호가 맞지 않아요"; }
  }
}

async function fetchRemote(){const r=await fetch(URL_MEMO,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}  /* null 또는 {enc,salt,iv,ct,updatedAt} (구버전: {text,updatedAt}) */

async function saveRemote(unloading){
  clearTimers();
  if(!useFb||!ready||!dirty)return;
  if(saving){schedule();return}
  const v=memoEl.value;
  if(utf8Len(v)*4/3>MAX_BYTES){say("메모가 너무 커서 DB에 저장할 수 없어요. 이미지·첨부 파일을 줄여 주세요","err");return}   /* 암호문(base64)은 약 1.33배 */
  saving=true;say("저장 중…");
  try{
    const at=Math.max(Date.now(),knownAt+1);                 /* 기기 시계가 달라도 항상 더 큰 값 */
    const enc=await encryptMemo(v,at);
    if(enc.ct.length>MAX_BYTES){say("메모가 너무 커서 DB에 저장할 수 없어요. 이미지·첨부 파일을 줄여 주세요","err");return}
    const body=JSON.stringify(enc),small=body.length<20000;   /* 창 닫는 중 전송은 작은 메모만 가능 */
    const r=await fetch(URL_MEMO,{method:"PUT",keepalive:unloading===true&&small,headers:{"Content-Type":"application/json"},body});
    if(!r.ok)throw new Error("HTTP "+r.status);
    knownAt=at;
    if(memoEl.value===v){dirty=false;say("저장됨 "+hhmm(),"ok")}else schedule();   /* 저장 중에 더 입력한 경우 */
    saveState();
  }catch(e){say("저장 실패. 5초 뒤 다시 시도해요","err");clearTimeout(idleT);idleT=setTimeout(saveRemote,5000)}
  finally{saving=false}
}

async function poll(){
  if(!useFb||!ready||dirty||saving||document.hidden)return;

        if(!useFb||dirty)return;
        dbSalt=d.salt;knownAt=d.updatedAt;
        if(memoEl.value!==t){memoEl.value=t;saveState();say("다른 기기의 변경을 반영했어요","ok")}else say("저장됨 "+hhmm(),"ok");
      }

/* DB 와 처음 연결: 어느 쪽 메모를 쓸지 정하고 자동저장을 시작 */
async function connect(){
  if(connecting||ready||!useFb||!dbSet)return;
  if(!(window.crypto&&crypto.subtle)){say("암호화를 쓸 수 없는 환경이에요 (https 주소에서 열어 주세요)","err");return}

    const d=await fetchRemote();
    if(!useFb)return;
    const enc=isEnc(d),plain=!enc&&!!d&&typeof d.text==="string"&&d.updatedAt>0;
    let rt=null;                                                  /* DB 메모(복호화된 내용) */
    if(enc){
      say("비밀번호를 입력해 주세요");
      rt=await unlock(d);
      if(rt===null){setFb(false);return}                          /* 취소 → 미사용으로 복귀 (DB 내용은 표시하지 않음) */
    }else{
      say("비밀번호를 정해 주세요");
      const p=await askPw(plain?"legacy":"new");
      if(p===null){setFb(false);return}

      memoEl.value=rt;knownAt=d.updatedAt;dirty=false;saveState();
    }else{knownAt=Math.max(knownAt,d.updatedAt);dirty=true}
    if(plain)dirty=true;                                          /* 구버전(평문) DB → 암호화해서 다시 저장 */

  }finally{connecting=false;firstTry=false;memoEl.disabled=false}
}

/* ===== 서식 툴바 (색/크기/정렬/체크리스트/표 편집/이미지/찾기 등) ===== */

const ta = memoEl, tb = document.getElementById("tb");

/* 입력창 밖에서 prompt 등을 쓴 뒤에도 커서(선택 영역)를 되돌리기 위함 */
function saveRange() {
  const s = getSelection(), r = s.rangeCount ? s.getRangeAt(0).cloneRange() : null;
  return () => { ta.focus(); if (r && ta.contains(r.commonAncestorContainer)) { s.removeAllRanges(); s.addRange(r); } };

function exec(c, v) {

function block(tag) {

function link() {
  if (ta.disabled) return;

  const input = prompt("링크 주소 (비우면 링크 해제)", a ? (a.getAttribute("href") || "") : "https://");

  if (input === null) return;

  const q = c => { try { return document.queryCommandState(c); } catch (e) { return false; } };
  const on = {
    h1: blk === "h1", h2: blk === "h2", h3: blk === "h3",
    ul: q("insertUnorderedList"), ol: q("insertOrderedList"),
    bold: q("bold"), italic: q("italic"), underline: q("underline"), strike: q("strikeThrough"),
    quote: blk === "blockquote", code: blk === "pre",
    link: !!closestIn(s.anchorNode, "a")
  };
  tblWrap.classList.toggle("dim", !closestIn(s.anchorNode, "td,th"));   // 표 밖에서는 '표 편집'을 흐리게
  tb.querySelectorAll("button[data-cmd]").forEach(b => { if (b.dataset.cmd in on) b.setAttribute("aria-pressed", String(on[b.dataset.cmd])); });
}
document.addEventListener("selectionchange", refreshTb);

/* 툴바 버튼을 눌러도 메모의 커서/포커스를 유지 */
tb.addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); });
tb.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-needtbl") && !closestIn(getSelection().anchorNode, "td,th")) { closePop(); toast("표 안의 칸을 먼저 클릭하면 행·열을 추가/삭제할 수 있어요"); return; }
  if (b.hasAttribute("data-pal")) { const p = b.nextElementSibling; if (p.hidden) openPop(b, p); else closePop(); return; }
  if (b.dataset.t) { closePop(); tbl(b.dataset.t); return; }
  if ("fs" in b.dataset) { closePop(); setSize(b.dataset.fs); return; }
  if ("fcpick" in b.dataset) {   // 원하는 색을 직접 고르기: 선택 영역을 기억했다가 색을 고른 뒤 적용
    const trig = b.closest(".menu").querySelector("[data-pal]").getBoundingClientRect();   // 닫기 전에 위치를 잰다
    closePop(); const restore = saveRange(), pk = document.getElementById("fcPick");
    pk.style.left = Math.round(trig.left) + "px"; pk.style.top = Math.round(trig.bottom) + "px";   // 선택창이 버튼 근처에 뜨도록
    pk.onchange = () => { restore(); paint("fc", pk.value); };
    pk.click(); return;
  }
  if ("fc" in b.dataset) { closePop(); paint("fc", b.dataset.fc); return; }
  if ("bg" in b.dataset) { closePop(); paint("bg", b.dataset.bg); return; }
  if (b.dataset.cmd) { closePop(); CMDS[b.dataset.cmd](); }
  else if (b.dataset.exp) { closePop(); exportMemo(b.dataset.exp); }
});

/* 표 안에서 Tab / Shift+Tab 으로 칸 이동 (마지막 칸에서 Tab 이면 새 행 추가) */
ta.addEventListener("keydown", e => {
  if (e.key !== "Tab" || e.ctrlKey || e.altKey || e.metaKey) return;
  const s = getSelection(); if (!s.rangeCount) return;
  const td = closestIn(s.anchorNode, "td,th"); if (!td) return;
  e.preventDefault();
  let cells = Array.from(td.closest("table").querySelectorAll("td,th")), i = cells.indexOf(td) + (e.shiftKey ? -1 : 1);
  if (i >= cells.length) {
    const tr = td.closest("tr"), nr = document.createElement("tr");
    for (let k = 0; k < tr.cells.length; k++) nr.appendChild(document.createElement("td")).innerHTML = "<br>";
    tr.after(nr);
    cells = Array.from(td.closest("table").querySelectorAll("td,th"));
    ta.dispatchEvent(new Event("input", { bubbles: true }));
  }
  if (i < 0) return;
  const r = document.createRange(); r.selectNodeContents(cells[i]); r.collapse(false);
  s.removeAllRanges(); s.addRange(r);
});

/* Ctrl(⌘)+클릭으로 링크 열기 (편집 중에는 클릭만으로는 열리지 않아요) */
ta.addEventListener("click", e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const a = closestIn(e.target, "a"), h = a && a.getAttribute("href");
  if (h && /^(https?:|mailto:)/i.test(h)) { e.preventDefault(); window.open(h, "_blank", "noopener,noreferrer"); }
});

function closePop() {

  tb.querySelectorAll("[aria-expanded]").forEach(b => b.setAttribute("aria-expanded", "false"));
}
function openPop(btn, p) {
  closePop(); p.hidden = false; btn.setAttribute("aria-expanded", "true");
  if (p.getBoundingClientRect().right > innerWidth - 8) p.classList.add("r");   // 화면 밖으로 나가면 오른쪽 정렬
}
document.addEventListener("click", e => { if (!e.target.closest(".menu")) closePop(); });
const pop = document.getElementById("pop"), expBtn = document.getElementById("expBtn");
expBtn.addEventListener("click", () => {

function exportMemo(kind) {
  if (ta.value === "") { say("저장할 메모가 없어요", "err"); return; }
  const n = new Date(), p = x => String(x).padStart(2, "0");
  const stamp = n.getFullYear() + p(n.getMonth() + 1) + p(n.getDate()) + "-" + p(n.getHours()) + p(n.getMinutes());
  let body, type, name;
  if (kind === "html") {
    body = '<!DOCTYPE html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>메모</title>\n<style>\n' +
      'body{font:16px/1.6 system-ui,"Noto Sans KR",sans-serif;max-width:800px;margin:24px auto;padding:0 16px;color:#1c1b19;word-break:break-word}\n' +
      'img{max-width:100%;height:auto}table{border-collapse:collapse}td,th{border:1px solid #d9d5cb;padding:2px 6px;vertical-align:top}\n' +
      '[data-att]{display:inline-block;padding:2px 10px;margin:2px 4px 2px 0;border:1.5px solid #d9d5cb;border-radius:999px;cursor:pointer}\n' +
      '</style>\n</head>\n<body>\n' + ta.cleanHtml() + '\n<script>document.addEventListener("click",function(e){var s=e.target.closest&&e.target.closest("[data-att]");if(!s)return;var b=atob(s.getAttribute("data-b64")),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([u],{type:s.getAttribute("data-mime")}));a.download=s.getAttribute("data-name");document.body.appendChild(a);a.click();a.remove()});<\/script>\n</body>\n</html>\n';
    type = "text/html"; name = "메모_" + stamp + ".html";
  } else {
    body = "\ufeff" + ta.innerText.replace(/\u00a0/g, " ").replace(/\u200b/g, "");   // BOM: 윈도우 앱에서도 한글이 깨지지 않게
    type = "text/plain"; name = "메모_" + stamp + ".txt";
  }
  const url = URL.createObjectURL(new Blob([body], { type: type + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  say("저장했어요: " + name, "ok");
}

/* ===== 불러오기 (.html / .txt): 내보낸 파일이나 다른 메모를 가져와요 ===== */
const impBtn = document.getElementById("impBtn"), impFile = document.getElementById("impFile");
impBtn.addEventListener("click", () => { closePop(); impFile.value = ""; impFile.click(); });
impFile.addEventListener("change", async () => {
  const f = impFile.files && impFile.files[0]; if (!f) return;
  if (ta.disabled) { say("지금은 열 수 없어요. 잠시 후 다시 시도해 주세요", "err"); return; }
  if (f.size > 8e6) { say("파일이 너무 커요 (8MB 이하만 가능)", "err"); return; }
  let html = "";
  try {
    const txt = (await f.text()).replace(/^\ufeff/, "");
    html = (/\.html?$/i.test(f.name) || f.type === "text/html") ? ta.sanitize(txt) : escH(txt).replace(/\r?\n/g, "<br>");
  } catch (e) { say("파일을 읽지 못했어요", "err"); return; }
  const probe = document.createElement("div"); probe.innerHTML = html;
  if (!probe.textContent.trim() && !probe.querySelector("img,table")) { say("열 내용이 없어요", "err"); return; }
  let append = false;
  if (ta.value !== "") {
    if (confirm("현재 메모 끝에 '" + f.name + "' 내용을 이어 붙일까요?\n\n[확인] 이어 붙이기\n[취소] 다른 방법 선택")) append = true;
    else if (!confirm("현재 메모를 지우고 '" + f.name + "' 내용으로 바꿀까요?\n(되돌릴 수 없어요)\n\n[확인] 바꾸기\n[취소] 열기 취소")) { say("열기를 취소했어요"); return; }
  }
  if (append) {
    ta.focus();
    const s = getSelection(), r = document.createRange();
    r.selectNodeContents(ta); r.collapse(false); s.removeAllRanges(); s.addRange(r);   // 맨 끝으로 이동
    if (!document.execCommand("insertHTML", false, "<br>" + html)) { ta.insertAdjacentHTML("beforeend", "<br>" + html); ta.dispatchEvent(new Event("input", { bubbles: true })); }
  } else {
    ta.value = RICH_PREFIX + html;
    ta.dispatchEvent(new Event("input", { bubbles: true }));   // 자동 저장 / DB 동기화가 이어서 동작
  }
  say("열었어요: " + f.name, "ok");
});

/* Esc: 열린 팝업 → 찾기 창 순서로 닫음 (메모 확대 해제는 팝업/찾기 창이 없을 때만) */
document.addEventListener("keydown", e => {

/* ===== 목표 시각까지 남은 시간 타이머 ===== */
const TIMER_ON=true;                   /* [타이머] 버튼의 처음 상태 (true: 켜짐 / false: 꺼짐) */
const TIMER_DEFAULT="17:00";           /* 목표 시각 기본값 (시:분) */
const TKEY="bc9-target";
(function(){
  const tt=$("tt"),rem=$("rem");
  /* [타이머] 버튼: 켜면 연핑크 영역에 목표 시각·남은 시간 표시, 끄면 색 없는 빈 공간 */
  const box=$("tm"),wrap=$("tmw"),tb=$("tmBtn");let on=TIMER_ON;
  function setOn(v,anim){
    on=v;tb.setAttribute("aria-pressed",String(v));box.setAttribute("aria-hidden",String(!v));
    wrap.classList.toggle("off",!v);
    if(!anim){wrap.style.width=v?"auto":"0px";return}
    const w=box.offsetWidth+"px";
    if(v){wrap.style.width=w;                                   /* 0 → 실제 너비로 펼침, 끝나면 auto */
      const end=e=>{if(e.propertyName==="width"&&on){wrap.style.width="auto";wrap.removeEventListener("transitionend",end)}};
      wrap.addEventListener("transitionend",end)}
    else{wrap.style.width=w;void wrap.offsetWidth;wrap.style.width="0px"}   /* auto → 고정 너비 → 0 으로 접음 */
  }
  tb.addEventListener("click",()=>setOn(!on,true));
  /* 처음 열 때: 접힌 상태에서 시작해 슬라이드로 펼쳐짐 (TIMER_ON=false 면 접힌 채로 시작) */
  if(on){
    wrap.style.width="0px";on=false;
    requestAnimationFrame(()=>requestAnimationFrame(()=>setOn(true,true)));
  }else setOn(false,false);
  let target=TIMER_DEFAULT;
  try{const v=localStorage.getItem(TKEY);if(v)target=v}catch(e){}
  /* "17", "1730", "17:30" 형태를 [시,분,0] 으로 해석 (분 단위까지만, 예전에 저장된 "17:30:15" 는 초를 버림) */
  function parse(s){
    s=String(s).trim();let a;
    if(s.includes(":"))a=s.split(":");
    else if(/^\d{1,2}$/.test(s))a=[s];
    else if(/^\d{3,4}$/.test(s))a=[s.slice(0,-2),s.slice(-2)];
    else return null;
    if(a.length>3||a.some(x=>!/^\d{1,2}$/.test(x)))return null;
    const h=+a[0],m=+(a[1]||0);
    return h<24&&m<60?[h,m,0]:null;
  }
  const p2=n=>String(n).padStart(2,"0");
  const fmt=t=>p2(t[0])+":"+p2(t[1]);
  let tg=parse(target)||parse(TIMER_DEFAULT);
  tt.value=fmt(tg);
  tt.addEventListener("input",()=>{const t=parse(tt.value);tt.style.outline=t||!tt.value?"":"2px solid var(--warn)";if(t){tg=t;try{localStorage.setItem(TKEY,fmt(t))}catch(e){}}});
  tt.addEventListener("blur",()=>{tt.style.outline="";tt.value=fmt(tg);try{localStorage.setItem(TKEY,fmt(tg))}catch(e){}});
  function tick(){
    const now=new Date(),t=new Date(now);t.setHours(tg[0],tg[1],tg[2],0);
    if(t<=now)t.setDate(t.getDate()+1);   /* 목표 시각이 이미 지났으면 다음날 그 시각으로 */
    const ms=t-now,neg=false;
    const tot=Math.ceil(ms/1000),h=Math.floor(tot/3600),m=Math.floor(tot/60)%60,s=tot%60;   /* 초 단위(올림): 0초가 되는 순간 목표 시각 */
    const txt=(neg?"-":"")+p2(h)+":"+p2(m)+":"+p2(s);
    if(rem.textContent!==txt)rem.textContent=txt;
    rem.classList.toggle("neg",neg);
    requestAnimationFrame(tick);
  }
  tick();
})();

/* 시작: 저장된 사용/미사용 상태 복원 */
if(saved&&saved.fb){useFb=true;knownAt=+saved.at||0;dirty=!!saved.d}

else if(!dbSet)say("DB_URL을 먼저 설정해 주세요","err");
else{say("불러오는 중…");firstTry=true;connect()}

/* ===== 기본값으로 초기화: 이 브라우저에 저장된 설정을 지우고 처음 상태로 ===== */
$("resetAll").addEventListener("click",()=>{
  if(!confirm("작업자 코드·사업장 코드·년도·모드·저장 형식·바코드/QR 전환·1~9번 내용·타이머 시각을 모두 기본값으로 되돌릴까요?\n\n(되돌릴 수 없어요)"))return;
  const keep=memoEl.value!==""&&!confirm("메모도 함께 비울까요?\n\n[확인] 메모도 비우기\n[취소] 메모는 그대로 두기");
  const memo=keep?memoEl.value:"";
  useFb=false;dirty=false;clearTimers();   /* DB 사용은 끔 (DB 안의 메모는 건드리지 않아요) */
  try{
    localStorage.removeItem(KEY);localStorage.removeItem(TKEY);
    if(memo)localStorage.setItem(KEY,JSON.stringify({memo:memo}));
  }catch(e){}
  location.reload();
});

/* ===== 파일 첨부: 저장(첨부) / 읽기(다시 파일로 저장) =====
   - 📎 버튼: 파일을 골라 메모 안에 넣어요 (엑셀·문서·압축 파일 등 아무 파일). 파일을 메모로 끌어놓거나 붙여넣어도 돼요.
   - 파일은 base64 로 메모 본문에 들어가므로 "DB n / 3,000,000자" 용량을 함께 써요 (파일 크기의 약 1.33배).
   - 칩을 클릭하거나 '첨부 목록'에서 고르면 원래 파일로 저장돼요. */
let attBack = null;
const attFile = document.getElementById("attFile"), attPop = document.getElementById("attPop"), attN = document.getElementById("attN");
const attFmt = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const attNodes = () => Array.from(ta.querySelectorAll(".att"));
function pickAttach() {
  if (ta.disabled) return;
  attBack = saveRange(); attFile.value = ""; attFile.click();
}
attFile.addEventListener("change", async () => {
  const fs = Array.from(attFile.files || []); if (!fs.length) return;
  if (attBack) attBack();
  say("파일을 넣는 중…"); await ta.insertFiles(fs);
});
function attDownload(c) {
  try {
    const bin = atob(c.getAttribute("data-b64")), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const name = c.getAttribute("data-name") || "file";
    const url = URL.createObjectURL(new Blob([u], { type: c.getAttribute("data-mime") || "application/octet-stream" }));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    say("파일로 저장했어요: " + name, "ok");
  } catch (e) { say("첨부 파일을 읽지 못했어요", "err"); }
}
ta.addEventListener("click", e => {   // 칩 클릭 → 파일로 저장
  const c = e.target.closest && e.target.closest(".att");
  if (!c || !ta.contains(c)) return;
  e.preventDefault(); attDownload(c);
});
function fillAttPop() {
  const L = attNodes(); attPop.textContent = "";
  if (!L.length) {
    const b = document.createElement("button"); b.type = "button"; b.disabled = true; b.textContent = "첨부된 파일이 없어요";
    attPop.appendChild(b); return;
  }
  L.forEach((c, i) => {
    const row = document.createElement("div"); row.className = "row";
    const d = document.createElement("button"); d.type = "button"; d.className = "nm"; d.dataset.attDl = i;
    d.textContent = "⬇ " + c.dataset.name + " (" + attFmt(+c.dataset.size || 0) + ")"; d.title = "클릭하면 파일로 저장돼요";
    const x = document.createElement("button"); x.type = "button"; x.className = "rm"; x.dataset.attDel = i;
    x.textContent = "🗑"; x.title = "메모에서 이 첨부 삭제";
    row.append(d, x); attPop.appendChild(row);
  });
}
tb.addEventListener("click", e => { if (e.target.closest("#attListBtn")) fillAttPop(); }, true);   // 열기 직전에 목록을 새로 채움
attPop.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const L = attNodes();
  if ("attDl" in b.dataset) { const c = L[+b.dataset.attDl]; closePop(); if (c) attDownload(c); }
  else if ("attDel" in b.dataset) {
    const c = L[+b.dataset.attDel]; closePop();
    if (c && confirm("'" + c.dataset.name + "' 첨부를 메모에서 삭제할까요?")) { c.remove(); fire(); say("첨부를 삭제했어요", "ok"); }
  }
});
function updateAttN() { const n = attNodes().length; attN.textContent = n ? "첨부 " + n : "첨부 목록"; }
new MutationObserver(updateAttN).observe(ta, { childList: true, subtree: true });
updateAttN();
