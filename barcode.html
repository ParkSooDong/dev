<script>
/* ===== 글꼴: 시스템 글꼴 목록 + 메모 글자 / 이미지 '글자 넣기' 공통 글꼴 =====
   기본값은 맑은 고딕. 고른 글꼴은 이 기기(브라우저)에 기억해요. 목록은 시스템에 설치된 글꼴에서 가져와요
   (크롬·엣지는 '시스템 글꼴 모두 불러오기'로 전체 목록, 그 외 브라우저는 설치된 대표 글꼴만 보여요). */
(function () {
  const KEY = "memo-font", DEF = "Malgun Gothic", ALL = "__all__";
  const FALL = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";   // 고른 글꼴이 없는 기기에서의 대체 순서
  const KO = { "Malgun Gothic": "맑은 고딕", "Batang": "바탕", "Dotum": "돋움", "Gulim": "굴림", "Gungsuh": "궁서",
    "NanumGothic": "나눔고딕", "Nanum Gothic": "나눔고딕", "NanumBarunGothic": "나눔바른고딕", "NanumMyeongjo": "나눔명조", "Nanum Myeongjo": "나눔명조",
    "HCR Dotum": "함초롬돋움", "HCR Batang": "함초롬바탕", "Apple SD Gothic Neo": "Apple SD 산돌고딕 Neo" };
  const CAND = ["Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Serif KR", "Pretendard", "Nanum Gothic", "NanumGothic", "NanumBarunGothic",
    "Nanum Myeongjo", "NanumMyeongjo", "NanumSquare", "Gulim", "Dotum", "Batang", "Gungsuh", "HCR Dotum", "HCR Batang", "D2Coding",
    "Arial", "Arial Black", "Calibri", "Cambria", "Candara", "Consolas", "Courier New", "Georgia", "Impact", "Lucida Console", "Palatino Linotype",
    "Segoe UI", "Tahoma", "Times New Roman", "Trebuchet MS", "Verdana", "Comic Sans MS", "Helvetica", "Helvetica Neue", "Menlo", "Monaco", "Roboto",
    "Yu Gothic", "Meiryo", "MS Gothic", "SimSun", "Microsoft YaHei"];
  const sel = document.getElementById("fontSel");
  const clean = n => String(n == null ? "" : n).replace(/["'\\;{}<>&\u0000-\u001f]/g, "").trim().slice(0, 80);
  let cur = DEF; try { cur = clean(localStorage.getItem(KEY)) || DEF; } catch (e) {}
  const stack = n => "'" + (clean(n) || DEF) + "'," + FALL;
  window.memoFont = { get name() { return cur; }, css: () => stack(cur), stack: stack };
  const apply = () => document.documentElement.style.setProperty("--mf", stack(cur));
  apply();
  if (!sel) return;

  const cx = document.createElement("canvas").getContext("2d"), PROBE = "mmmmmmmmlliWWW가나다라마바사漢字 0123", BASES = ["monospace", "serif", "sans-serif"];
  const bw = BASES.map(b => { cx.font = "64px " + b; return cx.measureText(PROBE).width; });
  const has = n => BASES.some((b, i) => { cx.font = "64px '" + n + "'," + b; return cx.measureText(PROBE).width !== bw[i]; });   // 설치돼 있으면 대체 글꼴과 폭이 달라져요
  const label = n => KO[n] || n;
  let fams = null;   // 시스템 글꼴 전체 목록 (불러오기 전에는 null)

  function build() {
    const set = new Set([DEF, cur]);
    if (fams) fams.forEach(n => set.add(n)); else CAND.forEach(n => { try { if (has(n)) set.add(n); } catch (e) {} });
    const names = Array.from(set).filter(Boolean).sort((a, b) => a === DEF ? -1 : b === DEF ? 1 : label(a).localeCompare(label(b), "ko"));
    sel.textContent = "";
    for (const n of names) {
      const o = document.createElement("option");
      o.value = n; o.textContent = label(n); o.style.fontFamily = "'" + n + "'," + FALL;
      sel.appendChild(o);
    }
    if (!fams && window.queryLocalFonts) { const o = document.createElement("option"); o.value = ALL; o.textContent = "시스템 글꼴 모두 불러오기…"; sel.appendChild(o); }

  }

    if (!window.queryLocalFonts) return false;
    try {
      const list = await window.queryLocalFonts();   // 브라우저가 허용을 물어봐요

    } catch (e) {
      if (!quiet && typeof toast === "function") toast("시스템 글꼴을 불러오지 못했어요. 브라우저의 '글꼴 접근'을 허용해 주세요");

  /* 툴바의 글꼴 표시를 커서(선택 시작) 위치의 실제 글꼴에 맞춤. 이미지 '글자 넣기'도 이 글꼴을 따라요 */

    const name = clean(v.split(",")[0].replace(/^[\s"']+|[\s"']+$/g, ""));
    if (!name || name.toLowerCase() === cur.toLowerCase()) return;
    let o = Array.from(sel.options).find(x => x.value.toLowerCase() === name.toLowerCase());
    if (!o) {   // 목록에 없는 글꼴(다른 기기에서 쓴 글꼴 등)도 표시
      o = document.createElement("option"); o.value = name; o.textContent = label(name); o.style.fontFamily = "'" + name + "'," + FALL;
      sel.insertBefore(o, sel.options[1] || null);
    }
    cur = o.value; sel.value = cur; apply();
  }
  document.addEventListener("selectionchange", syncFromCaret);
  let lastR = null;   // 메모 안에서 마지막으로 선택/커서가 있던 위치 (글꼴 선택을 눌러도 잃지 않게)
  document.addEventListener("selectionchange", () => {
    const s = getSelection(); if (!s.rangeCount) return;
    const r = s.getRangeAt(0), n = r.commonAncestorContainer, el = n.nodeType === 1 ? n : n.parentElement;
    if (el && el.closest && el.closest(".rich")) lastR = r.cloneRange();
  });
  /* 메모 글자: 선택한 글자에만, 선택이 없으면 이어서 입력하는 글자부터 적용 (이미 쓴 다른 글자는 그대로) */
  function applyToMemo() {
    if (!lastR) return;
    const n = lastR.commonAncestorContainer, el = n.nodeType === 1 ? n : n.parentElement, host = el && el.closest && el.closest(".rich");
    if (!host || !host.isConnected || host.getAttribute("contenteditable") === "false") return;
    busy = true;
    host.focus();
    const s = getSelection(); s.removeAllRanges(); s.addRange(lastR);
    try { document.execCommand("styleWithCSS", false, true); document.execCommand("fontName", false, cur); }
    finally { try { document.execCommand("styleWithCSS", false, false); } catch (e) {} }
    host.dispatchEvent(new Event("input", { bubbles: true }));
    sel.value = cur; setTimeout(() => { busy = false; }, 80);
  }
  sel.addEventListener("change", async () => {
    if (sel.value === ALL) { await loadAll(false); sel.value = cur; return; }
    cur = sel.value; try { localStorage.setItem(KEY, cur); } catch (e) {}
    apply();
    const ev = new CustomEvent("memofontchange", { detail: { name: cur, handled: false } });
    document.dispatchEvent(ev);   // 이미지 글자 편집 중 선택한 요소가 있으면 그쪽에 적용 (handled)
    if (!ev.detail.handled) applyToMemo();
  });
})();
</script>
<script>
/* ===== 리치 메모: 엑셀 표 / 캡처 이미지 붙여넣기 지원 =====
   <div contenteditable> 를 textarea 처럼 .value / .disabled 로 쓸 수 있게 만들어요.
   저장 값은 "<!--h-->" + 정리(sanitize)된 HTML 이고, 예전 순수 글자 메모도 그대로 불러와요. */
const RICH_PREFIX = "<!--h-->";
function makeRich(el) {
  const TAGS = new Set("A B STRONG I EM U S STRIKE SUB SUP BR P DIV SPAN UL OL LI H1 H2 H3 H4 H5 H6 TABLE THEAD TBODY TFOOT TR TD TH CAPTION IMG PRE CODE BLOCKQUOTE HR".split(" "));
  const DROP = new Set("SCRIPT STYLE META LINK TITLE HEAD XML O:P NOSCRIPT IFRAME OBJECT EMBED FORM INPUT BUTTON SELECT TEXTAREA SVG MATH AUDIO VIDEO CANVAS".split(" "));
  const PROPS = new Set("font-weight font-style font-size margin-left text-decoration color background-color text-align vertical-align border border-top border-right border-bottom border-left".split(" "));
  const B64 = /^[A-Za-z0-9+\/]+={0,2}$/, MIME = /^[a-z0-9][a-z0-9.+-]{0,60}\/[a-z0-9][a-z0-9.+-]{0,100}$/i;
  const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const IMG = /^data:image\/(png|jpe?g|gif|webp|bmp);base64,[A-Za-z0-9+\/=]+$/i;
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* 이미지 레이어: 원본은 data-base, 그 위에 얹은 글자·도형·선은 data-layers(JSON)에 따로 보관. 값은 모두 검증해서 정리 */

  const HEX = /^#[0-9a-f]{6}$/i;
  function cleanLayers(str) {
    let o; try { o = JSON.parse(str); } catch (e) { return ""; }
    if (!o || !Array.isArray(o.items) || o.items.length > 300) return "";
    const num = (v, a, b, d) => { v = +v; return isFinite(v) ? Math.min(b, Math.max(a, v)) : d; };
    const W = num(o.W, 10, 20000, 0), H = num(o.H, 10, 20000, 0); if (!W || !H) return "";
    const items = [];
    for (const it of o.items) {
      if (!it || !LT.has(it.t)) continue;

      for (const k of ["x1", "y1", "x2", "y2", "tx", "ty"]) r[k] = num(it[k], -1e5, 1e5, 0);
      r.color = HEX.test(it.color) ? it.color : "#f06595"; r.bgc = HEX.test(it.bgc) ? it.bgc : null;
      r.lw = num(it.lw, 1, 40, 3); r.fs = num(it.fs, 6, 400, 21); r.op = num(it.op, 0, 1, 1);
      r.ff = typeof it.ff === "string" ? it.ff.replace(/["'\\;{}<>&\u0000-\u001f]/g, "").trim().slice(0, 80) : "";
      r.bold = !!it.bold; r.ol = !!it.ol; r.fill = !!it.fill; r.fo = it.fo ? 1 : 0; r.bo = it.bo == null ? null : num(it.bo, 0, 1, 1); r.dash = !!it.dash; r.auto = it.auto !== false;
      r.text = typeof it.text === "string" ? it.text.slice(0, 500) : "";
      r.al = it.al === "left" || it.al === "right" ? it.al : "center";
      r.oc = HEX.test(it.oc) ? it.oc : null; r.rot = num(it.rot, 0, 360, 0); r.fh = !!it.fh;

        r.pts = it.pts.slice(0, 3000).map(q => [num(q && q[0], -1e5, 1e5, 0), num(q && q[1], -1e5, 1e5, 0)]);
      }
      if (it.t === "pic") {   // 이미지 넣기: 올린 이미지(data URL)와 가로세로 비율, 최대 20장
        if (typeof it.src !== "string" || !IMG.test(it.src) || items.filter(q => q.t === "pic").length >= 20) continue;

      }

        const e = document.createElement("span"), fc = (n.getAttribute("color") || "").trim();

const $=id=>document.getElementById(id);
const ed1 = $("memo");
makeRich(ed1);
/* ===== 메모 영역 2분할: 위(memo) / 아래(memo2). 툴바는 하나이고, 마지막으로 클릭한 영역(ta)에 적용돼요 ===== */
const ed2 = document.getElementById("memo2"), ed3 = document.getElementById("memo3"), EDS = [ed1, ed2, ed3];
makeRich(ed2); makeRich(ed3);
const S2 = "<!--s2-->", S3 = "<!--s3-->";   // DB·이 PC 에는 세 영역을 한 문자열로 저장 (다가 비면 가·나 2칸 형식, 나·다가 모두 비면 예전 형식 그대로)
const memoAll = {
  get value() { const a = ed1.value, b = ed2.value, c = ed3.value; return c ? S3 + JSON.stringify([a, b, c]) : b ? S2 + JSON.stringify([a, b]) : a; },
  set value(v) {
    v = String(v || "");
    for (const P of [S3, S2]) if (v.startsWith(P)) { try { const p = JSON.parse(v.slice(P.length)); ed1.value = p[0] || ""; ed2.value = p[1] || ""; ed3.value = p[2] || ""; return; } catch (e) {} }
    ed1.value = v; ed2.value = ed3.value = "";
  },
  get disabled() { return ed1.disabled; },

  get textContent() { return ed1.textContent + ed2.textContent + ed3.textContent; }
};
const onEd = (t, fn) => EDS.forEach(e => e.addEventListener(t, fn));

(() => {   /* 가·나·다 3분할. [세로 분할] 위→아래 기본 80 : 10 : 10 / [가로 분할] 왼쪽→오른쪽 기본 35 : 35 : 30. 둘 다 선택 사항이에요
   - memo 파일: 화면 높이와 관계없이 세로 분할이 기본
   - barcode 파일: 세 줄 모드(확대 전)는 가로 분할, 메모 확대 시는 세로 분할이 기본 (모드별로 고른 방식을 따로 기억)
   - 비교 중에는 가(원본) | 나(변경본) | 다(비교 내역) 가로 배치로 보여요 */
  const gid = id => document.getElementById(id);
  const box = gid("edsplit"), wrap = gid("edwrap"), gut = gid("edgut"), mp = gid("mpane");
  const SPL = [gid("spl"), gid("spl2")], LB = [gid("lbA"), gid("lbB"), gid("lbC")], ED = [ed1, ed2, ed3];
  const layH = gid("layH"), layV = gid("layV");
  const DEFV = [80, 10, 10], DEFH = [35, 35, 30], KV = "memo-split-v", KH = "memo-split-h", KL = "memo-layout-";
  const ctx = () => mp ? (mp.classList.contains("max") ? "x" : "n") : "m";   // m: memo 파일 / n: barcode 세 줄 모드 / x: barcode 확대
  const load = (k, d) => {
    try { const a = JSON.parse(localStorage.getItem(k)); if (Array.isArray(a) && a.length === 3 && a.every(x => typeof x === "number" && x >= 0) && Math.abs(a[0] + a[1] + a[2] - 100) < 0.5) return a; } catch (e) {}
    return d.slice();
  };
  const V = load(KV, DEFV), Hh = load(KH, DEFH);

  const compare = () => wrap.classList.contains("cmpm");
  const pref = () => { let m = null; try { m = localStorage.getItem(KL + ctx()); } catch (e) {} return m === "h" || m === "v" ? m : (ctx() === "n" ? "h" : "v"); };
  const mode = () => compare() ? "h" : pref();
  const arr = () => mode() === "v" ? V : Hh;
  const dflt = () => mode() === "v" ? DEFV : DEFH;
  const trk = (a, min) => a.map(x => "minmax(" + min + "px," + x + "fr)").join(" 10px ");

    SPL[0].setAttribute("aria-valuenow", String(Math.round(a[0]))); SPL[1].setAttribute("aria-valuenow", String(Math.round(a[0] + a[1])));
    SPL.forEach(s => { s.setAttribute("aria-orientation", m === "v" ? "horizontal" : "vertical"); });

  };
  const apply = () => {
    if (compare()) { sync(); return; }   // 비교 중 배치는 비교 코드가 맡아요
    const m = mode(), a = arr();
    wrap.classList.toggle("lv", m === "v"); wrap.classList.toggle("lh", m === "h");
    box.style.gridTemplateRows = m === "v" ? trk(a, 0) : "minmax(0,1fr)";
    box.style.gridTemplateColumns = m === "h" ? trk(a, 0) : "minmax(0,1fr)";
    gut.style.gridTemplateRows = m === "v" ? trk(a, 28) : "minmax(0,1fr)";   // 이름표: 영역이 0 이어도 보이도록 최소 28px
    gut.style.gridTemplateColumns = m === "h" ? trk(a, 28) : "minmax(0,1fr)";
    a.forEach((x, i) => wrap.classList.toggle("c" + (i + 1), x === 0));   // 0 이면 접힌 쪽을 완전히 숨김
    const big = m === "v" ? a.indexOf(Math.max(...a)) : -1;   // (barcode 확대 전, 세로 분할) 가장 큰 쪽 메모를 보여줌
    [0, 1, 2].forEach(i => wrap.classList.toggle("big" + i, i === big));
    sync();
  };

/* 비밀번호 입력창 (입력 마스킹). mode: "enter" 입력 / "new" 새로 정하기 / "legacy" 암호화 안 된 DB 를 암호화로 전환. 취소하면 null */
function askPw(mode, msg) {
  return new Promise(resolve => {
    const $ = id => document.getElementById(id);
    const box = $("pwBox"), form = $("pwForm"), p1 = $("pw1"), p2 = $("pw2"), err = $("pwE"), isNew = mode !== "enter";
    $("pwT").textContent = isNew ? "새 비밀번호 설정" : "비밀번호 입력";
    $("pwD").textContent = mode === "legacy" ? "DB 의 메모가 암호화되어 있지 않아요. 비밀번호를 정하면 암호화해서 다시 저장해요. 분실하면 복구할 수 없어요."
      : isNew ? "이 비밀번호로 메모를 암호화해서 DB 에 저장해요. 분실하면 복구할 수 없어요 (6자 이상)." : "DB 의 메모를 열려면 비밀번호가 필요해요.";
    p1.value = p2.value = ""; p2.hidden = !isNew; err.textContent = msg || "";
    p1.autocomplete = isNew ? "new-password" : "current-password";
    box.hidden = false; setTimeout(() => p1.focus(), 0);
    const done = v => { box.hidden = true; form.onsubmit = $("pwCancel").onclick = box.onkeydown = null; p1.value = p2.value = ""; resolve(v); };
    form.onsubmit = e => {
      e.preventDefault();
      if (!p1.value) { err.textContent = "비밀번호를 입력해 주세요"; return; }
      if (isNew) {
        if (p1.value.length < 6) { err.textContent = "6자 이상으로 정해 주세요"; return; }
        if (p1.value !== p2.value) { err.textContent = "두 비밀번호가 달라요"; return; }
      }
      done(p1.value);
    };
    $("pwCancel").onclick = () => done(null);
    box.onkeydown = e => { if (e.key === "Escape") { e.preventDefault(); done(null); } };
  });
}
/* 암호화된 DB 열기: 맞는 비밀번호가 나올 때까지 반복, 취소하면 null */
async function unlock(d) {
  let msg = "";
  for (;;) {
    if (!pw) { const p = await askPw("enter", msg); if (p === null) return null; setPw(p); }
    try { const t = await decryptMemo(d); dbSalt = d.salt; return t; }
    catch (e) { forgetPw(); msg = "비밀번호가 맞지 않아요"; }
  }
}

async function fetchRemote(){const r=await fetch(URL_MEMO,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}  /* null 또는 {enc,salt,iv,ct,updatedAt} (구버전: {text,updatedAt}) */

async function saveRemote(unloading){
  clearTimers();
  if(!useFb||!ready||!dirty)return;
  if(saving){schedule();return}
  const v=memoAll.value;
  if(utf8Len(v)*4/3>MAX_BYTES){say("메모가 너무 커서 DB에 저장할 수 없어요. 이미지·첨부 파일을 줄여 주세요","err");return}   /* 암호문(base64)은 약 1.33배 */
  saving=true;say("저장 중…");
  try{
    const at=Math.max(Date.now(),knownAt+1);                 /* 기기 시계가 달라도 항상 더 큰 값 */
    const enc=await encryptMemo(v,at);
    if(enc.ct.length>MAX_BYTES){say("메모가 너무 커서 DB에 저장할 수 없어요. 이미지·첨부 파일을 줄여 주세요","err");return}
    const body=JSON.stringify(enc),small=body.length<20000;   /* 창 닫는 중 전송은 작은 메모만 가능 */
    const r=await fetch(URL_MEMO,{method:"PUT",keepalive:unloading===true&&small,headers:{"Content-Type":"application/json"},body});
    if(!r.ok)throw new Error("HTTP "+r.status);
    knownAt=at;
    if(memoAll.value===v){dirty=false;say("저장됨 "+hhmm(),"ok")}else schedule();   /* 저장 중에 더 입력한 경우 */
    saveState();
  }catch(e){say("저장 실패. 5초 뒤 다시 시도해요","err");clearTimeout(idleT);idleT=setTimeout(saveRemote,5000)}
  finally{saving=false}
}

async function poll(){
  if(!useFb||!ready||dirty||saving||document.hidden)return;
  try{
    const r=await fetch(URL_AT,{cache:"no-store"});if(!r.ok)return;
    const at=await r.json();
    if(typeof at==="number"&&at>knownAt){
      say("다른 기기의 변경을 불러오는 중…");
      const d=await fetchRemote();
      if(useFb&&isEnc(d)&&d.updatedAt>knownAt&&!dirty){
        let t;
        try{t=await decryptMemo(d)}catch(e){say("다른 기기의 변경을 복호화하지 못했어요","err");return}
        if(!useFb||dirty)return;
        dbSalt=d.salt;knownAt=d.updatedAt;
        if(memoAll.value!==t){memoAll.value=t;saveState();say("다른 기기의 변경을 반영했어요","ok")}else say("저장됨 "+hhmm(),"ok");
      }
    }
  }catch(e){}
}

/* DB 와 처음 연결: 어느 쪽 메모를 쓸지 정하고 자동저장을 시작 */
async function connect(){
  if(connecting||ready||!useFb||!dbSet)return;
  if(!(window.crypto&&crypto.subtle)){say("암호화를 쓸 수 없는 환경이에요 (https 주소에서 열어 주세요)","err");return}
  connecting=true;
  if(firstTry)memoAll.disabled=true;
  try{
    const d=await fetchRemote();
    if(!useFb)return;
    const enc=isEnc(d),plain=!enc&&!!d&&typeof d.text==="string"&&d.updatedAt>0;
    let rt=null;                                                  /* DB 메모(복호화된 내용) */
    if(enc){
      say("비밀번호를 입력해 주세요");
      rt=await unlock(d);
      if(rt===null){setFb(false);return}                          /* 취소 → 미사용으로 복귀 (DB 내용은 표시하지 않음) */
    }else{
      say("비밀번호를 정해 주세요");
      const p=await askPw(plain?"legacy":"new");
      if(p===null){setFb(false);return}
      setPw(p);dbSalt=null;keyCache.clear();
      if(plain)rt=d.text;
    }
    if(!useFb)return;
    const local=memoAll.value,has=rt!==null;
    if(!has){ if(local)dirty=true; }                              /* DB 가 비어 있음 → 이 PC 메모를 올림 */
    else if(rt===local){knownAt=Math.max(knownAt,d.updatedAt);dirty=false}
    else if(!local){memoAll.value=rt;knownAt=d.updatedAt;dirty=false;saveState()}
    else if(!dirty&&knownAt>0&&d.updatedAt>knownAt){memoAll.value=rt;knownAt=d.updatedAt;saveState()}   /* 다른 기기에서 수정됨 */
    else if(confirm("DB에 저장된 메모와 이 PC의 메모가 달라요.\n\n[확인] DB의 메모로 바꾸기\n[취소] 이 PC의 메모를 DB에 덮어쓰기")){
      memoAll.value=rt;knownAt=d.updatedAt;dirty=false;saveState();
    }else{knownAt=Math.max(knownAt,d.updatedAt);dirty=true}
    if(plain)dirty=true;                                          /* 구버전(평문) DB → 암호화해서 다시 저장 */
    ready=true;say("불러옴","ok");
    if(dirty)saveRemote();
  }catch(e){
    if(useFb)say("불러오기 실패. DB 주소와 규칙을 확인해 주세요","err");
  }finally{connecting=false;firstTry=false;memoAll.disabled=false}
}

/* ===== 목표 시각까지 남은 시간 타이머 ===== */
const TIMER_ON=true;                   /* [타이머] 버튼의 처음 상태 (true: 켜짐 / false: 꺼짐) */
const TIMER_DEFAULT="17:00";           /* 목표 시각 기본값 (시:분) */
const TKEY="bc9-target";
(function(){
  const tt=$("tt"),rem=$("rem");
  /* [타이머] 버튼: 켜면 연핑크 영역에 목표 시각·남은 시간 표시, 끄면 색 없는 빈 공간 */
  const box=$("tm"),wrap=$("tmw"),tb=$("tmBtn");let on=TIMER_ON;
  function setOn(v,anim){
    on=v;tb.setAttribute("aria-pressed",String(v));box.setAttribute("aria-hidden",String(!v));
    wrap.classList.toggle("off",!v);
    if(!anim){wrap.style.width=v?"auto":"0px";return}
    const w=box.offsetWidth+"px";
    if(v){wrap.style.width=w;                                   /* 0 → 실제 너비로 펼침, 끝나면 auto */
      const end=e=>{if(e.propertyName==="width"&&on){wrap.style.width="auto";wrap.removeEventListener("transitionend",end)}};
      wrap.addEventListener("transitionend",end)}
    else{wrap.style.width=w;void wrap.offsetWidth;wrap.style.width="0px"}   /* auto → 고정 너비 → 0 으로 접음 */
  }
  tb.addEventListener("click",()=>setOn(!on,true));
  /* 처음 열 때: 접힌 상태에서 시작해 슬라이드로 펼쳐짐 (TIMER_ON=false 면 접힌 채로 시작) */
  if(on){
    wrap.style.width="0px";on=false;
    requestAnimationFrame(()=>requestAnimationFrame(()=>setOn(true,true)));
  }else setOn(false,false);
  let target=TIMER_DEFAULT;
  try{const v=localStorage.getItem(TKEY);if(v)target=v}catch(e){}
  /* "17", "1730", "17:30" 형태를 [시,분,0] 으로 해석 (분 단위까지만, 예전에 저장된 "17:30:15" 는 초를 버림) */
  function parse(s){
    s=String(s).trim();let a;
    if(s.includes(":"))a=s.split(":");
    else if(/^\d{1,2}$/.test(s))a=[s];
    else if(/^\d{3,4}$/.test(s))a=[s.slice(0,-2),s.slice(-2)];
    else return null;
    if(a.length>3||a.some(x=>!/^\d{1,2}$/.test(x)))return null;
    const h=+a[0],m=+(a[1]||0);
    return h<24&&m<60?[h,m,0]:null;
  }
  const p2=n=>String(n).padStart(2,"0");
  const fmt=t=>p2(t[0])+":"+p2(t[1]);
  let tg=parse(target)||parse(TIMER_DEFAULT);
  tt.value=fmt(tg);
  tt.addEventListener("input",()=>{const t=parse(tt.value);tt.style.outline=t||!tt.value?"":"2px solid var(--warn)";if(t){tg=t;try{localStorage.setItem(TKEY,fmt(t))}catch(e){}}});
  tt.addEventListener("blur",()=>{tt.style.outline="";tt.value=fmt(tg);try{localStorage.setItem(TKEY,fmt(tg))}catch(e){}});
  function tick(){
    const now=new Date(),t=new Date(now);t.setHours(tg[0],tg[1],tg[2],0);
    if(t<=now)t.setDate(t.getDate()+1);   /* 목표 시각이 이미 지났으면 다음날 그 시각으로 */
    const ms=t-now,neg=false;
    const tot=Math.ceil(ms/1000),h=Math.floor(tot/3600),m=Math.floor(tot/60)%60,s=tot%60;   /* 초 단위(올림): 0초가 되는 순간 목표 시각 */
    const txt=(neg?"-":"")+p2(h)+":"+p2(m)+":"+p2(s);
    if(rem.textContent!==txt)rem.textContent=txt;
    rem.classList.toggle("neg",neg);
    requestAnimationFrame(tick);
  }
  tick();
})();

      if (tb) { const d = div(); tb.parentNode.insertBefore(d, tb); return { box: d, h: 0 }; }   // 표의 첫 행: 표 위에
    }
    if (li && ed.contains(li) && atStart(li, f)) { const d = div(); li.parentNode.insertBefore(d, li); return { box: d, h: 0 }; }
    let n = f;   // 줄 맨 앞을 감싼 글자 서식(b, span 등)은 건너뛰어 그 앞에 넣음
    while (n.parentNode && n.parentNode !== ed && !n.previousSibling && n.parentNode.nodeType === 1 && !BOX.test(n.parentNode.nodeName)) n = n.parentNode;
    const d = div(); n.parentNode.insertBefore(d, n); return { box: d, h: 0 };
  }
  function grow(L, d, ed) {
    let g = gaps.get(L); if (!g) { g = makeGap(L, ed); gaps.set(L, g); }
    g.h += d; g.box.style.height = g.h + "px";
  }
  function align(A, B, rows) {   // rows: [위 줄 번호, 아래 줄 번호] — 같은 줄 또는 바뀐 줄 짝
    clearGaps();
    for (let pass = 0; pass < 3; pass++) {   // 표 테두리 등으로 생기는 작은 오차는 다시 재서 보정
      const ys = rows.map(([a, b]) => [topOf(A[a]), topOf(B[b])]);   // 먼저 전부 재고, 그 다음에 끼워 넣음
      let adA = 0, adB = 0, any = false;
      rows.forEach(([a, b], i) => {
        const d = (ys[i][1] + adB) - (ys[i][0] + adA);
        if (d > 0.5) { grow(A[a], d, ed1); adA += d; any = true; }   // 위(원본)가 더 높이 있음 → 원본 쪽에 빈 칸
        else if (d < -0.5) { grow(B[b], -d, ed2); adB -= d; any = true; }   // 아래(변경본)가 더 높이 있음 → 변경본 쪽에 빈 칸
      });
      if (!any) break;
    }
  }
  const schedAlign = () => {
    cancelAnimationFrame(alT);
    alT = requestAnimationFrame(() => {
      if (st && st.rows && !st.approx && wrapEl.classList.contains("cmpm")) { align(st.A, st.B, st.rows); lw1 = ed1.clientWidth; lw2 = ed2.clientWidth; }
    });
  };
  if (window.ResizeObserver) {   // 좌우 폭이 바뀌면 다시 맞춤 (높이만 바뀐 경우는 무시)
    const ro = new ResizeObserver(() => { if (ed1.clientWidth !== lw1 || ed2.clientWidth !== lw2) schedAlign(); });
    ro.observe(ed1); ro.observe(ed2);
  }
  function closeCmp() {   // 비교 종료: 위/아래 배치로 복귀
    clearGaps(); clearHl(); st = null; if (panel) panel.hidden = true;
    if (wrapEl.classList.contains("cmpm")) { wrapEl.classList.remove("cmpm"); layout(); document.getElementById("edsplit").scrollTop = 0; window.refreshSplit(); }
  }
  window.closeCmp = closeCmp;
  function ensurePanel() {
    if (panel) return;
    panel = mk("div", "cmp"); panel.id = "cmp"; panel.setAttribute("role", "dialog"); panel.setAttribute("aria-label", "비교 결과"); panel.hidden = true;
    const h = mk("div", "cmph"); h.appendChild(mk("b", "", "다 · 비교"));
    sumEl = mk("span", "cmps"); h.appendChild(sumEl);
    const x = mk("button", "", "✕"); x.type = "button"; x.title = "닫기 (Esc)"; x.setAttribute("aria-label", "닫기"); x.addEventListener("click", closeCmp); h.appendChild(x);
    listEl = mk("div", "cmpl"); panel.append(h, listEl);
    // 비교 결과는 화면 위에 뜨는 창이 아니라 오른쪽 3번째 영역(별도 스크롤바)으로 배치
    vsp1 = mkHandle("vsp1", "원본과 변경본 사이 폭 조절", 1); document.getElementById("spl").after(vsp1);
    vsp2 = mkHandle("vsp2", "변경본과 비교 결과 사이 폭 조절", 2);
    wrapEl.append(vsp2, panel); layout();
    panel.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); closeCmp(); } });
  }
  function goTo(it, el) {
    if (!st) return;
    listEl.querySelectorAll(".ci.on").forEach(e => e.classList.remove("on")); el.classList.add("on");
    const ls = []; if (it.a >= 0) ls.push(st.A[it.a]); if (it.b >= 0) ls.push(st.B[it.b]);
    if (CH) CSS.highlights.set("cmp-cur", new Highlight(...ls.map(rng)));
    for (const L of ls) { const p = L.nodes[0].parentElement; if (p) p.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }
  function run() {
    ensurePanel(); clearHl(); clearGaps();
    // barcode 는 확대해야 두 영역이 모두 보여요
    if (typeof setMemoMax === "function" && !document.getElementById("mpane").classList.contains("max")) setMemoMax(true);
    wrapEl.classList.remove("c1", "c2", "c3"); wrapEl.classList.add("cmpm"); layout(); document.getElementById("edsplit").scrollTop = 0;   // 왼쪽(원본) / 오른쪽(변경본) 으로 나란히, 스크롤바는 하나
    const A = linesOf(ed1), B = linesOf(ed2); st = { A, B };
    panel.hidden = false; listEl.textContent = ""; sumEl.className = "cmps";
    if (!A.length && !B.length) { sumEl.textContent = "비교할 내용이 없어요 (가·나 메모가 모두 비어 있어요)"; return; }
    const { hs, rows, approx } = hunks(A, B);
    st.rows = rows; st.approx = approx;
    if (!approx) { align(A, B, rows); lw1 = ed1.clientWidth; lw2 = ed2.clientWidth; }   // 같은 줄이 좌우 같은 높이에 오도록 빈 칸 끼워 넣기
    const c = { chg: 0, del: 0, add: 0 }; hs.forEach(h => c[h.k]++);
    if (!hs.length) { sumEl.className = "cmps ok"; sumEl.textContent = "✔ 일치해요 (가 " + A.length + "행 = 나 " + B.length + "행)"; return; }
    sumEl.textContent = "다른 곳 " + hs.length + "건 — 변경 " + c.chg + " · 삭제(가에만) " + c.del + " · 추가(나에만) " + c.add;
    if (approx) listEl.appendChild(mk("div", "cmm", "※ 내용이 너무 많아 순서는 무시하고 '있다/없다'만 비교했어요."));
    const hl = { "cmp-del": [], "cmp-add": [], "cmp-chg": [] };
    hs.forEach((it, idx) => {
      if (it.k === "chg") { hl["cmp-chg"].push(rng(A[it.a]), rng(B[it.b])); }
      else if (it.k === "del") hl["cmp-del"].push(rng(A[it.a]));
      else hl["cmp-add"].push(rng(B[it.b]));
      if (idx >= 300) return;   // 목록은 300건까지만
      const el = mk("div", "ci"), badge = mk("span", "cb " + it.k, it.k === "chg" ? "변경" : it.k === "del" ? "삭제" : "추가");
      el.appendChild(badge);
      el.appendChild(mk("span", "cn", it.k === "chg" ? "가 " + (it.a + 1) + "행 → 나 " + (it.b + 1) + "행" : it.k === "del" ? "가 " + (it.a + 1) + "행 (나에 없음)" : "나 " + (it.b + 1) + "행 (가에 없음)"));
      if (it.k === "chg") {
        const [ra, rb] = wordDiff(A[it.a].n, B[it.b].n);
        const r1 = mk("div", "cr"), r2 = mk("div", "cr"); r1.appendChild(mk("i", "", "가")); r2.appendChild(mk("i", "", "나"));
        const s1 = mk("span"), s2 = mk("span"); fill(s1, ra, "del"); fill(s2, rb, "ins"); r1.appendChild(s1); r2.appendChild(s2); el.append(r1, r2);
      } else {
        const r = mk("div", "cr"); r.appendChild(mk("i", "", it.k === "del" ? "가" : "나")); r.appendChild(mk("span", "", (it.k === "del" ? A[it.a] : B[it.b]).n)); el.appendChild(r);
      }
      el.addEventListener("click", () => goTo(it, el)); listEl.appendChild(el);
    });
    if (hs.length > 300) listEl.appendChild(mk("div", "cmm", "목록에는 처음 300건만 보여요. (색 표시는 전부 적용돼요)"));
    if (CH) for (const k in hl) if (hl[k].length) CSS.highlights.set(k, new Highlight(...hl[k]));
    st.hs = hs;
  }
  document.getElementById("cmpBtn").addEventListener("mousedown", e => e.preventDefault());
  document.getElementById("cmpBtn").addEventListener("click", run);
  onEd("input", () => {   // 내용을 고치면 이전 비교 결과(색 표시)는 더 이상 맞지 않으므로 지움
    if (!st) return;
    clearGaps(); clearHl(); st = null; sumEl.className = "cmps stale"; sumEl.textContent = "내용이 바뀌었어요. [비교]를 다시 눌러 주세요."; listEl.textContent = "";
  });
})();

/* ===== 기본값으로 초기화: 이 브라우저에 저장된 설정을 지우고 처음 상태로 ===== */
$("resetAll").addEventListener("click",()=>{
  if(!confirm("작업자 코드·사업장 코드·년도·모드·저장 형식·바코드/QR 전환·1~9번 내용·타이머 시각을 모두 기본값으로 되돌릴까요?\n\n(되돌릴 수 없어요)"))return;
  const keep=memoAll.value!==""&&!confirm("메모도 함께 비울까요?\n\n[확인] 메모도 비우기\n[취소] 메모는 그대로 두기");
  const memo=keep?memoAll.value:"";
  useFb=false;dirty=false;clearTimers();   /* DB 사용은 끔 (DB 안의 메모는 건드리지 않아요) */
  try{
    localStorage.removeItem(KEY);localStorage.removeItem(TKEY);localStorage.removeItem("memo-font");localStorage.removeItem("memo-split");window.clearLayoutPrefs&&window.clearLayoutPrefs();
    if(memo)localStorage.setItem(KEY,JSON.stringify({memo:memo}));
  }catch(e){}
  location.reload();
});

/* ===== 파일 첨부: 저장(첨부) / 읽기(다시 파일로 저장) =====
   - [파일] ▸ [PC에서 메모로 첨부]: 파일을 골라 메모 안에 넣어요 (엑셀·문서·압축 파일 등 아무 파일). 파일을 메모로 끌어놓거나 붙여넣어도 돼요.
   - 파일은 base64 로 메모 본문에 들어가므로 "DB n / 3,000,000자" 용량을 함께 써요 (파일 크기의 약 1.33배).
   - 칩을 클릭하거나 [파일] ▸ [메모에서 PC로 저장](전체) / [첨부된 파일 목록](하나씩)에서 고르면 원래 파일로 저장돼요. */
let attBack = null;
const attFile = document.getElementById("attFile"), attPop = document.getElementById("attPop"), attMv = document.getElementById("attMv"), attLv = document.getElementById("attLv"), attGo = document.getElementById("attListGo");
const attFmt = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const attNodes = () => EDS.flatMap(e => Array.from(e.querySelectorAll(".att")));
function pickAttach() {
  if (ta.disabled) return;
  attBack = saveRange(); attFile.value = ""; attFile.click();
}
attFile.addEventListener("change", async () => {
  const fs = Array.from(attFile.files || []); if (!fs.length) return;
  if (attBack) attBack();
  say("파일을 넣는 중…"); await ta.insertFiles(fs);
});
function attDownload(c) {
  try {
    const bin = atob(c.getAttribute("data-b64")), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const name = c.getAttribute("data-name") || "file";
    const url = URL.createObjectURL(new Blob([u], { type: c.getAttribute("data-mime") || "application/octet-stream" }));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    say("파일로 저장했어요: " + name, "ok");
  } catch (e) { say("첨부 파일을 읽지 못했어요", "err"); }
}
onEd("click", e => {   // 칩 클릭 → 파일로 저장
  const c = e.target.closest && e.target.closest(".att");
  if (!c || !ta.contains(c)) return;
  e.preventDefault(); attDownload(c);
});
function attSaveAll() {   // [메모에서 PC로 저장]: 메모에 첨부된 파일을 모두 파일로 저장 (여러 개면 차례로)
  const L = attNodes();
  if (!L.length) { toast("저장할 첨부 파일이 없어요"); return; }
  if (L.length > 1) say("첨부 파일 " + L.length + "개를 저장하는 중…");
  L.forEach((c, i) => setTimeout(() => attDownload(c), i * 350));
}
function showAttMenu() { attMv.hidden = false; attLv.hidden = true; }
function fillAttPop() {   // [첨부된 파일 목록]: 같은 팝업 안에서 목록 화면으로 바꿈
  const L = attNodes(); attLv.textContent = "";
  attMv.hidden = true; attLv.hidden = false;
  const back = document.createElement("button"); back.type = "button"; back.dataset.attBack = "1"; back.textContent = "← 뒤로";
  attLv.appendChild(back);
  if (!L.length) {
    const b = document.createElement("button"); b.type = "button"; b.disabled = true; b.textContent = "첨부된 파일이 없어요";
    attLv.appendChild(b); return;
  }
  L.forEach((c, i) => {
    const row = document.createElement("div"); row.className = "row";
    const d = document.createElement("button"); d.type = "button"; d.className = "nm"; d.dataset.attDl = i;
    d.textContent = "⬇ " + c.dataset.name + " (" + attFmt(+c.dataset.size || 0) + ")"; d.title = "클릭하면 파일로 저장돼요";
    const x = document.createElement("button"); x.type = "button"; x.className = "rm"; x.dataset.attDel = i;
    x.textContent = "🗑"; x.title = "메모에서 이 첨부 삭제";
    row.append(d, x); attLv.appendChild(row);
  });
}
tb.addEventListener("click", e => { if (e.target.closest("#attListBtn")) showAttMenu(); }, true);   // 열 때마다 처음 화면(3개 메뉴)부터
attPop.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const L = attNodes();
  if (b.id === "attListGo") { fillAttPop(); return; }
  if ("attBack" in b.dataset) { showAttMenu(); return; }
  if ("attDl" in b.dataset) { const c = L[+b.dataset.attDl]; closePop(); if (c) attDownload(c); }
  else if ("attDel" in b.dataset) {
    const c = L[+b.dataset.attDel]; closePop();
    if (c && confirm("'" + c.dataset.name + "' 첨부를 메모에서 삭제할까요?")) { c.remove(); fire(); say("첨부를 삭제했어요", "ok"); }
  }
});
function updateAttN() { const n = attNodes().length; attGo.textContent = n ? "첨부된 파일 목록 (" + n + ")" : "첨부된 파일 목록"; }
observeEds(updateAttN, { childList: true, subtree: true });
updateAttN();
</script>
