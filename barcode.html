<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<script>
/* 모바일 브라우저의 강제 다크모드 방지: 저장된 모드가 dark일 때만 dark, 그 외에는 항상 light */
(function(){var m="light";try{var s=JSON.parse(localStorage.getItem("bc9-state"));if(s&&s.m==="dark")m="dark"}catch(e){}
document.documentElement.setAttribute("data-theme",m);
document.querySelector('meta[name="color-scheme"]').setAttribute("content",m==="dark"?"dark":"only light")})();
</script>
<title>미니 바코드/QR 3×3</title>
<style>
:root{--bg:#f3f1ec;--ink:#1c1b19;--mute:#76726a;--line:#d9d5cb;--card:#fff;--acc:#1c1b19;--accfg:#fff;
--link:#1a5fd0;--wk:#ffe08a;--wkb:#d9a400;--warn:#c62828;--note:#b85500;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:only light}
:root[data-theme="dark"]{--bg:#17161a;--ink:#ecebe6;--mute:#8d8a82;--line:#34322f;--card:#1f1e22;--acc:#ecebe6;--accfg:#17161a;
--link:#8ab8ff;--wk:#6b5200;--wkb:#d4a91c;--warn:#ff8a80;--note:#ffb74d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;padding:20px 12px}
main{width:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column}
main>*{flex:none}
h1{font-size:24px;margin:0 0 14px;letter-spacing:-.01em}
#kind{cursor:pointer;color:var(--link);font-weight:800;border-bottom:2px dashed var(--link);user-select:none;-webkit-user-select:none}
#kind:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) repeat(2,minmax(0,.8fr));gap:8px;align-items:end;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--mute);min-width:0}
input,select{width:100%;font:inherit;font-size:18px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);min-width:0}
select option{color:#111}
#w{background:var(--wk);border-color:var(--wkb)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cell{border:1.5px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cell.wk{background:var(--wk);border-color:var(--wkb)}
.cell.wk input{background:transparent;border-color:var(--wkb)}
.view{background:var(--card);border-radius:6px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px 3px;overflow:hidden;width:100%}
.view svg{display:block;width:100%;height:clamp(40px,12vw,110px)}
.view[data-k=qr] svg{width:auto;max-width:100%;aspect-ratio:1;height:clamp(70px,24vw,200px)}
.txt{color:#111;font:clamp(10px,1.6vw,18px) ui-monospace,Menlo,monospace;margin-top:3px;word-break:break-all;text-align:center}
.empty,.err{font-size:14px;color:var(--mute);text-align:center}
.err{color:#b3261e}
.cell input{font-size:16px;padding:5px 7px}
.btns{display:flex;gap:4px}
button{flex:1;font:inherit;font-size:15px;font-weight:600;padding:5px 2px;border-radius:6px;border:1.5px solid var(--acc);background:var(--acc);color:var(--accfg);cursor:pointer}
button:disabled{opacity:.35;cursor:default}
textarea{width:100%;font:inherit;font-size:17px;line-height:1.5;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);resize:vertical;min-height:calc(4.5em + 23px)}
textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* 메모 확대(expand): .mslot 이 원래 자리의 높이를 지키고 .mpane 이 확대 대상 */
.mslot{position:relative}
.mpane{position:relative}
.mpane textarea{display:block;padding-right:44px}
.expand{flex:none;position:absolute;top:6px;right:8px;z-index:5;width:28px;height:28px;padding:0;display:grid;place-items:center;font-size:15px;font-weight:400;line-height:1;color:var(--ink);opacity:.55;background:var(--card);border:1.5px solid var(--line);border-radius:7px;cursor:pointer}
.expand:hover,.expand:focus-visible{opacity:1}
.mpane.max{position:fixed;inset:0;z-index:100;background:var(--bg);padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.mpane.max textarea{height:100%;min-height:0;resize:none;padding:14px 48px 14px 14px;border-radius:10px}
.mpane.max .expand{top:max(20px,calc(env(safe-area-inset-top,0px) + 8px));right:26px}
body.has-max{overflow:hidden}
p{color:var(--mute);font-size:14px;margin:12px 0 0}
.warn{color:var(--warn);font-size:16px;font-weight:600}
/* 가로 1280 이상: 1280x1024 고정(모든 내용이 한 화면). 미만: 가로폭 반응형 */
@media (min-width:1280px){
body{padding:12px 0}
main{width:1280px;height:1000px;padding:0 12px}
h1{margin:0 0 8px}
.top{margin-bottom:8px}
.grid{flex:1 1 0;min-height:0;grid-template-rows:repeat(3,minmax(0,1fr))}
.cell{min-height:0}
.view{flex:1 1 0;min-height:0}
.view svg,.view[data-k=qr] svg{flex:1 1 0;min-height:0;height:auto}
.view[data-k=qr] svg{width:auto;max-width:100%;aspect-ratio:1}
label[for-memo],main>label{margin-top:8px!important}
textarea{height:calc(4.5em + 15px);min-height:0;resize:none;padding:6px 10px}
p{margin:6px 0 0}
}
@media (max-width:560px){.top{grid-template-columns:repeat(3,minmax(0,1fr))}.btns{flex-direction:column}}
</style>
</head>
<body>
<main>
<h1>미니 <span id="kind" role="button" tabindex="0" title="클릭하면 바코드/QR 전환">바코드</span> 3×3</h1>
<div class="top">
<label>작업자 코드<input id="w" value="T8836853" autocomplete="off"></label>
<label>사업장 코드<input id="s" value="136" inputmode="numeric" maxlength="3" autocomplete="off"></label>
<label>년도<input id="y" value="" inputmode="numeric" autocomplete="off"></label>
<label>모드<select id="m"><option value="light">라이트</option><option value="dark">다크</option></select></label>
<label>저장 형식<select id="f"><option value="png">PNG</option><option value="svg">SVG</option></select></label>
</div>
<div class="grid" id="g"></div>
<label style="margin-top:12px">메모<div class="mslot" id="mslot"><div class="mpane" id="mpane"><textarea id="memo" rows="3" placeholder="이 곳에 메모해 보세요. 이 컴퓨터의 이 브라우저를 사용한다면, 컴퓨터를 다시 껐다가 켜도 메모가 유지됩니다."></textarea><button class="expand" id="mex" type="button" title="메모 확대 / 축소 (Esc)" aria-label="메모 확대">⤢</button></div></div></label>
<p>Code 128 / QR(오류정정 M) · 선택한 모드가 화면과 저장 파일에 모두 적용돼요. 4번은 작업자 코드, 나머지는 직접 입력도 가능해요. 사업장 코드(앞 3자리-)와 년도(○○○-XX 뒤 2자리)를 바꾸면 1~9번 전체에 일괄 적용돼요.</p>
<p class="warn" role="alert">입력하거나 수정한 내용은 이 기기의 브라우저에 자동 저장되므로, 웹페이지를 닫았다가 다시 열어도 직전 상태가 다시 보입니다.</p>
</main>

<script>
const P="212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(" ");
const $=id=>document.getElementById(id);
const THEME={light:{fg:"#000",bg:"#fff"},dark:{fg:"#fff",bg:"#111111"}};
function encode(s){
  const c=[104];
  for(const ch of s){const k=ch.charCodeAt(0);if(k<32||k>126)throw new Error("지원하지 않는 문자: "+ch);c.push(k-32)}
  let sum=104;for(let i=1;i<c.length;i++)sum+=c[i]*i;
  c.push(sum%103,106);return c.map(v=>P[v]).join("");
}
function build(s,t){
  const w=encode(s),q=10,m=2;let x=q,r="";
  for(let i=0;i<w.length;i++){const n=+w[i]*m;if(i%2===0)r+=`<rect x="${x}" y="0" width="${n}" height="60" fill="${t.fg}"/>`;x+=n}
  const W=x+q;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} 60" width="${W}" height="60"><rect width="${W}" height="60" fill="${t.bg}"/>${r}</svg>`;
}
let kind="barcode";
function buildQR(s,t){
  for(const ch of s){const k=ch.charCodeAt(0);if(k<32||k>126)throw new Error("지원하지 않는 문자: "+ch)}
  const q=qrcode(0,"M");q.addData(s,"Byte");q.make();
  const n=q.getModuleCount(),z=4,W=n+z*2;let r="";
  for(let y=0;y<n;y++){let x=0;while(x<n){if(q.isDark(y,x)){let e=x;while(e<n&&q.isDark(y,e))e++;r+=`<rect x="${x+z}" y="${y+z}" width="${e-x}" height="1"/>`;x=e}else x++}}
  const px=W*8;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${W}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="${W}" height="${W}" fill="${t.bg}"/><g fill="${t.fg}">${r}</g></svg>`;
}
const buildAny=(s,t)=>kind==="qr"?buildQR(s,t):build(s,t);
const defs=()=>{const S=$("s").value,Y=$("y").value.replace(/\D/g,"").slice(-2);return ["","","",$("w").value,`${S}-XY0-1-5`,`${S}-XY0-1-6`,`${S}-XX${Y}-1-501`,`${S}-XY0-1-10`,`${S}-13G10-13-401`]};
const cells=[];let yEdited=false;
const KEY="bc9-state";
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
const saved=loadState();
if(saved&&saved.k==="qr")kind="qr";
$("y").value=new Date().getFullYear();
if(saved){
  if(typeof saved.w==="string")$("w").value=saved.w;
  if(typeof saved.s==="string")$("s").value=saved.s;
  if(saved.y){$("y").value=saved.y;yEdited=true}
  if(["light","dark"].includes(saved.m))$("m").value=saved.m;
  if(["png","svg"].includes(saved.f))$("f").value=saved.f;
  if(typeof saved.memo==="string")$("memo").value=saved.memo;
}
function applyTheme(){const m=$("m").value;document.documentElement.setAttribute("data-theme",m);
  document.querySelector('meta[name="color-scheme"]').setAttribute("content",m==="dark"?"dark":"only light");
  document.querySelector('meta[name="supported-color-schemes"]').setAttribute("content",m==="dark"?"dark":"light")}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify({w:$("w").value,s:$("s").value,y:yEdited?$("y").value:null,m:$("m").value,k:kind,f:$("f").value,memo:$("memo").value,cells:cells.map(c=>c.inp.value)}))}catch(e){}}
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function fname(i,mode,ext){
  const safe=v=>v.replace(/[^\w-]+/g,"_");
  return `${safe($("y").value)||"year"}_${safe(cells[i].inp.value)}_${kind==="qr"?"qr_":""}${mode}.${ext}`;
}
function download(i,mode){
  const v=cells[i].inp.value;if(!v)return;
  let svg;try{svg=buildAny(v,THEME[mode])}catch(e){return}
  if($("f").value==="svg"){save(new Blob([svg],{type:"image/svg+xml"}),fname(i,mode,"svg"));return}
  const img=new Image();
  img.onload=()=>{const k=kind==="qr"?1:3,c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>save(b,fname(i,mode,"png")))};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function draw(i){
  const {inp,view,bl}=cells[i],v=inp.value;
  bl.disabled=true;view.textContent="";view.style.background=THEME[$("m").value].bg;
  const d=document.createElement("div");
  if(!v){d.className="empty";d.textContent="코드를 입력하세요";view.append(d);return}
  try{view.insertAdjacentHTML("beforeend",buildAny(v,THEME[$("m").value]));
    const sv=view.querySelector("svg");sv.removeAttribute("width");sv.removeAttribute("height");
    view.dataset.k=kind;
    if(kind!=="qr")sv.setAttribute("preserveAspectRatio","none");
    const t=document.createElement("div");t.className="txt";t.textContent=v;t.style.color=THEME[$("m").value].fg;view.append(t);bl.disabled=false}
  catch(e){d.className="err";d.textContent=e.message;view.append(d)}
}
const drawAll=()=>cells.forEach((_,i)=>draw(i));
function init(){
  const g=$("g"),d=defs();
  for(let i=0;i<9;i++){
    const el=document.createElement("div");el.className="cell"+(i===3?" wk":"");
    el.innerHTML=`<div class="view"></div><input aria-label="바코드 ${i+1}번 내용${i===3?" (작업자)":""}" placeholder="${i+1}번" autocomplete="off"><div class="btns"><button>저장</button></div>`;
    const c={inp:el.querySelector("input"),view:el.querySelector(".view"),bl:el.querySelector("button")};
    c.inp.value=d[i];
    c.inp.addEventListener("input",()=>{draw(i);saveState()});
    c.bl.onclick=()=>download(i,$("m").value);
    cells.push(c);g.append(el);
  }
}
/* 사업장 코드: 값이 'ddd-'로 시작하면 1~9번 모두 앞 3자리를 교체 */
function applyShop(){
  const S=$("s").value.trim();if(!/^\d{3}$/.test(S))return;
  cells.forEach(c=>{if(/^\d{3}-/.test(c.inp.value))c.inp.value=S+c.inp.value.slice(3)});
}
/* 년도: 'ddd-XXdd' 구성이면 1~9번 모두 뒤 두 자리를 교체 */
function applyYear(){
  const D=$("y").value.replace(/\D/g,"");if(D.length<2)return;
  const Y=D.slice(-2);
  cells.forEach(c=>{c.inp.value=c.inp.value.replace(/^(\d{3}-XX)\d{2}(?!\d)/,(m,a)=>a+Y)});
}
function setKind(){$("kind").textContent=kind==="qr"?"QR":"바코드";document.title=kind==="qr"?"미니 QR 3×3":"미니 바코드 3×3"}
$("kind").addEventListener("click",()=>{kind=kind==="qr"?"barcode":"qr";setKind();drawAll();saveState()});
$("kind").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("kind").click()}});
init();setKind();
if(saved&&Array.isArray(saved.cells)){cells.forEach((c,i)=>{const v=saved.cells[i];if(typeof v==="string")c.inp.value=v})}
cells[3].inp.value=$("w").value;
if(!yEdited)applyYear();
applyTheme();drawAll();
$("m").addEventListener("change",()=>{applyTheme();drawAll();saveState()});
$("w").addEventListener("input",()=>{cells[3].inp.value=$("w").value;draw(3);saveState()});
$("s").addEventListener("input",()=>{applyShop();drawAll();saveState()});
$("y").addEventListener("input",()=>{yEdited=true;applyYear();drawAll();saveState()});
$("f").addEventListener("change",saveState);$("memo").addEventListener("input",saveState);
/* 메모 확대/축소: 버튼 또는 Esc. CSS 만 바꾸므로 입력 내용·커서·저장 상태는 그대로이고, 나머지 화면 레이아웃도 변하지 않음 */
const mpane=$("mpane"),mslot=$("mslot"),mex=$("mex");
function setMemoMax(on){
  if(on)mslot.style.height=mpane.getBoundingClientRect().height+"px";   /* 확대 중에도 원래 자리의 높이 유지 */
  else mslot.style.height="";
  mpane.classList.toggle("max",on);
  document.body.classList.toggle("has-max",on);
  mex.textContent=on?"✕":"⤢";
  mex.setAttribute("aria-label",on?"메모 축소":"메모 확대");
}
mex.addEventListener("mousedown",e=>e.preventDefault());   /* 버튼을 눌러도 메모의 커서/포커스 유지 */
mex.addEventListener("click",()=>setMemoMax(!mpane.classList.contains("max")));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&mpane.classList.contains("max"))setMemoMax(false)});
saveState();
</script>
