<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모장</title>
<style>
:root{--bg:#f3f1ec;--ink:#1c1b19;--mute:#76726a;--line:#d9d5cb;--card:#fffefb;--mfg:#2b8a3e;--ok:#2e7d32;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--ink:#ecebe6;--mute:#8d8a82;--line:#34322f;--card:#1e1d21;--mfg:#4cc764;--ok:#81c784;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;padding:12px;gap:8px}
header{display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:6px 10px}
.fbbtn{flex:none;font:inherit;font-size:13px;font-weight:600;padding:2px 12px;border-radius:999px;background:transparent;color:var(--ink);border:1.5px solid var(--line);cursor:pointer}
.fbbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#dbGrp{display:inline-flex;gap:4px;align-items:center}
#dbGrp[hidden]{display:none}
.dbbtn{font-size:11px;padding:1px 9px}
.dbbtn:disabled{opacity:.4;cursor:not-allowed}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
#st{font-size:12px;color:var(--mute)}
#st:empty{display:none}
/* 제목 줄: 메모장 | Firebase 버튼 | 상태 | DB 글자 수 — 왼쪽부터 차례로, 구분선만 둠 */
header h1::after{content:"";display:inline-block;width:1px;height:12px;background:var(--line);margin-right:10px;vertical-align:-1px;margin-left:10px}
#st::before,#cnt::before{content:"";display:inline-block;width:1px;height:12px;background:var(--line);margin-right:10px;vertical-align:-1px}
#st.ok{color:var(--ok)}
#st.err{color:var(--err)}
#cnt{font-size:12px;color:var(--mute);white-space:nowrap}
#cnt.cw{color:#e8590c}
#cnt.ce{color:var(--err);font-weight:600}
/* .slot 이 자리를 지키고 .pane(확대 대상)이 그 안을 채움 → 확대해도 원래 레이아웃은 그대로 */
/* 메모와 이후 추가될 비메모 영역을 구분: 메모 작업면을 별도 패널로 묶어요 */
.slot{flex:1;min-height:0;position:relative;margin-top:2px;padding:8px;border:1.5px solid var(--line);border-radius:12px;background:#ebe8df;box-shadow:0 1px 3px rgba(0,0,0,.06)}
:root[data-theme="dark"] .slot{background:#1d1c21}
.pane{inset:8px}
header{padding-bottom:8px;border-bottom:1.5px solid var(--line)}
header h1::before{content:"";display:inline-block;width:4px;height:16px;border-radius:2px;background:#339af0;margin-right:8px;vertical-align:-2px}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px}
.rich{display:block;overflow:auto;word-break:break-word;outline:none}
.rich:empty::before{content:attr(data-ph);color:var(--mute);font-size:14px;pointer-events:none}
.rich img{display:inline-block;vertical-align:middle;max-width:100%;margin:2px 0}.rich img:not([height]){height:auto}
/* 이미지 크기 조절 / 도형 넣기 */
.imgx-box{position:fixed;z-index:110;border:2px solid #339af0;box-sizing:border-box;pointer-events:none}
.imgx-hint{position:fixed;z-index:120;pointer-events:none;padding:5px 10px;border-radius:7px;background:#1f2937;color:#fff;font-size:12.5px;line-height:1.4;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.imgx-hint[hidden]{display:none}
.imgx-pop{position:fixed;z-index:121;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.imgx-pop[hidden]{display:none}
.imgx-bar .imgx-pop button{text-align:left;padding:5px 12px}
.imgx-pop button{flex:none;width:auto;height:auto;margin:0;font:inherit;font-size:13px;font-weight:400;padding:5px 12px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;text-align:left}
.imgx-pop button:hover{background:var(--line)}
.imgx-pop{color:var(--ink)}
.imgx-bar .imgx-sl{display:inline-flex;flex-direction:row;align-items:center;gap:5px;font-size:13px;color:var(--ink);white-space:nowrap;min-width:auto;flex:none}.imgx-bar .imgx-sl input[type=range]{width:130px;flex:none;margin:0;padding:0;border:0;background:transparent;height:auto;min-width:0}.imgx-bar .imgx-sl input[type=number]{width:58px;flex:none;height:28px;padding:0 4px;font-size:13px}
.imgx-grip.gr{right:-10px;bottom:auto;top:calc(50% - 10px);border-radius:6px;cursor:ew-resize}.imgx-grip.gb{bottom:-10px;right:auto;left:calc(50% - 10px);border-radius:6px;cursor:ns-resize}
.imgx-grip{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;border-radius:50%;background:#339af0;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:nwse-resize;pointer-events:auto;touch-action:none}
.imgx-bar{flex:none;position:static;margin-bottom:6px;padding:4px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;color:var(--ink)}
.imgx-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.imgx-bar .imgx-row+.imgx-row{margin-top:4px;padding-top:4px;border-top:1px solid var(--line)}
.imgx-bar button{flex:none;width:auto;height:auto;margin:0;font:inherit;font-size:13px;font-weight:400;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.imgx-bar button:hover{background:var(--line)}
.imgx-bar button:disabled{opacity:.4;cursor:default;background:transparent}
.imgx-bar button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.imgx-bar .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.imgx-bar button.ic{padding:3px 5px;line-height:0}.imgx-bar button.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.imgx-bar button.ic[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.imgx-bar [hidden]{display:none}
.imgx-bar input[type=color]{width:34px;height:28px;padding:1px;margin:0;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer}
.imgx-bar input[type=number]{width:62px;height:28px;margin:0;padding:0 4px;box-sizing:border-box;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.imgx-bar select{width:auto;height:28px;margin:0;padding:0 4px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.imgx-tbox{position:fixed;z-index:112}
.imgx-tbox textarea{display:block;box-sizing:border-box;margin:0;padding:2px 4px;border:1px dashed #339af0;border-radius:2px;background:transparent;font-family:inherit;line-height:1.3;white-space:pre;overflow:hidden;resize:none;outline:none;min-width:40px}
.imgx-tgrip{position:absolute;left:-22px;top:-2px;width:20px;height:20px;border-radius:5px;background:#339af0;color:#fff;font-size:13px;line-height:20px;text-align:center;cursor:move;touch-action:none;user-select:none}
.imgx-box[hidden],.imgx-bar[hidden],.imgx-row[hidden]{display:none}
.imgx-ov{position:fixed;z-index:109;display:block;overflow:hidden;touch-action:none;cursor:crosshair;background:conic-gradient(#cfcfcf 25%,#fff 0 50%,#cfcfcf 0 75%,#fff 0) 0 0/16px 16px}
.imgx-ov.er{cursor:none}
.imgx-ov>canvas,.imgx-ov>svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.imgx-bar textarea{width:150px;height:44px;margin:0;padding:4px 6px;font:inherit;font-size:13px;line-height:1.3;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);resize:none}
.imgx-bar textarea[hidden]{display:none}
.rich table{border-collapse:collapse;margin:4px 0;display:inline-table;vertical-align:top}   /* 표도 글자처럼: 앞뒤에 글자를 넣을 수 있고 줄 정렬을 따라가요 */
.rich td,.rich th{border:1px solid var(--line);padding:2px 6px;vertical-align:top;min-width:2em;box-sizing:border-box}
/* 확대된 메모(.pane.max, z-index:100) 위에 보이도록 조절 막대는 그보다 높게 */
#tblRz{position:fixed;z-index:106;width:12px;margin:0;padding:0;cursor:col-resize;touch-action:none;background:transparent;border-right:3px solid rgba(43,138,62,.5);border-radius:0 3px 3px 0}
#tblRz:hover,#tblRz.on{background:rgba(43,138,62,.25);border-right-color:rgba(43,138,62,.95)}
#tblRz[hidden]{display:none}
#tblBz{position:fixed;z-index:106;height:12px;margin:0;padding:0;cursor:row-resize;touch-action:none;background:transparent;border-bottom:3px solid rgba(43,138,62,.5);border-radius:0 0 3px 3px}
#tblBz:hover,#tblBz.on{background:rgba(43,138,62,.25);border-bottom-color:rgba(43,138,62,.95)}
#tblBz[hidden]{display:none}
.rich.rzc,.rich.rzc *{cursor:col-resize!important}
.rich.rzr,.rich.rzr *{cursor:row-resize!important}
.rich a{color:inherit}
/* 파일 첨부 칩 */
.rich .att{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;padding:2px 10px;margin:2px 4px 2px 0;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font-size:.95em;line-height:1.5;cursor:pointer;user-select:none}
.rich .att:hover{background:var(--line)}
.tb .pop#attPop{max-width:min(380px,80vw)}
#attPop>div,#tblPop>div{display:flex;flex-direction:column}#attPop>div[hidden],#tblPop>div[hidden]{display:none}
.tb .pop button.dim{opacity:.45}
#attPop .row{display:flex;gap:2px;align-items:center}
#attPop .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block;text-align:left;line-height:32px}
#attPop .row .rm{min-width:32px;flex:none;padding:0}
.rich h1{font-size:1.6em;line-height:1.3;margin:.5em 0 .25em;letter-spacing:-.01em}
.rich h2{font-size:1.3em;line-height:1.3;margin:.5em 0 .25em}
.rich h3{font-size:1.1em;line-height:1.3;margin:.5em 0 .25em}
.rich ul,.rich ol{margin:.3em 0;padding-left:1.6em}
.rich hr{border:0;border-top:1.5px solid var(--line);margin:.8em 0}
.rich blockquote{margin:.5em 0;padding:.1em 0 .1em 12px;border-left:3px solid var(--line);color:var(--mute)}
.rich pre{margin:.4em 0;padding:8px 10px;border-radius:7px;background:var(--line);font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:.92em;white-space:pre-wrap}
/* 찾기 */
.fbar{flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.fbar[hidden]{display:none}
.fbar input{flex:1;min-width:0;font:inherit;font-size:14px;padding:4px 8px;border:1.5px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.fbar button{font:inherit;font-size:14px;min-width:32px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer}
.fbar button:hover{background:var(--line)}
.fbar span{font-size:12px;color:var(--mute);min-width:3.5em;text-align:center}
::highlight(find){background:#ffe066;color:#1c1b19}
::highlight(findcur){background:#ff922b;color:#1c1b19}
.edwrap{flex:1}
.rich{flex:1;min-height:0;width:100%;font:inherit;font-size:15px;line-height:1.6;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--mfg)}
/* 서식 툴바 */
.edsplit{display:grid;grid-template-rows:minmax(0,1fr) 10px minmax(0,8fr) 10px minmax(0,1fr);min-height:0}
/* 비교 모드: 위/아래 → 왼쪽(원본)/오른쪽(변경본), 스크롤바는 하나(두 영역이 함께 스크롤) */
.cmphd{display:none}
.edwrap.cmpm .edgut{display:none}
.edwrap.cmpm .edsplit{display:grid;grid-template-columns:minmax(0,1fr) 10px minmax(0,1fr);grid-template-rows:auto 1fr!important;overflow:auto}
.edwrap.cmpm .cmphd{display:block;position:sticky;top:0;z-index:3;padding:3px 10px;font-size:12px;font-weight:700;color:var(--mute);background:var(--bg);border-bottom:1.5px solid var(--line)}
.edwrap.cmpm .cmphd.l{grid-column:1;grid-row:1}
.edwrap.cmpm .cmphd.r{grid-column:3;grid-row:1}
.edwrap.cmpm #memo{grid-column:1;grid-row:2}
.edwrap.cmpm #memo2{grid-column:3;grid-row:2}
.edwrap.cmpm .splitter,.edwrap.cmpm #memo3{display:none}
/* 비교 모드 3분할: [원본 | 변경본] (하나의 스크롤바로 함께 이동) | [비교 결과] (별도 스크롤바). 폭은 구분선을 끌어서 조절 (기본 35 : 35 : 30) */
.edwrap.cmpm{display:grid;grid-template-columns:minmax(0,60fr) 10px minmax(0,40fr);grid-template-rows:minmax(0,1fr);gap:0}
.edwrap.cmpm .edsplit{grid-column:1;grid-row:1;min-width:0;min-height:0}
.vsp{display:none}
.edwrap.cmpm .vsp{display:block;position:relative;cursor:col-resize;touch-action:none;outline:none;user-select:none}
.edwrap.cmpm .vsp::after{content:"";position:absolute;top:0;bottom:0;left:3px;right:3px;border-radius:2px;background:var(--mute);opacity:.35;transition:opacity .15s}
.edwrap.cmpm .vsp:hover::after,.edwrap.cmpm .vsp:focus-visible::after,.edwrap.cmpm .vsp.drag::after{opacity:1}
.edwrap.cmpm .vsp1{grid-column:2;grid-row:1/3}
.edwrap.cmpm .vsp2{grid-column:2;grid-row:1}
.edwrap.cmpm>.vsp2{align-self:stretch}
.edwrap>.cmp{position:static;right:auto;bottom:auto;width:auto;max-height:none;min-width:0;min-height:0;overflow:hidden;box-shadow:none;border-radius:10px}
.edwrap.cmpm>.cmp{grid-column:3;grid-row:1}
.edwrap.cmpm .edsplit>.rich{overflow:visible;height:auto;min-height:auto}
/* 비교 모드 줄맞춤용 빈 칸: 같은 줄이 좌우에서 같은 높이에 오도록 한쪽에 끼워 넣는 화면 전용 여백 (저장되지 않음) */
.cmpgap{display:block;margin:0;padding:0;border:0;pointer-events:none;-webkit-user-select:none;user-select:none;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
tr.cmpgap{display:table-row;background:none}
tr.cmpgap>td{padding:0;border:0;line-height:0;font-size:0;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
.edwrap.cmpm .edsplit{scrollbar-gutter:stable}
/* 비교: 위(원본) 기준으로 아래(변경본)의 다른 부분을 찾아 표시 */
::highlight(cmp-del){background:rgba(224,49,49,.28)}
::highlight(cmp-add){background:rgba(47,158,68,.30)}
::highlight(cmp-chg){background:rgba(250,176,5,.40)}
::highlight(cmp-cur){background:rgba(51,154,240,.50)}
.cmp{position:fixed;right:12px;bottom:12px;z-index:115;width:min(580px,94vw);max-height:48vh;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.3);font-size:13px;line-height:1.45}
.cmp[hidden]{display:none}
.cmp .cmph{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px}
.cmp .cmph b{font-size:14px}
.cmp .cmps{flex:1;min-width:0;color:var(--mute)}
.cmp .cmps.ok{color:#2e7d32;font-weight:600}
.cmp .cmps.stale{color:#e8590c;font-weight:600}
.cmp button{flex:none;width:auto;height:auto;margin:0;font:inherit;font-size:14px;font-weight:400;padding:2px 9px;border:0;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer}
.cmp button:hover{background:var(--line)}
.cmp .cmpl{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line)}
.cmp .ci{padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.cmp .ci:hover{background:var(--line)}
.cmp .ci.on{outline:2px solid #339af0;outline-offset:-2px}
.cmp .cb{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;margin-right:6px;color:#1c1b19}
.cmp .cb.chg{background:#ffd43b}.cmp .cb.del{background:#ff8787}.cmp .cb.add{background:#8ce99a}
.cmp .cn{color:var(--mute);font-size:12px}
.cmp .cr{display:flex;gap:6px;margin-top:2px;font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-word;tab-size:4}
.cmp .cr>i{flex:none;font-style:normal;color:var(--mute);width:2.2em}
.cmp .cr del{background:rgba(224,49,49,.28);text-decoration:none}
.cmp .cr ins{background:rgba(47,158,68,.32);text-decoration:none}
.cmp .cmm{padding:6px 10px;color:var(--mute);font-size:12px}
.edwrap{display:flex;gap:6px;min-height:0}
.edsplit{flex:1;min-width:0}
.edgut{flex:none;width:34px;display:grid;grid-template-rows:minmax(28px,1fr) 10px minmax(28px,8fr) 10px minmax(28px,1fr);min-height:0}
.edwrap.c1 #memo,.edwrap.c2 #memo2,.edwrap.c3 #memo3{padding:0;border-width:0;overflow:hidden;visibility:hidden}
.lb{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;min-height:0;padding:0;white-space:nowrap;font:inherit;font-size:12px;font-weight:600;line-height:1;border:1.5px solid var(--line);border-radius:7px;background:transparent;color:var(--mute);cursor:pointer;width:auto}
.lb:hover{background:var(--line)}
.lb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lb.has::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;opacity:.8}
.lb:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.edsplit>.rich{min-height:0;height:auto}
.splitter{position:relative;cursor:row-resize;touch-action:none;outline:none}
.splitter::after{content:"";position:absolute;left:35%;right:35%;top:3px;height:4px;border-radius:2px;background:var(--mute);opacity:.45;transition:opacity .15s}
.splitter:hover::after,.splitter:focus-visible::after,.splitter.drag::after{opacity:1}
/* 가로 3분할: 이름표는 위쪽 한 줄, 영역은 왼쪽부터 가·나·다 (기본 35 : 35 : 30). 세로 3분할은 기본 80 : 10 : 10 */
.edwrap.lh{flex-direction:column}
.edwrap.lh .edgut{width:auto;height:26px;grid-auto-flow:column}
.edwrap.lh:not(.cmpm) .edsplit{grid-auto-flow:column}
.edwrap.lh .splitter{cursor:col-resize}
.edwrap.lh .splitter::after{left:3px;right:3px;top:0;bottom:0;height:auto}
.tb{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.tb button{font:inherit;font-size:14px;min-width:32px;height:32px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer}
.tb button:hover{background:var(--line)}
.tb button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tb button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
/* 글꼴 선택 (시스템 글꼴) */

<script>
/* 색상 팔레트(네이티브 color 선택창) 공통 처리: 'change' 는 선택창이 완전히 닫혀야 오고, 닫으려고 누른 클릭이 먼저 처리되는 바람에 예전 색이 쓰이던 문제를 막아요.
   고르는 즉시 오는 'input' 값을 기억해 두고, 'change' / 다음 클릭 / 키 입력 / 창 포커스 복귀 중 먼저 오는 때 한 번만 적용해요 */
window.armPicker = function (pk, apply) {
  pk._apply = apply; pk._pend = null;
  if (pk._bound) return; pk._bound = true;
  const flush = () => { if (pk._pend == null) return; const v = pk._pend; pk._pend = null; if (pk._apply) pk._apply(v); };
  pk.addEventListener("input", () => { pk._pend = pk.value; });
  pk.addEventListener("change", () => { pk._pend = pk.value; flush(); });
  document.addEventListener("pointerdown", flush, true);
  document.addEventListener("keydown", flush, true);
  window.addEventListener("focus", flush);
};
/* #색상값 입력칸 공통: '#rrggbb'(rrggbb, #rgb 도 가능)를 직접 입력하고 Enter 를 치면 그 색이 선택된 것으로 해요.
   - 값이 올바르지 않으면 빨간 테두리만 보이고 아무것도 바뀌지 않아요
   - 입력 중 다른 곳을 누르면(칸을 벗어나면) 입력하던 글은 버리고 원래 색 표시로 돌아가요 */
window.hexParse = function (s) {
  s = String(s == null ? "" : s).trim().replace(/^#/, "");
  if (/^[0-9a-f]{3}$/i.test(s)) s = s.replace(/./g, "$&$&");
  return /^[0-9a-f]{6}$/i.test(s) ? "#" + s.toLowerCase() : null;
};
window.hexInput = function (inp, commit, resync) {
  const ok = () => { inp.classList.remove("bad"); inp.removeAttribute("aria-invalid"); };
  inp.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.isComposing) return;
    e.preventDefault(); e.stopPropagation();
    const v = window.hexParse(inp.value);
    if (!v) { inp.classList.add("bad"); inp.setAttribute("aria-invalid", "true"); return; }
    ok(); commit(v);
  });
  inp.addEventListener("input", ok);
  inp.addEventListener("blur", () => { ok(); if (resync) resync(); });
};
</script>
<script>
/* ===== 글꼴: 시스템 글꼴 목록 + 메모 글자 / 이미지 '글자 넣기' 공통 글꼴 =====
   기본값은 맑은 고딕. 고른 글꼴은 이 기기(브라우저)에 기억해요. 목록은 시스템에 설치된 글꼴에서 가져와요
   (크롬·엣지는 '시스템 글꼴 모두 불러오기'로 전체 목록, 그 외 브라우저는 설치된 대표 글꼴만 보여요). */
(function () {
  const KEY = "memo-font", DEF = "Malgun Gothic", ALL = "__all__";
  const FALL = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";   // 고른 글꼴이 없는 기기에서의 대체 순서

    "NanumGothic": "나눔고딕", "Nanum Gothic": "나눔고딕", "NanumBarunGothic": "나눔바른고딕", "NanumMyeongjo": "나눔명조", "Nanum Myeongjo": "나눔명조",
    "HCR Dotum": "함초롬돋움", "HCR Batang": "함초롬바탕", "Apple SD Gothic Neo": "Apple SD 산돌고딕 Neo" };
  const CAND = ["Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Serif KR", "Pretendard", "Nanum Gothic", "NanumGothic", "NanumBarunGothic",
    "Nanum Myeongjo", "NanumMyeongjo", "NanumSquare", "Gulim", "Dotum", "Batang", "Gungsuh", "HCR Dotum", "HCR Batang", "D2Coding",
    "Arial", "Arial Black", "Calibri", "Cambria", "Candara", "Consolas", "Courier New", "Georgia", "Impact", "Lucida Console", "Palatino Linotype",
    "Segoe UI", "Tahoma", "Times New Roman", "Trebuchet MS", "Verdana", "Comic Sans MS", "Helvetica", "Helvetica Neue", "Menlo", "Monaco", "Roboto",
    "Yu Gothic", "Meiryo", "MS Gothic", "SimSun", "Microsoft YaHei"];
  const sel = document.getElementById("fontSel");
  const clean = n => String(n == null ? "" : n).replace(/["'\\;{}<>&\u0000-\u001f]/g, "").trim().slice(0, 80);
  let cur = DEF; try { cur = clean(localStorage.getItem(KEY)) || DEF; } catch (e) {}

  let lbl = null, popEl = null, btnEl = null, pv = null;   // 글꼴 버튼 표시 / 목록 / 미리보기 상태

  lbl = document.getElementById("fontLbl"); popEl = document.getElementById("fontPop"); btnEl = document.getElementById("fontBtn");

  const cx = document.createElement("canvas").getContext("2d"), PROBE = "mmmmmmmmlliWWW가나다라마바사漢字 0123", BASES = ["monospace", "serif", "sans-serif"];
  const bw = BASES.map(b => { cx.font = "64px " + b; return cx.measureText(PROBE).width; });
  const has = n => BASES.some((b, i) => { cx.font = "64px '" + n + "'," + b; return cx.measureText(PROBE).width !== bw[i]; });   // 설치돼 있으면 대체 글꼴과 폭이 달라져요

<script>

function renderFb(){ if (window.refreshSplit) window.refreshSplit();

function clearTimers() { clearTimeout(idleT); clearTimeout(maxT); idleT = maxT = null; }

/* ===== 암호화: 비밀번호 → PBKDF2(SHA-256, 250000회) → AES-GCM 256. DB 에는 암호문만 올라가고 비밀번호는 저장하지 않아요 ===== */
const pwKey = () => dbIdx === 0 ? "memo-pw" : "memo-pw-" + (dbIdx + 1);   // 비밀번호는 DB 마다 따로 이 PC(브라우저)에 기억해요: 처음 한 번만 묻고, 틀리면 다시 물어요 (DB1 은 예전 이름 그대로)
let pw = null, dbSalt = null;
try { pw = localStorage.getItem(pwKey()) || null; } catch (e) {}
const setPw = p => { pw = p; try { localStorage.setItem(pwKey(), p); } catch (e) {} };
const keyCache = new Map();
const b64e = u => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
function forgetPw() { pw = null; dbSalt = null; keyCache.clear(); try { localStorage.removeItem(pwKey()); } catch (e) {} }
async function getKey(saltB64) {
  let k = keyCache.get(saltB64);
  if (!k) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(saltB64), iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    keyCache.set(saltB64, k);
  }
  return k;
}
async function encryptMemo(text, at) {
  if (!dbSalt) dbSalt = b64e(crypto.getRandomValues(new Uint8Array(16)));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await getKey(dbSalt), new TextEncoder().encode(text));
  return { enc: 1, salt: dbSalt, iv: b64e(iv), ct: b64e(new Uint8Array(ct)), updatedAt: at };
}
async function decryptMemo(d) {   // 비밀번호가 틀리면 예외 (AES-GCM 인증 실패)
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(d.iv) }, await getKey(d.salt), b64d(d.ct));
  return new TextDecoder().decode(pt);
}
const isEnc = d => !!d && d.enc === 1 && typeof d.ct === "string" && typeof d.iv === "string" && typeof d.salt === "string";

/* 비밀번호 입력창 (입력 마스킹). mode: "enter" 입력 / "new" 새로 정하기 / "legacy" 암호화 안 된 DB 를 암호화로 전환. 취소하면 null */
function askPw(mode, msg) {
  return new Promise(resolve => {
    const $ = id => document.getElementById(id);
    const box = $("pwBox"), form = $("pwForm"), p1 = $("pw1"), p2 = $("pw2"), err = $("pwE"), isNew = mode !== "enter";
    $("pwT").textContent = isNew ? "새 비밀번호 설정" : "비밀번호 입력";
    $("pwD").textContent = mode === "legacy" ? "DB 의 메모가 암호화되어 있지 않아요. 비밀번호를 정하면 암호화해서 다시 저장해요. 분실하면 복구할 수 없어요."
      : isNew ? "이 비밀번호로 메모를 암호화해서 DB 에 저장해요. 분실하면 복구할 수 없어요 (6자 이상)." : "DB 의 메모를 열려면 비밀번호가 필요해요.";
    p1.value = p2.value = ""; p2.hidden = !isNew; err.textContent = msg || "";
    p1.autocomplete = isNew ? "new-password" : "current-password";
    box.hidden = false; setTimeout(() => p1.focus(), 0);
    const done = v => { box.hidden = true; form.onsubmit = $("pwCancel").onclick = box.onkeydown = null; p1.value = p2.value = ""; resolve(v); };
    form.onsubmit = e => {
      e.preventDefault();
      if (!p1.value) { err.textContent = "비밀번호를 입력해 주세요"; return; }
      if (isNew) {
        if (p1.value.length < 6) { err.textContent = "6자 이상으로 정해 주세요"; return; }
        if (p1.value !== p2.value) { err.textContent = "두 비밀번호가 달라요"; return; }
      }
      done(p1.value);
    };
    $("pwCancel").onclick = () => done(null);
    box.onkeydown = e => { if (e.key === "Escape") { e.preventDefault(); done(null); } };
  });
}
/* 암호화된 DB 열기: 맞는 비밀번호가 나올 때까지 반복, 취소하면 null */

  let msg = "";
  for (;;) {
    if (!pw) { const p = await askPw("enter", msg); if (p === null) return null; setPw(p); }
    try { const t = await decryptMemo(d); dbSalt = d.salt; return t; }
    catch (e) { forgetPw(); msg = "비밀번호가 맞지 않아요"; }
  }
}

function fetchT(u, o, ms) {   // 응답이 없으면 20초 뒤 포기하고 다시 시도

  return r.json(); // null 또는 {enc,salt,iv,ct,updatedAt} (구버전: {text,updatedAt})
}

async function save(unloading) {

  if (utf8Len(v) * 4 / 3 > MAX_BYTES) { say("메모가 너무 커서 DB에 저장할 수 없어요. 이미지·첨부 파일을 줄여 주세요", "err"); return; }   // 암호문(base64)은 약 1.33배
  saving = true; say("저장 중…");

    const enc = await encryptMemo(v, at);

    const body = JSON.stringify(enc);

    const r = await (unloading === true

    clearTimeout(idleT); idleT = setTimeout(save, 5000);
  } finally { saving = false; if (again && dirty) { again = false; schedule(); } else again = false; }
}

async function poll() {

  const g = gen;
  try {
    const r = await fetchT(URL_AT, { cache: "no-store" }, 10000);
    if (!r.ok || g !== gen) return;
    const at = await r.json();
    if (g !== gen) return;
    if (typeof at === "number" && at > knownAt) {
      say("다른 기기의 변경을 불러오는 중…");
      const d = await fetchRemote();

        let t;
        try { t = await decryptMemo(d); } catch (e) { if (g === gen) say("다른 기기의 변경을 복호화하지 못했어요", "err"); return; }

/* DB 와 처음 연결: 어느 쪽 메모를 쓸지 정하고 자동저장을 시작 */

function setFb(on) {

/* DB1/2/3 전환: 지금 DB 의 변경을 저장해 두고, 선택한 DB 의 주소·비밀번호·이 PC 사본으로 바꾼 뒤 다시 연결.

dbBtns.forEach((b, i) => b.addEventListener("click", () => switchDb(i)));

onEd("input", () => {

let cntDelay = 250;

/* ===== 서식 툴바 ===== */
const tb = document.getElementById("tb"), pop = document.getElementById("pop"), expBtn = document.getElementById("expBtn");

function placeTbar() {

  // 매번 현재 상태를 DOM에 다시 동기화해요. 버튼 글자만 바뀌고 행이 남는 상황을 막습니다.

/* ===== 목표 시각까지 남은 시간 타이머 ===== */
const TIMER_ON=true;                   /* [타이머] 버튼의 처음 상태 (true: 켜짐 / false: 꺼짐) */
const TIMER_DEFAULT="17:00";           /* 목표 시각 기본값 (시:분) */
const TKEY="memo-target";
let resetting=false;
(function(){
  const $=id=>document.getElementById(id);
  const tt=$("tt"),rem=$("rem");
  const box=$("tm"),wrap=$("tmw"),tbn=$("tmBtn");let on=TIMER_ON;
  function setOn(v,anim){
    on=v;tbn.setAttribute("aria-pressed",String(v));box.setAttribute("aria-hidden",String(!v));
    wrap.classList.toggle("off",!v);
    if(!anim){wrap.style.width=v?"auto":"0px";return}
    const w=box.offsetWidth+"px";
    if(v){wrap.style.width=w;
      const end=e=>{if(e.propertyName==="width"&&on){wrap.style.width="auto";wrap.removeEventListener("transitionend",end)}};
      wrap.addEventListener("transitionend",end)}
    else{wrap.style.width=w;void wrap.offsetWidth;wrap.style.width="0px"}
  }
  tbn.addEventListener("click",()=>setOn(!on,true));
  if(on){
    wrap.style.width="0px";on=false;
    requestAnimationFrame(()=>requestAnimationFrame(()=>setOn(true,true)));
  }else setOn(false,false);
  let target=TIMER_DEFAULT;
  try{const v=localStorage.getItem(TKEY);if(v)target=v}catch(e){}
  function parse(s){
    s=String(s).trim();let a;
    if(s.includes(":"))a=s.split(":");
    else if(/^\d{1,2}$/.test(s))a=[s];
    else if(/^\d{3,4}$/.test(s))a=[s.slice(0,-2),s.slice(-2)];
    else return null;
    if(a.length>3||a.some(x=>!/^\d{1,2}$/.test(x)))return null;
    const h=+a[0],m=+(a[1]||0);
    return h<24&&m<60?[h,m,0]:null;
  }
  const p2=n=>String(n).padStart(2,"0");
  const fmt=t=>p2(t[0])+":"+p2(t[1]);
  const store=t=>{if(resetting)return;try{localStorage.setItem(TKEY,fmt(t))}catch(e){}};
  let tg=parse(target)||parse(TIMER_DEFAULT);
  tt.value=fmt(tg);
  tt.addEventListener("input",()=>{const t=parse(tt.value);tt.style.outline=t||!tt.value?"":"2px solid var(--err)";if(t){tg=t;store(t)}});
  tt.addEventListener("blur",()=>{tt.style.outline="";tt.value=fmt(tg);store(tg)});
  function tick(){
    const now=new Date(),t=new Date(now);t.setHours(tg[0],tg[1],tg[2],0);
    if(t<=now)t.setDate(t.getDate()+1);
    const ms=t-now;
    const tot=Math.ceil(ms/1000),h=Math.floor(tot/3600),m=Math.floor(tot/60)%60,s=tot%60;
    const txt=p2(h)+":"+p2(m)+":"+p2(s);
    if(rem.textContent!==txt)rem.textContent=txt;
    requestAnimationFrame(tick);
  }
  tick();
})();

    h.addEventListener("pointerdown", e => { e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add("drag"); });

  }
  /* ----- 좌우 줄맞춤: 같은 줄(바뀐 줄 포함)이 스크롤할 때 좌우에서 같은 높이에 보이도록, 낮은 쪽에 빈 칸을 끼워 넣어요 -----
     - 빈 칸(.cmpgap)은 화면에만 있는 여백이에요. 메모 내용·저장·내보내기에는 들어가지 않고(rawHtml), 비교를 끝내거나 내용을 고치면 사라져요
     - 폭을 바꾸면(구분선 드래그·창 크기) 줄 바뀜이 달라지므로 자동으로 다시 맞춰요 */
  const BOX = /^(DIV|P|LI|TR|TD|TH|TBODY|THEAD|TFOOT|H[1-6]|BLOCKQUOTE|PRE|UL|OL|TABLE|HR)$/;
  let gaps = new Map(), lw1 = 0, lw2 = 0, alT = 0;   // gaps: 줄 → { box: 높이를 지정하는 요소, h: 현재 높이(px) }
  function clearGaps() { gaps = new Map(); for (const e of EDS) e.querySelectorAll(".cmpgap").forEach(g => g.remove()); }
  const firstTxt = L => L.nodes.find(n => /[^\s\u200b]/.test(n.nodeValue)) || L.nodes[0];
  function topOf(L) {   // 줄의 첫 글자가 화면에서 놓인 높이
    const n = firstTxt(L), r = document.createRange(); r.setStart(n, 0); r.setEnd(n, n.nodeValue.length);

  function makeGap(L, ed) {   // 줄 바로 앞에 빈 칸 요소를 끼워 넣음
    const f = L.nodes[0], host = f.parentElement, tr = host && host.closest("tr"), li = host && host.closest("li");
    const div = () => { const d = document.createElement("div"); d.className = "cmpgap"; d.contentEditable = "false"; return d; };
    if (tr && ed.contains(tr)) {
      const tb = tr.closest("table");
      if (tb && tb.rows[0] !== tr) {   // 표 안: 행 사이에 빈 행
        const row = document.createElement("tr"), td = document.createElement("td");
        row.className = "cmpgap"; row.contentEditable = "false"; td.colSpan = Math.max(1, tr.cells.length);
        row.appendChild(td); tr.parentNode.insertBefore(row, tr); return { box: td, h: 0 };
      }
      if (tb) { const d = div(); tb.parentNode.insertBefore(d, tb); return { box: d, h: 0 }; }   // 표의 첫 행: 표 위에
    }
    if (li && ed.contains(li) && atStart(li, f)) { const d = div(); li.parentNode.insertBefore(d, li); return { box: d, h: 0 }; }
    let n = f;   // 줄 맨 앞을 감싼 글자 서식(b, span 등)은 건너뛰어 그 앞에 넣음
    while (n.parentNode && n.parentNode !== ed && !n.previousSibling && n.parentNode.nodeType === 1 && !BOX.test(n.parentNode.nodeName)) n = n.parentNode;

      const ys = rows.map(([a, b]) => [topOf(A[a]), topOf(B[b])]);   // 먼저 전부 재고, 그 다음에 끼워 넣음
      let adA = 0, adB = 0, any = false;
      rows.forEach(([a, b], i) => {
        const d = (ys[i][1] + adB) - (ys[i][0] + adA);

        else if (d < -0.5) { grow(B[b], -d, ed2); adB -= d; any = true; }   // 아래(변경본)가 더 높이 있음 → 변경본 쪽에 빈 칸

  function ensurePanel() {
    if (panel) return;
    panel = mk("div", "cmp"); panel.id = "cmp"; panel.setAttribute("role", "dialog"); panel.setAttribute("aria-label", "비교 결과"); panel.hidden = true;
    const h = mk("div", "cmph"); h.appendChild(mk("b", "", "다 · 비교"));
    sumEl = mk("span", "cmps"); h.appendChild(sumEl);
    const x = mk("button", "", "✕"); x.type = "button"; x.title = "닫기 (Esc)"; x.setAttribute("aria-label", "닫기"); x.addEventListener("click", closeCmp); h.appendChild(x);
    listEl = mk("div", "cmpl"); panel.append(h, listEl);
    // 비교 결과는 화면 위에 뜨는 창이 아니라 오른쪽 3번째 영역(별도 스크롤바)으로 배치
    vsp1 = mkHandle("vsp1", "원본과 변경본 사이 폭 조절", 1); document.getElementById("spl").after(vsp1);
    vsp2 = mkHandle("vsp2", "변경본과 비교 결과 사이 폭 조절", 2);

  }
  function goTo(it, el) {
    if (!st) return;
    listEl.querySelectorAll(".ci.on").forEach(e => e.classList.remove("on")); el.classList.add("on");
    const ls = []; if (it.a >= 0) ls.push(st.A[it.a]); if (it.b >= 0) ls.push(st.B[it.b]);

    wrapEl.classList.remove("c1", "c2", "c3"); wrapEl.classList.add("cmpm"); layout(); document.getElementById("edsplit").scrollTop = 0;   // 왼쪽(원본) / 오른쪽(변경본) 으로 나란히, 스크롤바는 하나

    if (approx) listEl.appendChild(mk("div", "cmm", "※ 내용이 너무 많아 순서는 무시하고 '있다/없다'만 비교했어요."));

  });
})();

/* ===== 기본값으로 초기화: Firebase 사용 여부·타이머 시각·메모를 처음 상태로 ===== */

/* ===== 파일 첨부: 저장(첨부) / 읽기(다시 파일로 저장) =====
   - [파일] ▸ [PC에서 메모로 첨부]: 파일을 골라 메모 안에 넣어요 (엑셀·문서·압축 파일 등 아무 파일). 파일을 메모로 끌어놓거나 붙여넣어도 돼요.
   - 파일은 base64 로 메모 본문에 들어가므로 "DB n / 3,000,000자" 용량을 함께 써요 (파일 크기의 약 1.33배).
   - 칩을 클릭하거나 [파일] ▸ [메모에서 PC로 저장](전체) / [첨부된 파일 목록](하나씩)에서 고르면 원래 파일로 저장돼요. */
let attBack = null;
const attFile = document.getElementById("attFile"), attPop = document.getElementById("attPop"), attMv = document.getElementById("attMv"), attLv = document.getElementById("attLv"), attGo = document.getElementById("attListGo");
const attFmt = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const attNodes = () => EDS.flatMap(e => Array.from(e.querySelectorAll(".att")));
function pickAttach() {
  if (ta.disabled) return;
  attBack = saveRange(); attFile.value = ""; attFile.click();
}

  const fs = Array.from(attFile.files || []); if (!fs.length) return;
  if (attBack) attBack();
  say("파일을 넣는 중…"); await ta.insertFiles(fs);
});
function attDownload(c) {
  try {
    const bin = atob(c.getAttribute("data-b64")), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const name = c.getAttribute("data-name") || "file";
    const url = URL.createObjectURL(new Blob([u], { type: c.getAttribute("data-mime") || "application/octet-stream" }));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    say("파일로 저장했어요: " + name, "ok");
  } catch (e) { say("첨부 파일을 읽지 못했어요", "err"); }
}
onEd("click", e => {   // 칩 클릭 → 파일로 저장
  const c = e.target.closest && e.target.closest(".att");
  if (!c || !ta.contains(c)) return;
  e.preventDefault(); attDownload(c);
});
function attSaveAll() {   // [메모에서 PC로 저장]: 메모에 첨부된 파일을 모두 파일로 저장 (여러 개면 차례로)
  const L = attNodes();
  if (!L.length) { toast("저장할 첨부 파일이 없어요"); return; }
  if (L.length > 1) say("첨부 파일 " + L.length + "개를 저장하는 중…");

}
function showAttMenu() { attMv.hidden = false; attLv.hidden = true; }
function fillAttPop() {   // [첨부된 파일 목록]: 같은 팝업 안에서 목록 화면으로 바꿈
  const L = attNodes(); attLv.textContent = "";
  attMv.hidden = true; attLv.hidden = false;
  const back = document.createElement("button"); back.type = "button"; back.dataset.attBack = "1"; back.textContent = "← 뒤로";
  attLv.appendChild(back);
  if (!L.length) {
    const b = document.createElement("button"); b.type = "button"; b.disabled = true; b.textContent = "첨부된 파일이 없어요";
    attLv.appendChild(b); return;
  }
  L.forEach((c, i) => {
    const row = document.createElement("div"); row.className = "row";
    const d = document.createElement("button"); d.type = "button"; d.className = "nm"; d.dataset.attDl = i;
    d.textContent = "⬇ " + c.dataset.name + " (" + attFmt(+c.dataset.size || 0) + ")"; d.title = "클릭하면 파일로 저장돼요";
    const x = document.createElement("button"); x.type = "button"; x.className = "rm"; x.dataset.attDel = i;
    x.textContent = "🗑"; x.title = "메모에서 이 첨부 삭제";
    row.append(d, x); attLv.appendChild(row);
  });
}
tb.addEventListener("click", e => { if (e.target.closest("#attListBtn")) showAttMenu(); }, true);   // 열 때마다 처음 화면(3개 메뉴)부터
attPop.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const L = attNodes();
  if (b.id === "attListGo") { fillAttPop(); return; }
  if ("attBack" in b.dataset) { showAttMenu(); return; }
  if ("attDl" in b.dataset) { const c = L[+b.dataset.attDl]; closePop(); if (c) attDownload(c); }
  else if ("attDel" in b.dataset) {
    const c = L[+b.dataset.attDel]; closePop();
    if (c && confirm("'" + c.dataset.name + "' 첨부를 메모에서 삭제할까요?")) { c.remove(); fire(); say("첨부를 삭제했어요", "ok"); }
  }
});
function updateAttN() { const n = attNodes().length; attGo.textContent = n ? "첨부된 파일 목록 (" + n + ")" : "첨부된 파일 목록"; }
observeEds(updateAttN, { childList: true, subtree: true });
updateAttN();

<script>
/* ===== 글자 크기 / 정렬 목록 미리보기: 글꼴 목록과 같은 방식 =====
   목록 항목 위에 마우스를 올리면 선택한 글자(정렬은 커서가 있는 줄 포함)에 임시로 적용해 보여주고,

(function () {

    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  const blockSize = el => { let n = el; while (n && n !== ta && /^inline/.test(getComputedStyle(n).display)) n = n.parentElement; return getComputedStyle(n || ta).fontSize; };

  /* --- 글자 크기 --- */
  function sizeStart(v) {
    if (ta.disabled) return false;
    const s = getSelection(); if (!s.rangeCount || s.isCollapsed) return false;
    const r = s.getRangeAt(0); if (!ta.contains(r.commonAncestorContainer)) return false;
    const a = offOf(ta, r.startContainer, r.startOffset), b = offOf(ta, r.endContainer, r.endOffset), recs = []; let acc = 0;
    for (const n0 of textNodes(ta)) {
      const L = n0.length, st = Math.max(a, acc) - acc, en = Math.min(b, acc + L) - acc; acc += L;
      if (en <= st || !/\S/.test(n0.data.slice(st, en))) continue;
      if (n0.parentElement && n0.parentElement.closest('.att,[contenteditable="false"]')) continue;
      let mid = n0, tail = null;
      if (en < L) tail = n0.splitText(en);
      if (st > 0) mid = n0.splitText(st);
      const sp = document.createElement("span"); sp.setAttribute("data-fpv", "1");
      mid.parentNode.insertBefore(sp, mid); sp.appendChild(mid);
      recs.push({ sp, head: n0, mid, tail, base: blockSize(sp.parentElement) });
    }
    if (!recs.length) return false;
    pv = { k: "size", a, b, recs }; setSel(ta, a, b);
    return true;
  }
  const sizeSet = v => pv.recs.forEach(r => { r.sp.style.fontSize = v ? v + "px" : r.base; });
  function undoWrap(r) {
    const sp = r.sp, p = sp.parentNode; if (!p) return;
    if (r.mid === r.head) p.insertBefore(r.head, sp); else r.head.appendData(r.mid.data);
    sp.remove();
    if (r.tail) { r.head.appendData(r.tail.data); r.tail.remove(); }
  }

  /* --- 정렬 --- */
  function alignStart(kind) {
    if (ta.disabled) return false;
    const s = getSelection(); if (!s.rangeCount || !ta.contains(s.anchorNode)) return false;
    const els = leafBlocks();
    if (els.length) { pv = { k: "align", saved: els.map(e => [e, e.getAttribute("style")]) }; return true; }
    /* 블록 없이 그냥 글자인 줄: 그 줄(앞뒤 줄바꿈·블록 사이)을 임시 div 로 감싸서 보여줌 */
    const isBlk = n => n.nodeType === 1 && /^(DIV|P|H[1-6]|BLOCKQUOTE|LI|PRE|UL|OL|TABLE|HR)$/.test(n.nodeName);
    let top = s.anchorNode; while (top && top.parentNode !== ta) top = top.parentNode;
    if (!top || isBlk(top) || !textNodes(ta).length) return false;
    const r = s.getRangeAt(0), a = offOf(ta, r.startContainer, r.startOffset), b = offOf(ta, r.endContainer, r.endOffset);
    let first = top, last = top;
    while (first.previousSibling && !isBlk(first.previousSibling) && first.previousSibling.nodeName !== "BR") first = first.previousSibling;
    while (last.nextSibling && !isBlk(last.nextSibling) && last.nodeName !== "BR") last = last.nextSibling;
    if (last.nextSibling && !isBlk(last.nextSibling) && last.nodeName === "BR") { /* 줄 끝의 BR 까지 포함 */ }
    const nodes = []; for (let n = first; n; n = n.nextSibling) { nodes.push(n); if (n === last) break; }
    const div = document.createElement("div"); div.setAttribute("data-fpv", "1");
    ta.insertBefore(div, first); nodes.forEach(n => div.appendChild(n));
    pv = { k: "align", wrap: { div, nodes }, a, b }; setSel(ta, a, b);
    return true;
  }
  const alignSet = al => { if (pv.wrap) pv.wrap.div.style.textAlign = al; else pv.saved.forEach(x => { x[0].style.textAlign = al; }); };

  function pvApply(item) {
    if (item.k === "size" && (!pv || pv.k === "img")) {   // 이미지 '글자 넣기' 중이면 선택한 글자 요소를 미리보기
      const ev = new CustomEvent("memosizepreview", { detail: { v: +item.v, handled: false } });
      document.dispatchEvent(ev);
      if (ev.detail.handled) { pv = { k: "img" }; return; }
      if (pv) return;
    }
    if (!pv && !(item.k === "size" ? sizeStart(item.v) : alignStart(item.v))) return;
    if (pv.k === "size") sizeSet(item.v); else alignSet(item.v);
  }
  function pvEnd() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    want = null;
    const p = pv; if (!p) return; pv = null;
    if (p.k === "img") { document.dispatchEvent(new CustomEvent("memosizepreview", { detail: { v: null } })); return; }
    if (p.k === "size") { for (let i = p.recs.length - 1; i >= 0; i--) undoWrap(p.recs[i]); setSel(ta, p.a, p.b); }
    else if (p.wrap) { const d = p.wrap.div; p.wrap.nodes.forEach(n => d.parentNode && d.parentNode.insertBefore(n, d)); d.remove(); setSel(ta, p.a, p.b); }
    else p.saved.forEach(x => { if (x[1] === null) x[0].removeAttribute("style"); else x[0].setAttribute("style", x[1]); });
  }
  const AL = { alL: "left", alC: "center", alR: "right" };
  function wire(pop, kind) {
    pop.addEventListener("mouseover", e => {
      const b = e.target.closest && e.target.closest("button"); if (!b) return;
      let v;
      if (kind === "size") { if (!b.hasAttribute("data-fs")) return; v = b.getAttribute("data-fs"); }
      else { v = AL[b.dataset.cmd]; if (!v) return; }
      want = { k: kind, v };
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (want) pvApply(want); });
    });
    pop.addEventListener("mouseleave", pvEnd);
    pop.addEventListener("click", pvEnd);   // 확정: 미리보기를 먼저 걷어내면 뒤따르는 기존 적용이 원래 상태 기준으로 동작
    new MutationObserver(() => { if (pop.hidden) pvEnd(); }).observe(pop, { attributes: true, attributeFilter: ["hidden"] });
  }
  if (sizePop) wire(sizePop, "size"); wire(alPop, "align");
})();
</script>
<script>
/* 글자 크기 목록: 글꼴 목록처럼 버튼 아래로 열려요 (이미지 편집 중에도 가려지지 않게 최상단 레이어) */
(function () {
  const btn = document.getElementById("szIc"), pop = document.getElementById("szPop"), num = document.getElementById("szNum");
  if (!btn || !pop) return;
  pop.addEventListener("mousedown", e => e.preventDefault());   // 목록을 눌러도 메모의 선택·커서 유지
  const canPop = typeof pop.showPopover === "function";
  if (canPop) pop.setAttribute("popover", "manual");
  const place = () => {
    const r = btn.getBoundingClientRect(), st = pop.style;
    st.position = "fixed"; st.right = "auto"; st.bottom = "auto"; st.margin = "0";
    st.maxHeight = Math.max(120, Math.min(420, innerHeight * 0.6, innerHeight - r.bottom - 16)) + "px";
    st.top = (r.bottom + 4) + "px";
    st.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + "px";
  };
  const isOpen = () => { try { return pop.matches(":popover-open"); } catch (e) { return false; } };
  new MutationObserver(() => {
    if (pop.hidden) { if (canPop && isOpen()) { try { pop.hidePopover(); } catch (e) {} } }
    else { if (canPop && !isOpen()) { try { pop.showPopover(); } catch (e) {} } place(); }
  }).observe(pop, { attributes: true, attributeFilter: ["hidden"] });
  window.addEventListener("resize", () => { if (!pop.hidden) place(); });
  btn.addEventListener("click", () => setTimeout(() => {   // 열 때 현재 크기를 표시
    if (pop.hidden) return;
    pop.querySelectorAll("button[data-fs]").forEach(b => { if (b.dataset.fs === String(Math.round(parseFloat(num.value)))) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); });
  }, 0));
})();
</script>
