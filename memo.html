<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모장</title>
<style>
:root{--bg:#f3f1ec;--ink:#1c1b19;--mute:#76726a;--line:#d9d5cb;--card:#fffefb;--ok:#2e7d32;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--ink:#ecebe6;--mute:#8d8a82;--line:#34322f;--card:#1e1d21;--ok:#81c784;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;padding:12px;gap:8px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px}
.fbbtn{flex:none;font:inherit;font-size:13px;font-weight:600;padding:2px 12px;border-radius:999px;background:transparent;color:var(--ink);border:1.5px solid var(--line);cursor:pointer}
.fbbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
#st{font-size:12px;color:var(--mute)}
#st.ok{color:var(--ok)}
#st.err{color:var(--err)}
/* .slot 이 자리를 지키고 .pane(확대 대상)이 그 안을 채움 → 확대해도 원래 레이아웃은 그대로 */
.slot{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px}
.rich{display:block;overflow:auto;word-break:break-word;outline:none}
.rich:empty::before{content:attr(data-ph);color:var(--mute);pointer-events:none}
.rich img{display:block;max-width:100%;height:auto;margin:4px 0}
.rich table{border-collapse:collapse;margin:4px 0}
.rich td,.rich th{border:1px solid var(--line);padding:2px 6px;vertical-align:top;min-width:2em}
.rich a{color:inherit}
.rich h1{font-size:1.6em;line-height:1.3;margin:.5em 0 .25em;letter-spacing:-.01em}
.rich h2{font-size:1.3em;line-height:1.3;margin:.5em 0 .25em}
.rich h3{font-size:1.1em;line-height:1.3;margin:.5em 0 .25em}
.rich ul,.rich ol{margin:.3em 0;padding-left:1.6em}
.rich hr{border:0;border-top:1.5px solid var(--line);margin:.8em 0}
.rich blockquote{margin:.5em 0;padding:.1em 0 .1em 12px;border-left:3px solid var(--line);color:var(--mute)}
.rich pre{margin:.4em 0;padding:8px 10px;border-radius:7px;background:var(--line);font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:.92em;white-space:pre-wrap}
/* 찾기 */
.fbar{flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.fbar[hidden]{display:none}
.fbar input{flex:1;min-width:0;font:inherit;font-size:14px;padding:4px 8px;border:1.5px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.fbar button{font:inherit;font-size:14px;min-width:32px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer}
.fbar button:hover{background:var(--line)}
.fbar span{font-size:12px;color:var(--mute);min-width:3.5em;text-align:center}
::highlight(find){background:#ffe066;color:#1c1b19}
::highlight(findcur){background:#ff922b;color:#1c1b19}
.rich{flex:1;min-height:0;width:100%;font:inherit;font-size:16px;line-height:1.6;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
/* 서식 툴바 */
.tb{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.tb button{font:inherit;font-size:14px;min-width:32px;height:32px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer}
.tb button:hover{background:var(--line)}
.tb button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tb button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.tb .menu{position:relative}
.tb .menu.dim>button{opacity:.45}
.tbar{position:fixed;z-index:30;display:flex;flex-wrap:wrap;gap:2px;max-width:calc(100vw - 16px);padding:3px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tbar[hidden]{display:none}
.tbar button{font:inherit;font-size:12.5px;height:28px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.tbar button:hover{background:var(--line)}
.tbar button.del{color:var(--err)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);max-width:88vw;padding:9px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:60;pointer-events:none}
.toast[hidden]{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,49,49,.0)}50%{box-shadow:0 0 0 4px rgba(224,49,49,.55)}}
.tb .menu.pulse>button{animation:pulse .9s ease-in-out 3}
.tb .pop{position:absolute;top:calc(100% + 4px);left:0;z-index:10;display:flex;flex-direction:column;min-width:150px;padding:4px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.tb .pop[hidden]{display:none}
.tb .pop.r{left:auto;right:0}
.tb .pop button{justify-content:flex-start;padding:0 10px;white-space:nowrap}
.tb .pop.pal:not([hidden]){display:grid;grid-template-columns:repeat(4,32px);gap:4px;min-width:0}
.tb .pop.pal button{min-width:0;width:32px;padding:0;justify-content:center}
.tb .pop.pal button.sw{border:1.5px solid var(--line)}
.tb .pop.pal button.rs{grid-column:1/-1;width:auto;font-size:13px;padding:0 8px}
.tb .pop.pal.wide:not([hidden]){grid-template-columns:repeat(12,20px);gap:3px}
.tb .pop.pal.wide button.sw{width:20px;height:20px;border-radius:4px}
.tb .pop.pal.wide button.rs{height:30px}
/* 확대/축소 버튼 (툴바 맨 오른쪽) */
.tb .expand{margin-left:auto;font-size:15px;line-height:1;opacity:.7}
.tb .expand:hover,.tb .expand:focus-visible{opacity:1}
/* 확대: 화면 전체를 메모가 차지 (CSS 만 바꾸므로 입력 중인 내용/커서/저장 상태는 그대로) */
.pane.max{position:fixed;inset:0;z-index:100;background:var(--bg);padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
/* 확대 중에는 제목을 숨기고 저장 상태만 우하단에 작게 표시 */
body.has-max header{position:fixed;right:20px;bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:101;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;opacity:.92}
body.has-max header h1{display:none}
.rich:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rich[contenteditable=false]{opacity:.6}
</style>
</head>

<div id="memo" class="rich" contenteditable="true" role="textbox" aria-multiline="true" data-ph="메모해 보세요. 자동으로 저장돼요. (엑셀 셀 범위·캡처 이미지도 붙여넣을 수 있어요)" aria-label="메모"></div>

<script>
/* ===== 리치 메모: 엑셀 표 / 캡처 이미지 붙여넣기 지원 =====
   <div contenteditable> 를 textarea 처럼 .value / .disabled 로 쓸 수 있게 만들어요.
   저장 값은 "<!--h-->" + 정리(sanitize)된 HTML 이고, 예전 순수 글자 메모도 그대로 불러와요. */
const RICH_PREFIX = "<!--h-->";
function makeRich(el) {
  const TAGS = new Set("A B STRONG I EM U S STRIKE SUB SUP BR P DIV SPAN UL OL LI H1 H2 H3 H4 H5 H6 TABLE THEAD TBODY TFOOT TR TD TH CAPTION IMG PRE CODE BLOCKQUOTE HR".split(" "));
  const DROP = new Set("SCRIPT STYLE META LINK TITLE HEAD XML O:P NOSCRIPT IFRAME OBJECT EMBED FORM INPUT BUTTON SELECT TEXTAREA SVG MATH AUDIO VIDEO CANVAS".split(" "));
  const PROPS = new Set("font-weight font-style font-size margin-left text-decoration color background-color text-align vertical-align border border-top border-right border-bottom border-left".split(" "));
  const IMG = /^data:image\/(png|jpe?g|gif|webp|bmp);base64,[A-Za-z0-9+\/=]+$/i;
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* 허용된 스타일만 남김 (url(), expression 등은 차단) */
  function cleanStyle(s) {
    const out = [];
    for (const d of (s || "").split(";")) {
      const i = d.indexOf(":"); if (i < 0) continue;
      const p = d.slice(0, i).trim().toLowerCase(), v = d.slice(i + 1).trim();
      if (PROPS.has(p) && v.length < 80 && /^[#\w\s.,()%-]+$/.test(v) && !/url|expression|var\(/i.test(v)) out.push(p + ":" + v);
    }
    return out.join(";");
  }
  function walk(src, dst) {
    for (const n of Array.from(src.childNodes)) {
      if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue.replace(/\u200b/g, ""))); continue; }
      if (n.nodeType !== 1) continue;
      const t = n.nodeName.toUpperCase();
      if (DROP.has(t)) continue;
      if (!TAGS.has(t)) { walk(n, dst); continue; }
      if (t === "IMG") {
        const s = n.getAttribute("src") || ""; if (!IMG.test(s)) continue;
        const im = document.createElement("img"); im.src = s;
        const a = n.getAttribute("alt"); if (a) im.alt = a.slice(0, 200);
        dst.appendChild(im); continue;
      }
      const e = document.createElement(t.toLowerCase());
      const st = cleanStyle(n.getAttribute("style")); if (st) e.setAttribute("style", st);
      if (t === "A") {
        const h = n.getAttribute("href") || "";
        if (/^(https?:|mailto:)/i.test(h)) { e.setAttribute("href", h); e.setAttribute("target", "_blank"); e.setAttribute("rel", "noopener noreferrer"); }
      }
      if (t === "TD" || t === "TH") for (const k of ["colspan", "rowspan"]) { const v = parseInt(n.getAttribute(k), 10); if (v > 1 && v < 100) e.setAttribute(k, v); }
      walk(n, e); dst.appendChild(e);
    }
  }
  function clean(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const box = document.createElement("div"); walk(doc.body, box); return box.innerHTML;
  }

  /* .value / .disabled 호환 (textarea 처럼 사용)
     ※ 빈 목록/제목(글자가 없어도 서식을 막 켠 상태)이 "빈 메모"로 오해돼 지워지지 않도록 ul,ol,h1~h3 도 내용으로 취급 */
  Object.defineProperty(el, "value", {
    get() { return (!el.querySelector("img,table,ul,ol,h1,h2,h3,hr,pre,blockquote") && !el.textContent.replace(/\u200b/g, "").trim()) ? "" : RICH_PREFIX + el.innerHTML; },
    set(v) { v = String(v || ""); el.innerHTML = v.startsWith(RICH_PREFIX) ? clean(v.slice(RICH_PREFIX.length)) : esc(v).replace(/\r?\n/g, "<br>"); }
  });
  Object.defineProperty(el, "disabled", {
    get() { return el.contentEditable !== "true"; },
    set(b) { el.contentEditable = b ? "false" : "true"; }
  });
  /* 내보내기용: 저장할 때와 같은 기준으로 정리한 HTML */
  el.cleanHtml = () => clean(el.innerHTML);
  /* 불러오기용: 외부 HTML 을 저장할 때와 같은 기준으로 정리 */
  el.sanitize = clean;
  /* 글자를 다 지우면 남는 찌꺼기(<br> 하나 등)만 비워서 안내 문구(placeholder)가 다시 보이게 함
     ※ 예전에는 글자가 없으면 무조건 비워서, 빈 메모에서 Enter 로 만든 빈 줄도 바로 지워졌어요 */
  el.addEventListener("input", () => {
    if (el.value === "" && /^(<br>|<div><br><\/div>|<p><br><\/p>)?$/i.test(el.innerHTML.trim())) el.innerHTML = "";
  });

  /* 이미지 → 가로 1600px 이하로 줄여서 data URL 로 (저장 용량 절약) */
  function loadImg(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = r.result; };
      r.onerror = rej; r.readAsDataURL(file);
    });
  }
  async function imgToUrl(file) {
    const im = await loadImg(file);
    let s = Math.min(1, 1600 / im.naturalWidth);
    for (let k = 0; k < 4; k++) {
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.naturalWidth * s)); c.height = Math.max(1, Math.round(im.naturalHeight * s));
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      let u = c.toDataURL("image/png");
      if (u.length > 300000) u = c.toDataURL("image/jpeg", 0.85);
      if (u.length <= 800000 || k === 3) return u;
      s *= 0.7;
    }
  }

  /* 엑셀 등의 HTML: 보이지 않는 iframe 에서 계산된 스타일(굵게/글자색/배경색/테두리/정렬)을 인라인으로 옮김 */
  function fromHtml(html) {
    return new Promise(res => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll("script,iframe,object,embed,link,meta").forEach(n => n.remove());
      doc.querySelectorAll("img").forEach(i => { if (!IMG.test(i.getAttribute("src") || "")) i.remove(); });
      doc.querySelectorAll("style").forEach(s => { s.textContent = s.textContent.replace(/@import[^;]*;?/gi, "").replace(/url\([^)]*\)/gi, "none"); });
      const f = document.createElement("iframe");
      f.setAttribute("sandbox", "allow-same-origin");
      f.style.cssText = "position:fixed;left:-99999px;top:0;width:1200px;height:800px;border:0;visibility:hidden";
      let fin = false;
      const done = h => { if (fin) return; fin = true; f.remove(); res(h); };
      f.onload = () => {
        try {
          const w = f.contentWindow, d = f.contentDocument, els = d.body.querySelectorAll("*");
          if (els.length > 20000) throw 0;
          els.forEach(n => {
            const cs = w.getComputedStyle(n), pcs = n.parentElement ? w.getComputedStyle(n.parentElement) : cs, o = [];
            const tag = n.nodeName.toUpperCase(), cell = tag === "TD" || tag === "TH";
            if (parseInt(cs.fontWeight, 10) >= 600 && parseInt(pcs.fontWeight, 10) < 600) o.push("font-weight:700");
            if (cs.fontStyle === "italic" && pcs.fontStyle !== "italic") o.push("font-style:italic");
            const dl = cs.textDecorationLine || "";
            if (dl.includes("underline") || dl.includes("line-through")) o.push("text-decoration:" + (dl.includes("underline") ? "underline" : "line-through"));
            /* 글자 크기: 부모와 다를 때만 px 로 옮김 (제목/위·아래첨자는 메모 자체 서식을 따르도록 제외) */
            if (cs.fontSize !== pcs.fontSize && !/^(H[1-6]|SUB|SUP)$/.test(tag)) {
              const fs = Math.round(parseFloat(cs.fontSize));
              if (fs >= 8 && fs <= 96) o.push("font-size:" + fs + "px");
            }
            const bg = cs.backgroundColor, hasBg = bg && bg !== "transparent" && bg !== "rgba(0, 0, 0, 0)";
            if (hasBg) o.push("background-color:" + bg);
            if (hasBg || cs.color !== pcs.color) o.push("color:" + cs.color);   /* 다크 모드에서도 읽히도록 배경이 있으면 글자색을 고정 */
            if (/^(left|right|center|justify)$/.test(cs.textAlign) && cs.textAlign !== pcs.textAlign) o.push("text-align:" + cs.textAlign);
            if (cell && /^(top|middle|bottom)$/.test(cs.verticalAlign)) o.push("vertical-align:" + cs.verticalAlign);
            if (cell || tag === "TABLE") for (const sd of ["top", "right", "bottom", "left"]) {
              const bw = parseFloat(cs.getPropertyValue("border-" + sd + "-width")), bs = cs.getPropertyValue("border-" + sd + "-style");
              if (bw > 0 && bs !== "none" && bs !== "hidden") o.push("border-" + sd + ":" + Math.max(1, Math.round(bw)) + "px " + bs + " " + cs.getPropertyValue("border-" + sd + "-color"));
            }
            n.setAttribute("style", o.join(";"));
          });
          const box = document.createElement("div"); walk(d.body, box); done(box.innerHTML);
        } catch (e) { done(""); }
      };
      f.srcdoc = doc.documentElement.outerHTML;
      document.body.appendChild(f);
      setTimeout(() => done(""), 5000);
    });
  }

  function insert(html) {
    if (!html) return;
    el.focus();
    if (!document.execCommand("insertHTML", false, html)) { el.insertAdjacentHTML("beforeend", html); el.dispatchEvent(new Event("input", { bubbles: true })); }
  }
  async function build(html, imgs, txt) {
    let h = "";
    if (/<table[\s>]/i.test(html) || (!imgs.length && html)) h = await fromHtml(html);
    else for (const f of imgs) { try { h += '<img src="' + await imgToUrl(f) + '"><br>'; } catch (e) {} }
    if (!h && txt) h = esc(txt).replace(/\r?\n/g, "<br>");
    return clean(h);
  }
  function keepCaret() {
    const s = getSelection(), r = s.rangeCount ? s.getRangeAt(0).cloneRange() : null;
    return () => { el.focus(); if (r && el.contains(r.commonAncestorContainer)) { s.removeAllRanges(); s.addRange(r); } };
  }
  el.insertImages = async files => {
    let h = "";
    for (const f of files) { try { h += '<img src="' + await imgToUrl(f) + '"><br>'; } catch (e) {} }
    insert(clean(h));
  };
  el.addEventListener("paste", e => {
    const cd = e.clipboardData; if (!cd) return;
    const html = cd.getData("text/html"), txt = cd.getData("text/plain");
    const imgs = Array.from(cd.files || []).filter(f => /^image\//.test(f.type));
    if (!html && !imgs.length) return;            /* 글자만 있으면 기본 붙여넣기 */
    e.preventDefault();
    const back = keepCaret();
    build(html, imgs, txt).then(h => { back(); insert(h); });
  });
  el.addEventListener("dragover", e => { if (e.dataTransfer && Array.from(e.dataTransfer.types).includes("Files")) e.preventDefault(); });
  el.addEventListener("drop", e => {
    const imgs = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter(f => /^image\//.test(f.type));
    if (!imgs.length) return;
    e.preventDefault();
    build("", imgs, "").then(h => insert(h));
  });
}

/* ▼▼ DB 를 쓰려면 본인 Firebase Realtime Database 주소로 바꾸세요 (끝에 / 없이) ▼▼ */
const DB_URL = "https://parksoodong-memo-default-rtdb.asia-southeast1.firebasedatabase.app";
/* ▲▲ 예: https://my-memo-12345-default-rtdb.asia-southeast1.firebasedatabase.app ▲▲ */

const MAX_CHARS = 3000000;   // 메모 최대 글자 수 (Firebase 규칙의 숫자와 같아야 해요)
const POLL_MS = 3000;        // 다른 기기의 변경을 확인하는 간격
const IDLE_MS = 3000;        // 입력을 멈춘 뒤 DB 저장까지 기다리는 시간
const MAX_WAIT_MS = 30000;   // 계속 입력해도 이 시간이 지나면 한 번 저장
const KEY = "memo-state";    // 이 PC(브라우저)에 저장되는 이름

const ta = document.getElementById("memo"), st = document.getElementById("st"), fbBtn = document.getElementById("fbBtn");
makeRich(ta);   // 메모 칸을 표/이미지 붙여넣기가 되는 편집 영역으로
const say = (t, c) => { st.textContent = t; st.className = c || ""; };
const hhmm = () => new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
const BASE = DB_URL.replace(/\/+$/, "");
const URL_MEMO = BASE + "/memo.json";
const URL_AT = BASE + "/memo/updatedAt.json";   // 수정 시각 숫자만 (아주 작음)
const dbSet = !DB_URL.includes("YOUR-PROJECT");
let toastT = null;
function toast(msg) {   // 저장 상태줄과 별개로 잠깐 떠 있다 사라지는 안내
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4000);
}
const localNote = () => say("수정 내용은 이 PC의 지금 브라우저에만 저장됩니다.");

/* 저장된 상태 복원: 사용/미사용 선택(처음엔 항상 미사용), 이 PC의 메모 사본 */
let saved = null; try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
let useFb = !!(saved && saved.fb === true);
let dirty = !!(saved && useFb && saved.d), knownAt = (saved && useFb && +saved.at) || 0;
let ready = false, saving = false, connecting = false, firstTry = false, idleT = null, maxT = null, localT = null;
if (saved && typeof saved.memo === "string") ta.value = saved.memo;

function saveLocal() {
  clearTimeout(localT); localT = null;
  try { localStorage.setItem(KEY, JSON.stringify({ fb: useFb, memo: ta.value, at: knownAt, d: dirty })); return true; }
  catch (e) { if (!useFb) say("브라우저 저장 공간이 가득 차서 저장하지 못했어요. 이미지를 줄여 주세요", "err"); return false; }
}
function renderFb() {
  fbBtn.textContent = "Firebase Realtime Database " + (useFb ? "사용" : "미사용");
  fbBtn.setAttribute("aria-pressed", String(useFb));
}
function clearTimers() { clearTimeout(idleT); clearTimeout(maxT); idleT = maxT = null; }
function schedule() {
  clearTimeout(idleT); idleT = setTimeout(save, IDLE_MS);
  if (!maxT) maxT = setTimeout(save, MAX_WAIT_MS);
}

async function fetchRemote() {
  const r = await fetch(URL_MEMO, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json(); // null 또는 {text, updatedAt}
}

async function save(unloading) {
  clearTimers();
  if (!useFb || !ready || !dirty) return;
  if (saving) { schedule(); return; }
  const v = ta.value;

    else { const ri = rows.indexOf(tr), nb = rows[ri + 1] || rows[ri - 1]; focus = nb.cells[Math.min(ci, nb.cells.length - 1)]; tr.remove(); }
  } else if (op === "delCol") {
    if (tr.cells.length <= 1) tab.remove();
    else { rows.forEach(r => { if (r.cells[ci]) r.cells[ci].remove(); }); focus = tr.cells[Math.min(ci, tr.cells.length - 1)]; }
  } else if (op === "delTable") tab.remove();
  if (focus) { const r = document.createRange(); r.selectNodeContents(focus); r.collapse(true); s.removeAllRanges(); s.addRange(r); }
  fire(); refreshTb();
}
const imgFile = document.getElementById("imgFile"), tblWrap = document.getElementById("tblWrap");
let imgBack = null;
function pickImage() {
  if (ta.disabled) return;
  imgBack = saveRange(); imgFile.value = ""; imgFile.click();
}
imgFile.addEventListener("change", async () => {
  const fs = Array.from(imgFile.files || []).filter(f => /^image\//.test(f.type)); if (!fs.length) return;
  if (imgBack) imgBack();
  say("이미지를 넣는 중…"); await ta.insertImages(fs); say("이미지를 넣었어요", "ok");
});

/* 찾기: 메모 내용을 바꾸지 않고 CSS 하이라이트로 표시 (지원하지 않는 브라우저는 선택으로 표시) */
const fbar = document.getElementById("fbar"), fq = document.getElementById("fq"), fcnt = document.getElementById("fcnt");
const HL = !!(window.CSS && CSS.highlights && typeof Highlight !== "undefined");
let fm = [], fi = -1, findT = null;
function findAll() {
  fm = []; const q = fq.value.toLowerCase(); if (!q) return;
  const w = document.createTreeWalker(ta, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) {
    const t = n.nodeValue.toLowerCase();
    for (let i = t.indexOf(q); i >= 0; i = t.indexOf(q, i + q.length)) {
      const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + q.length); fm.push(r);
    }
  }
}
function paintFind() {
  if (HL) {
    CSS.highlights.delete("find"); CSS.highlights.delete("findcur");
    if (fm.length) {
      CSS.highlights.set("find", new Highlight(...fm));
      if (fi >= 0) { const c = new Highlight(fm[fi]); c.priority = 1; CSS.highlights.set("findcur", c); }
    }
  }
  fcnt.textContent = fq.value ? (fm.length ? (fi + 1) + "/" + fm.length : "0건") : "";
}
function goFind(d) {
  if (!fm.length) return;
  fi = (fi + d + fm.length) % fm.length; paintFind();
  const r = fm[fi];
  if (!HL) { const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  const e = elOf(r.startContainer); if (e) e.scrollIntoView({ block: "center" });
}
function runFind() { findAll(); fi = -1; paintFind(); goFind(1); }
function openFind() { fbar.hidden = false; fq.focus(); fq.select(); if (fq.value) runFind(); }
function closeFind() { fbar.hidden = true; fm = []; fi = -1; if (HL) { CSS.highlights.delete("find"); CSS.highlights.delete("findcur"); } ta.focus(); }
fq.addEventListener("input", runFind);
fq.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); goFind(e.shiftKey ? -1 : 1); } });
document.getElementById("fprev").addEventListener("click", () => goFind(-1));
document.getElementById("fnext").addEventListener("click", () => goFind(1));
document.getElementById("fclose").addEventListener("click", closeFind);
ta.addEventListener("input", () => {   // 찾는 중에 메모를 고치면 결과를 다시 계산
  if (fbar.hidden) return;
  clearTimeout(findT); findT = setTimeout(() => { findAll(); fi = Math.min(fi, fm.length - 1); paintFind(); }, 250);
});

/* 표 안을 클릭하면 표 바로 위(자리가 없으면 아래)에 편집 막대가 자동으로 나타나요 */
const tbar = document.getElementById("tbar");
function placeTbar() {
  const s = getSelection();
  const td = s.rangeCount && ta.contains(s.anchorNode) && closestIn(s.anchorNode, "td,th");
  if (!td || ta.disabled) { tbar.hidden = true; return; }
  const tr = td.closest("table").getBoundingClientRect(), ar = ta.getBoundingClientRect();
  if (tr.bottom < ar.top + 10 || tr.top > ar.bottom - 10) { tbar.hidden = true; return; }   // 표가 화면 밖
  tbar.hidden = false;
  const bh = tbar.offsetHeight || 34, bw = tbar.offsetWidth || 300;
  let top = tr.top - bh - 4;
  if (top < ar.top + 2) top = tr.bottom + 4;                     // 위에 자리가 없으면 표 아래
  if (top > innerHeight - bh - 4) top = Math.max(ar.top + 2, innerHeight - bh - 4);   // 표가 화면을 가득 채우면 영역 안쪽에
  tbar.style.top = top + "px";
  tbar.style.left = Math.max(8, Math.min(tr.left, innerWidth - bw - 8)) + "px";
}
tbar.addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); });   // 커서 유지
tbar.addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.t) { tbl(b.dataset.t); placeTbar(); } });
document.addEventListener("selectionchange", placeTbar);
window.addEventListener("scroll", placeTbar, true);
window.addEventListener("resize", placeTbar);
ta.addEventListener("input", placeTbar);

/* 눌린 상태 표시 (굵게/목록/제목 등) */
function refreshTb() {
  const s = getSelection();
  if (!s.rangeCount || !ta.contains(s.anchorNode)) return;
  let blk = ""; try { blk = (document.queryCommandValue("formatBlock") || "").toLowerCase().replace(/[<>]/g, ""); } catch (e) {}
  const q = c => { try { return document.queryCommandState(c); } catch (e) { return false; } };
  const on = {
    h1: blk === "h1", h2: blk === "h2", h3: blk === "h3",
    ul: q("insertUnorderedList"), ol: q("insertOrderedList"),
    bold: q("bold"), italic: q("italic"), underline: q("underline"), strike: q("strikeThrough"),
    quote: blk === "blockquote", code: blk === "pre",
    link: !!closestIn(s.anchorNode, "a")
  };
  tblWrap.classList.toggle("dim", !closestIn(s.anchorNode, "td,th"));   // 표 밖에서는 '표 편집'을 흐리게
  tb.querySelectorAll("button[data-cmd]").forEach(b => { if (b.dataset.cmd in on) b.setAttribute("aria-pressed", String(on[b.dataset.cmd])); });
}
document.addEventListener("selectionchange", refreshTb);

/* 툴바 버튼을 눌러도 메모의 커서/포커스를 유지 */
tb.addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); });
tb.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-needtbl") && !closestIn(getSelection().anchorNode, "td,th")) { closePop(); toast("표 안의 칸을 먼저 클릭하면 행·열을 추가/삭제할 수 있어요"); return; }
  if (b.hasAttribute("data-pal")) { const p = b.nextElementSibling; if (p.hidden) openPop(b, p); else closePop(); return; }
  if (b.dataset.t) { closePop(); tbl(b.dataset.t); return; }
  if ("fs" in b.dataset) { closePop(); setSize(b.dataset.fs); return; }
  if ("fcpick" in b.dataset) {   // 원하는 색을 직접 고르기: 선택 영역을 기억했다가 색을 고른 뒤 적용
    const trig = b.closest(".menu").querySelector("[data-pal]").getBoundingClientRect();   // 닫기 전에 위치를 잰다
    closePop(); const restore = saveRange(), pk = document.getElementById("fcPick");
    pk.style.left = Math.round(trig.left) + "px"; pk.style.top = Math.round(trig.bottom) + "px";   // 선택창이 버튼 근처에 뜨도록
    pk.onchange = () => { restore(); paint("fc", pk.value); };
    pk.click(); return;
  }
  if ("fc" in b.dataset) { closePop(); paint("fc", b.dataset.fc); return; }
  if ("bg" in b.dataset) { closePop(); paint("bg", b.dataset.bg); return; }
  if (b.dataset.cmd) { closePop(); CMDS[b.dataset.cmd](); }
  else if (b.dataset.exp) { closePop(); exportMemo(b.dataset.exp); }
});

/* 표 안에서 Tab / Shift+Tab 으로 칸 이동 (마지막 칸에서 Tab 이면 새 행 추가) */
ta.addEventListener("keydown", e => {
  if (e.key !== "Tab" || e.ctrlKey || e.altKey || e.metaKey) return;
  const s = getSelection(); if (!s.rangeCount) return;
  const td = closestIn(s.anchorNode, "td,th"); if (!td) return;
  e.preventDefault();
  let cells = Array.from(td.closest("table").querySelectorAll("td,th")), i = cells.indexOf(td) + (e.shiftKey ? -1 : 1);
  if (i >= cells.length) {
    const tr = td.closest("tr"), nr = document.createElement("tr");
    for (let k = 0; k < tr.cells.length; k++) nr.appendChild(document.createElement("td")).innerHTML = "<br>";
    tr.after(nr);
    cells = Array.from(td.closest("table").querySelectorAll("td,th"));
    ta.dispatchEvent(new Event("input", { bubbles: true }));
  }
  if (i < 0) return;
  const r = document.createRange(); r.selectNodeContents(cells[i]); r.collapse(false);
  s.removeAllRanges(); s.addRange(r);
});

/* Ctrl(⌘)+클릭으로 링크 열기 (편집 중에는 클릭만으로는 열리지 않아요) */
ta.addEventListener("click", e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const a = closestIn(e.target, "a"), h = a && a.getAttribute("href");
  if (h && /^(https?:|mailto:)/i.test(h)) { e.preventDefault(); window.open(h, "_blank", "noopener,noreferrer"); }
});

/* ===== 내보내기 (.html / .txt) ===== */
function closePop() {
  tb.querySelectorAll(".pop").forEach(p => { p.hidden = true; p.classList.remove("r"); });
  tb.querySelectorAll("[aria-expanded]").forEach(b => b.setAttribute("aria-expanded", "false"));
}
function openPop(btn, p) {
  closePop(); p.hidden = false; btn.setAttribute("aria-expanded", "true");
  if (p.getBoundingClientRect().right > innerWidth - 8) p.classList.add("r");   // 화면 밖으로 나가면 오른쪽 정렬
}
expBtn.addEventListener("click", () => {
  if (!pop.hidden) { closePop(); return; }
  openPop(expBtn, pop);
});
document.addEventListener("click", e => { if (!e.target.closest(".menu")) closePop(); });

function exportMemo(kind) {
  if (ta.value === "") { say("저장할 메모가 없어요", "err"); return; }
  const n = new Date(), p = x => String(x).padStart(2, "0");
  const stamp = n.getFullYear() + p(n.getMonth() + 1) + p(n.getDate()) + "-" + p(n.getHours()) + p(n.getMinutes());
  let body, type, name;
  if (kind === "html") {
    body = '<!DOCTYPE html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>메모</title>\n<style>\n' +
      'body{font:16px/1.6 system-ui,"Noto Sans KR",sans-serif;max-width:800px;margin:24px auto;padding:0 16px;color:#1c1b19;word-break:break-word}\n' +
      'img{max-width:100%;height:auto}table{border-collapse:collapse}td,th{border:1px solid #d9d5cb;padding:2px 6px;vertical-align:top}\n' +
      '</style>\n</head>\n<body>\n' + ta.cleanHtml() + '\n</body>\n</html>\n';
    type = "text/html"; name = "메모_" + stamp + ".html";
  } else {
    body = "\ufeff" + ta.innerText.replace(/\u00a0/g, " ").replace(/\u200b/g, "");   // BOM: 윈도우 앱에서도 한글이 깨지지 않게
    type = "text/plain"; name = "메모_" + stamp + ".txt";
  }
  const url = URL.createObjectURL(new Blob([body], { type: type + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  say("저장했어요: " + name, "ok");
}

/* ===== 불러오기 (.html / .txt): 내보낸 파일이나 다른 메모를 가져와요 ===== */
const impBtn = document.getElementById("impBtn"), impFile = document.getElementById("impFile");
impBtn.addEventListener("click", () => { closePop(); impFile.value = ""; impFile.click(); });
impFile.addEventListener("change", async () => {
  const f = impFile.files && impFile.files[0]; if (!f) return;
  if (ta.disabled) { say("지금은 열 수 없어요. 잠시 후 다시 시도해 주세요", "err"); return; }
  if (f.size > 8e6) { say("파일이 너무 커요 (8MB 이하만 가능)", "err"); return; }
  let html = "";
  try {
    const txt = (await f.text()).replace(/^\ufeff/, "");
    html = (/\.html?$/i.test(f.name) || f.type === "text/html") ? ta.sanitize(txt) : escH(txt).replace(/\r?\n/g, "<br>");
  } catch (e) { say("파일을 읽지 못했어요", "err"); return; }
  const probe = document.createElement("div"); probe.innerHTML = html;
  if (!probe.textContent.trim() && !probe.querySelector("img,table")) { say("열 내용이 없어요", "err"); return; }
  let append = false;
  if (ta.value !== "") {
    if (confirm("현재 메모 끝에 '" + f.name + "' 내용을 이어 붙일까요?\n\n[확인] 이어 붙이기\n[취소] 다른 방법 선택")) append = true;
    else if (!confirm("현재 메모를 지우고 '" + f.name + "' 내용으로 바꿀까요?\n(되돌릴 수 없어요)\n\n[확인] 바꾸기\n[취소] 열기 취소")) { say("열기를 취소했어요"); return; }
  }
  if (append) {
    ta.focus();
    const s = getSelection(), r = document.createRange();
    r.selectNodeContents(ta); r.collapse(false); s.removeAllRanges(); s.addRange(r);   // 맨 끝으로 이동
    if (!document.execCommand("insertHTML", false, "<br>" + html)) { ta.insertAdjacentHTML("beforeend", "<br>" + html); ta.dispatchEvent(new Event("input", { bubbles: true })); }
  } else {
    ta.value = RICH_PREFIX + html;
    ta.dispatchEvent(new Event("input", { bubbles: true }));   // 자동 저장 / DB 동기화가 이어서 동작
  }
  say("열었어요: " + f.name, "ok");
});

/* 확대/축소: 버튼 또는 Esc */
const pane = document.getElementById("pane"), ex = document.getElementById("ex");
function setMax(on) {
  pane.classList.toggle("max", on);
  document.body.classList.toggle("has-max", on);
  ex.textContent = on ? "✕" : "⤢";
  ex.setAttribute("aria-label", on ? "축소" : "확대");
}
ex.addEventListener("click", () => setMax(!pane.classList.contains("max")));   // (포커스 유지는 툴바의 mousedown 처리가 담당)
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (tb.querySelector(".pop:not([hidden])")) { closePop(); return; }
  if (!fbar.hidden) { closeFind(); return; }
  if (pane.classList.contains("max")) setMax(false);
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { saveLocal(); if (useFb && dirty) save(true); } else poll();
});
window.addEventListener("pagehide", saveLocal);
window.addEventListener("focus", poll);
window.addEventListener("beforeunload", e => { if (useFb && dirty) { e.preventDefault(); e.returnValue = ""; } });

/* 시작 */
renderFb();
if (!useFb) localNote();
else if (!dbSet) say("DB_URL을 먼저 설정해 주세요", "err");
else { say("불러오는 중…"); firstTry = true; connect(); }
