<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2x2 차트 (15분 / 3분 / 일봉 / 1시간)</title>
<style>
  :root { --bg:#ffffff; --panel:#ffffff; --text:#111827; --grid:#e5e7eb; --border:#d1d5db; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --panel:#111827; --text:#e5e7eb; --grid:#1f2937; --border:#334155; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { height: 100dvh; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  /* 최상단 시세 바: #top(자리 유지용 slot) > .top-pane > .cropbox > .top-view(내용) */
  /* --top-scale: 시세 바 글자 배율 (1 = 원래 크기, 2.0 = 2.0배). 바뀐 만큼 바 높이가 늘고 차트 영역은 줄어듦 */
  #top { display: block; position: relative; --top-scale: 2.0; }   /* 종목코드 입력칸이 항상 보이도록 처음부터 표시 */
  .top-pane { position: relative; display: flex; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .top-pane .cropbox { height: auto; width: auto; flex: 1 1 0; min-width: 0; }
  /* 종목코드 입력칸 (시세 바 오른쪽) */
  .symform { flex: none; display: flex; flex-direction: column; gap: 4px; margin: 0 8px; }
  .symform input { width: 112px; padding: 3px 6px; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; text-transform: uppercase; }
  .symform button { padding: 3px 6px; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .top-pane .top-view { display: flex; flex-wrap: wrap; align-items: baseline; height: auto;
    gap: calc(4px * var(--top-scale)) calc(16px * var(--top-scale));
    padding: calc(5px * var(--top-scale)) calc(12px * var(--top-scale));
    font-size: calc(15px * var(--top-scale)); }
  .top-view .nm { font-weight: 700; font-size: 24px; }   /* 종목명 고정 24px */
  .top-view .px { font-weight: 700; font-size: 28px;   /* 현재가 고정 28px */ font-variant-numeric: tabular-nums; }
  .top-view .lb { opacity: .6; font-size: 20px; margin-right: calc(4px * var(--top-scale)); }
  .top-view .chg { font-variant-numeric: tabular-nums; font-size: 20px; }   /* 전일대비 / 등락폭 / 등락률 고정 20px */
  .top-view .chg b { font-weight: 700; }   /* 등락폭만 굵게 */
  .top-view .flat { opacity: .7; }
  .top-view .asof { margin-left: auto; font-size: 18px; opacity: .6; }   /* 배율과 무관한 고정 크기 */
  .top-view .asof.stale { color: #d97706; opacity: 1; }
  /* 종목 테이프: 1행(시세 바) 하단, 오른쪽 → 왼쪽으로 흐름. 마우스를 올리면 멈춤, 항목 클릭 시 그 종목 즉시 적용 */
  .tape { position: relative; margin-top: 4px; overflow: hidden; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; }
  .tape-track { display: flex; width: max-content; white-space: nowrap; will-change: transform;
    animation: tape-scroll var(--tape-dur, 30s) linear infinite; }
  .tape:hover .tape-track, .tape:focus-within .tape-track { animation-play-state: paused; }
  @keyframes tape-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .tape-item { flex: none; display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 14px; margin: 0;
    font: inherit; font-size: 13px; color: var(--text); background: none; border: 0;
    border-right: 1px solid var(--border); cursor: pointer; }
  .tape-item .tn { font-weight: 700; }
  .krnote { margin-top: 4px; padding: 3px 8px; font-size: 12px; color: #d97706; }
  .krnote[hidden] { display: none; }
  .tape-item .rk { opacity: .45; font-size: 11px; font-variant-numeric: tabular-nums; }
  .tape-item .tc { opacity: .6; font-size: 12px; font-variant-numeric: tabular-nums; }
  .tape-item:hover { background: var(--grid); }
  .tape-item.active { background: var(--grid); box-shadow: inset 0 -2px 0 #e0393e; }
  @media (prefers-reduced-motion: reduce) { .tape-track { animation-duration: 120s; } }
  .grid { position: relative; flex: 1; min-height: 0; display: grid; gap: 6px;   /* position: 확대된 차트가 이 영역(2~3행)을 덮는 기준 */
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  /* .slot 이 grid 칸 자리를 지키고, .cell 은 그 안을 채움 → 하나를 확대해도 나머지 칸 크기/위치가 변하지 않음 */
  .slot { position: relative; min-width: 0; min-height: 0; }
  .cell { position: absolute; inset: 0; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  /* 확대: 1행(시세 바)은 그대로 두고 grid 영역(2~3행 전체)만 덮음 (CSS 만 바꾸므로 차트는 다시 만들어지지 않음) */
  .slot.slot-max { position: static; }
  .cell.max { position: absolute; inset: 0; z-index: 1000; }

  /* 확대/축소 버튼 */
  .expand { position: absolute; top: 4px; right: 6px; z-index: 30; width: 24px; height: 24px; padding: 0;
    display: grid; place-items: center; font-size: 14px; line-height: 1; color: var(--text); opacity: .55;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .expand:hover { opacity: 1; }
  .max .expand { top: 10px; right: 12px; width: 32px; height: 32px; font-size: 18px; }

  /* 영역 확대(crop): data-crop="x1 x2 y1 y2" (0~100 %) 를 가진 요소가 자르고, 안의 .cropee 를 키워서 그 영역이 꽉 차게 함 */
  .cropbox { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .chartbox { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .cropee { display: block; width: 100%; height: 100%; transform-origin: 0 0; }

  .head { display: flex; justify-content: space-between; gap: 8px; padding: 5px 38px 5px 10px; font-size: 13px;
    border-bottom: 1px solid var(--border); }
  .head b { font-weight: 700; }
  .up { color: #e0393e; } .down { color: #1e6fd9; }   /* 한국식: 상승 빨강, 하락 파랑 */
  .chart { flex: 1; min-height: 0; }
  .msg { z-index: 20; position: absolute; inset: 40px 0 0 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 16px; font-size: 13px; opacity: .8; pointer-events: none; }
  #log { display:none; position:fixed; left:0; right:0; bottom:0; max-height:35vh; overflow:auto; margin:0;
    padding:8px 10px; font:12px/1.5 ui-monospace, Consolas, monospace; white-space:pre-wrap; word-break:break-all;
    background:#fff3cd; color:#7a4b00; border-top:2px solid #e0a800; z-index:9999; }
  @media (prefers-color-scheme: dark) { #log { background:#3b2f06; color:#ffd666; border-color:#a67c00; } }
  /* 모바일/PC 모두 2x2 고정. 좁은 화면에서는 헤더만 작게 */
  @media (max-width: 800px), (orientation: portrait) {
    .wrap { padding: 3px; gap: 3px; }
    .top-pane .top-view { padding: calc(3px * var(--top-scale)) calc(8px * var(--top-scale));
      gap: calc(2px * var(--top-scale)) calc(10px * var(--top-scale)); font-size: calc(12px * var(--top-scale)); }
    .grid { gap: 3px; }
    .head { flex-direction: column; gap: 0; padding: 3px 34px 3px 6px; font-size: 11px; }
  }
  /* 아주 좁은 화면(폭 640px 이하): 차트를 1열로 쌓고, 1행(#top: 시세 바 + 테이프)은 고정, 차트 영역(.grid)만 세로 스크롤.
     2x2 를 유지하고 싶으면 이 블록을 지우면 됨 */
  @media (max-width: 640px) {
    .grid { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: 420px; }
    .grid.has-max { overflow: hidden; }   /* 확대 중에는 스크롤 잠금 (확대된 차트가 영역을 덮음) */
    #top { flex: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 영역 확대 data-crop = "x1 x2 y1 y2" (0~100 %, 왼→오 / 위→아래). 0 100 0 100 = 전체. data-crop-fit="contain" 을 같이 쓰면 비율 유지 -->
  <div id="top">
    <div class="top-pane">
      <div class="cropbox" data-crop="0 100 0 100"><div class="cropee top-view" id="topview"></div></div>
      <form class="symform" id="symform" autocomplete="off">
        <input id="syminput" type="text" placeholder="종목코드" maxlength="20" spellcheck="false" autocapitalize="characters" aria-label="종목코드">
        <button type="submit">적용</button>
      </form>
    </div>
    <div class="tape" id="tapekr" aria-label="한국 시총 상위 40 테이프"><div class="tape-track" id="tapetrackkr"></div></div>
    <div class="tape" id="tape" aria-label="미국 등 주요 종목 테이프"><div class="tape-track" id="tapetrack"></div></div>
    <div class="krnote" id="krnote" hidden>Yahoo에서 제공하는 KRX 시세는 21분 지연이며, 15시 이후에는 종가 데이터만 제공되므로, 캔들도 그려지지 않습니다.</div>
  </div>
  <div class="grid">
    <!-- data-interval: Worker에 넘기는 값(15, 3, 60, D) / data-refresh: 갱신 주기(ms) / data-label: 제목 뒤에 붙는 봉 이름 -->
    <div class="slot">
      <section class="cell" data-interval="15" data-refresh="15000" data-label="15분">
        <button class="expand" type="button" title="확대 / 축소 (Esc)" aria-label="확대">⤢</button>
        <div class="head"><b>차트 · 15분</b><span class="info">-</span></div>
        <div class="chartbox" data-crop="0 100 0 100"><div class="chart cropee"></div></div><div class="msg"></div>
      </section>
    </div>
    <div class="slot">
      <section class="cell" data-interval="3" data-refresh="15000" data-label="3분">
        <button class="expand" type="button" title="확대 / 축소 (Esc)" aria-label="확대">⤢</button>
        <div class="head"><b>차트 · 3분</b><span class="info">-</span></div>
        <div class="chartbox" data-crop="0 100 0 100"><div class="chart cropee"></div></div><div class="msg"></div>
      </section>
    </div>
    <div class="slot">
      <section class="cell" data-interval="D" data-refresh="60000" data-label="일봉">
        <button class="expand" type="button" title="확대 / 축소 (Esc)" aria-label="확대">⤢</button>
        <div class="head"><b>차트 · 일봉</b><span class="info">-</span></div>
        <div class="chartbox" data-crop="0 100 0 100"><div class="chart cropee"></div></div><div class="msg"></div>
      </section>
    </div>
    <div class="slot">
      <section class="cell" data-interval="60" data-refresh="30000" data-label="1시간">
        <button class="expand" type="button" title="확대 / 축소 (Esc)" aria-label="확대">⤢</button>
        <div class="head"><b>차트 · 1시간</b><span class="info">-</span></div>
        <div class="chartbox" data-crop="0 100 0 100"><div class="chart cropee"></div></div><div class="msg"></div>
      </section>
    </div>
  </div>
</div>
<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
  // 배포한 Cloudflare Worker 주소로 바꾸세요 (끝에 / 없이, .workers.dev 까지만)
  const API_BASE = "https://kospi-proxy.pesdee00.workers.dev";
  // 종목 코드: 화면 오른쪽 위 입력칸에서 바꿀 수 있음. 시작할 때 쓰는 값의 우선순위:
  //   ① 주소의 ?symbol=005930.KS  ② 마지막으로 입력한 값(브라우저에 저장)  ③ 아래 DEFAULT_SYMBOL  ④ 비어 있으면 worker.js 가 정함(AUTO_MODE 면 시간대별 자동 종목, 아니면 worker.js 의 DEFAULT_SYMBOL)
  // 코드표는 worker.js 상단 주석 참고.
  const DEFAULT_SYMBOL = "";
  const SYM_KEY = "yh-symbol";
  const SYM_RE = /^[A-Z0-9.^=-]{1,20}$/;   // worker.js 가 허용하는 문자와 동일
  function initialSymbol() {
    let v = new URLSearchParams(location.search).get("symbol");
    if (v === null) { try { v = localStorage.getItem(SYM_KEY); } catch (_) {} }
    v = (v || "").trim().toUpperCase();
    return SYM_RE.test(v) ? v : DEFAULT_SYMBOL;
  }
  let SYMBOL = initialSymbol();
  // 화면에 보이는 캔들 수 = 차트 폭(px) / BAR_PX 를 MIN_BARS~MAX_BARS 로 제한 (좁으면 적게, 넓으면 많게)
  const BAR_PX = 12;          // 캔들 1개당 가로 px (클수록 캔들이 적게, 굵게 보임)
  const MIN_BARS = 20;        // 최소 캔들 수
  const MAX_BARS = 100;       // 최대 캔들 수
  const visibleBars = w => Math.max(MIN_BARS, Math.min(MAX_BARS, Math.round(w / BAR_PX)));
  const RIGHT_PAD = 4;        // 오른쪽 여백(캔들 몇 개 분량)

  const logEl = document.getElementById("log");
  function logLine(t) { logEl.style.display = "block"; logEl.textContent += t + "\n"; logEl.scrollTop = logEl.scrollHeight; }
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // ── 최상단: 종목명 / 현재가 / 전일대비 등락폭(등락률) ──
  // 전일 종가 = 일봉의 마지막에서 두 번째 봉 종가, 현재가 = 가장 최근 봉의 종가
  const topEl = document.getElementById("top");        // 자리 유지용 바깥 상자 (데이터가 오기 전에는 숨김)
  const topView = document.getElementById("topview");  // 실제 내용이 들어가는 곳
  const ASOF_FMT = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
    weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  let krPost = false;   // 한국 종목에서 15:00 이후의 실제 봉이 오고 있는지 (3분봉 기준). 오면 "종가만 제공" 안내를 자동으로 뺌
  const topState = { symbol: null, name: "", dec: 2, prev: null, price: null, priceTime: -1, asOf: null };
  function renderTop() {
    const s = topState;
    if (s.price === null) return;
    const fmt = v => v.toLocaleString(undefined, { minimumFractionDigits: s.dec, maximumFractionDigits: s.dec });
    let html = `<span class="nm">${s.name}</span><span class="px">${fmt(s.price)}</span>`;
    if (s.prev) {
      const diff = s.price - s.prev;
      const pct = diff / s.prev * 100;
      const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const sign = diff > 0 ? "+" : diff < 0 ? "-" : "";
      html += `<span class="chg ${cls}"><span class="lb">전일대비</span><b>${sign}${fmt(Math.abs(diff))}</b> (${sign}${Math.abs(pct).toFixed(2)}%)</span>`;
    }
    if (s.asOf) {
      const mins = Math.max(0, Math.round((Date.now() / 1000 - s.asOf) / 60));
      // 날짜는 Worker 가 주는 asOf(UTC 초)를 한국시간으로 바꿔 표시 → 별도 데이터 불필요. 형식: 2026.11.13.금 06:00
      const p = {};
      ASOF_FMT.formatToParts(new Date(s.asOf * 1000)).forEach(x => { p[x.type] = x.value; });
      const stamp = `${p.year}.${p.month}.${p.day}.${p.weekday} ${p.hour}:${p.minute}`;
      html += `<span class="asof ${mins >= 5 ? "stale" : ""}">기준 : ${stamp}</span>`;
    }
    topView.innerHTML = html;
    topEl.style.display = "block";
  }
  function reportTop(d, interval, dec) {
    const s = topState;
    if (s.symbol !== d.symbol) Object.assign(s, { symbol: d.symbol, prev: null, price: null, priceTime: -1, asOf: null });
    s.name = d.name || d.symbol;
    s.dec = dec;
    if (d.asOf && (s.asOf === null || d.asOf > s.asOf)) s.asOf = d.asOf;
    const c = d.candles, last = c[c.length - 1];
    if (interval === "D") {
      s.prev = c.length >= 2 ? c[c.length - 2].close : null;
      if (s.price === null) s.price = last.close;
    } else if (last.time >= s.priceTime) {
      s.price = last.close; s.priceTime = last.time;
    }
    renderTop();
  }

  setInterval(renderTop, 30000);   // '몇 분 전' 표시 갱신

  // ── 확대/축소: 차트 4개 어느 것이든 버튼으로 2~3행 전체(grid 영역)로 확대, Esc 로 복귀. 1행(시세 바)은 확대 없음 ──
  const gridEl = document.querySelector(".grid");
  let gridScroll = 0;   // 1열 스크롤 모드에서 확대 전 스크롤 위치 (확대 후 닫을 때 복원)
  function setMax(pane, on) {
    const wasMax = !!document.querySelector(".cell.max");
    document.querySelectorAll(".cell.max").forEach(p => {
      p.classList.remove("max");
      p.parentElement.classList.remove("slot-max");
      p.querySelector(".expand").textContent = "⤢";
    });
    if (on) {
      if (!wasMax) gridScroll = gridEl.scrollTop;
      gridEl.scrollTop = 0;   // 확대 칸은 grid 영역(맨 위 기준)을 덮으므로 스크롤을 맨 위로
      gridEl.classList.add("has-max");
      pane.classList.add("max");
      pane.parentElement.classList.add("slot-max");
      pane.querySelector(".expand").textContent = "✕";
    } else {
      gridEl.classList.remove("has-max");
      gridEl.scrollTop = gridScroll;
    }
  }
  document.querySelectorAll(".expand").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    const pane = btn.closest(".cell");
    setMax(pane, !pane.classList.contains("max"));
  }));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { const open = document.querySelector(".cell.max"); if (open) setMax(open, false); }
  });

  // ── 영역 확대(crop): data-crop="x1 x2 y1 y2" (0~100 %) 영역이 상자 전체를 채우도록 .cropee 를 확대/이동 ──
  // 기본은 영역이 상자를 정확히 채움(비율이 다르면 늘어남). data-crop-fit="contain" 이면 비율 유지(영역을 상자 안에 맞춰 가운데 배치).
  function applyCrop(box) {
    const target = box.querySelector(".cropee");
    if (!target) return;
    const clear = () => { target.style.transform = ""; target._cropScale = null; };
    const v = (box.dataset.crop || "").trim().split(/[\s,]+/).map(Number);
    const W = box.clientWidth, H = box.clientHeight;
    if (v.length !== 4 || v.some(isNaN) || !W || !H) return clear();
    const [x1, x2, y1, y2] = v;
    const rw = (x2 - x1) / 100, rh = (y2 - y1) / 100;
    if (rw <= 0 || rh <= 0) return clear();
    if (x1 <= 0 && x2 >= 100 && y1 <= 0 && y2 >= 100) return clear();   // 전체 보기: 변형 없음
    let sx, sy, tx, ty;
    if (box.dataset.cropFit === "contain") {
      sx = sy = Math.min(1 / rw, 1 / rh);
      tx = W / 2 - sx * ((x1 + x2) / 200) * W;
      ty = H / 2 - sy * ((y1 + y2) / 200) * H;
    } else {
      sx = 1 / rw; sy = 1 / rh;
      tx = -sx * (x1 / 100) * W;
      ty = -sy * (y1 / 100) * H;
    }
    target.style.transform = `translate(${tx}px, ${ty}px) scale(${sx}, ${sy})`;
    target._cropScale = { x: sx, y: sy };
  }
  const cropObserver = new ResizeObserver(entries => entries.forEach(e => applyCrop(e.target)));
  document.querySelectorAll("[data-crop]").forEach(box => {
    cropObserver.observe(box);
    new MutationObserver(() => applyCrop(box)).observe(box, { attributes: true, attributeFilter: ["data-crop", "data-crop-fit"] });
    applyCrop(box);
  });

  // ── 확대된 차트의 마우스/터치 위치 보정 ──
  // lightweight-charts 는 (clientX - getBoundingClientRect().left) 로 차트 안 좌표를 계산하는데,
  // CSS 로 확대하면 이 값이 확대 배율만큼 어긋나 십자선/드래그가 틀어짐 → 입력 이벤트 처리 중에만 사각형을 보정해서 돌려줌.
  let lastPtr = null, ptrTimer = 0;
  const trackPtr = e => {
    const p = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    if (typeof p.clientX === "number") lastPtr = { x: p.clientX, y: p.clientY };
    clearTimeout(ptrTimer); ptrTimer = setTimeout(() => { lastPtr = null; }, 0);
  };
  ["mousemove", "mousedown", "mouseup", "touchstart", "touchmove", "touchend", "wheel", "pointermove", "pointerdown", "pointerup"]
    .forEach(t => window.addEventListener(t, trackPtr, { capture: true, passive: true }));
  const nativeRect = Element.prototype.getBoundingClientRect;
  Element.prototype.getBoundingClientRect = function () {
    const r = nativeRect.call(this);
    if (!lastPtr || !this.closest) return r;
    const host = this.closest(".cropee");
    const s = host && host._cropScale;
    if (!s) return r;
    return new DOMRect(lastPtr.x - (lastPtr.x - r.left) / s.x, lastPtr.y - (lastPtr.y - r.top) / s.y, r.width / s.x, r.height / s.y);
  };

  function setup(cell) {
    const interval = cell.dataset.interval;
    const label = cell.dataset.label || interval;
    const refresh = parseInt(cell.dataset.refresh, 10) || 15000;
    const daily = interval === "D";
    const box = cell.querySelector(".chart");
    const info = cell.querySelector(".info");
    const msg = cell.querySelector(".msg");
    const ttl = cell.querySelector(".head b");

    const chart = LightweightCharts.createChart(box, {
      autoSize: true,
      layout: { background: { color: css("--panel") }, textColor: css("--text") },
      grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
      timeScale: { timeVisible: !daily, secondsVisible: false, rightOffset: RIGHT_PAD },
      rightPriceScale: { borderColor: css("--border") },
      crosshair: { mode: 0 },
    });
    const series = chart.addCandlestickSeries({
      upColor: "#e0393e", borderUpColor: "#e0393e", wickUpColor: "#e0393e",
      downColor: "#1e6fd9", borderDownColor: "#1e6fd9", wickDownColor: "#1e6fd9",
    });

    let first = true;
    let barCount = 0;
    let curSymbol = null;
    function showLast() {
      if (!barCount) return;
      const n = visibleBars(box.clientWidth);
      chart.timeScale().setVisibleLogicalRange({ from: barCount - n, to: barCount - 1 + RIGHT_PAD });
    }
    new ResizeObserver(showLast).observe(box);   // 창 크기/회전이 바뀌면 캔들 수 재계산

    function fail(text, detail) {
      msg.textContent = text; msg.style.display = "flex"; info.textContent = "오류";
      logLine(`[${interval}] ${text}` + (detail ? "\n  " + detail : ""));
    }

    async function load() {
      if (API_BASE.includes("YOUR-SUBDOMAIN")) { return fail("API_BASE를 Worker 주소로 바꿔주세요."); }
      const reqSym = SYMBOL;   // 요청 중에 종목이 바뀌면 늦게 온 이전 종목 응답은 버림
      const url = `${API_BASE}/api/candles?interval=${interval}` + (reqSym ? `&symbol=${encodeURIComponent(reqSym)}` : "");
      try {
        const r = await fetch(url);
        const raw = await r.text();
        if (reqSym !== SYMBOL) return;
        let d; try { d = JSON.parse(raw); } catch (_) { throw new Error("JSON이 아닌 응답 (HTTP " + r.status + "): " + raw.slice(0, 120)); }
        if (!r.ok || d.error) throw new Error(d.error || ("HTTP " + r.status));
        if (!Array.isArray(d.candles) || d.candles.length === 0) {
          return fail("서버 응답은 정상이나 캔들이 0개입니다. (Yahoo 데이터 없음: " + d.symbol + ")");
        }

        // 종목이 바뀌었으면(입력칸에서 변경, 또는 worker.js 자동모드의 시간대 전환) 화면 범위를 처음처럼 다시 잡음
        if (curSymbol !== null && curSymbol !== d.symbol) first = true;
        curSymbol = d.symbol;
        if (!SYMBOL) symInput.placeholder = d.symbol;   // 입력칸을 비워둔 경우 실제 적용 중인 코드를 안내로 표시

        // 가격 표시 자릿수 (Worker가 알려줌: 외환 5, 주식·지수 2)
        const dec = Number.isInteger(d.decimals) ? d.decimals : 2;
        series.applyOptions({ priceFormat: { type: "price", precision: dec, minMove: Math.pow(10, -dec) } });

        ttl.textContent = `${d.name || d.symbol} · ${label}`;
        document.title = `${d.name || d.symbol} 2x2 차트`;

        const rng = chart.timeScale().getVisibleLogicalRange();
        const oldCount = barCount;
        series.setData(d.candles);
        barCount = d.candles.length;
        if (first) { showLast(); first = false; }
        else if (rng && barCount !== oldCount && rng.to >= oldCount - 1) {
          // 최신 봉을 보고 있던 경우: 새 봉이 생겨도 같은 구간(줌 유지)으로 따라가기
          const delta = barCount - oldCount;
          chart.timeScale().setVisibleLogicalRange({ from: rng.from + delta, to: rng.to + delta });
        }

        const last = d.candles[d.candles.length - 1];
        const prev = d.candles[d.candles.length - 2] || last;
        const diff = last.close - prev.close;
        info.innerHTML = `<span class="${diff >= 0 ? "up" : "down"}">${last.close.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec })} (${diff >= 0 ? "+" : ""}${diff.toFixed(dec)})</span> · ${d.candles.length}봉`;
        msg.style.display = "none";
        reportTop(d, interval, dec);
        if (interval === "3" && /\.(KS|KQ)$|^\^(KS11|KS200|KQ11)$/i.test(d.symbol)) {
                    // 마지막 거래일 안에 15:03~15:27 사이 3분봉이 하나라도 있어야 "15시 이후 봉 제공"으로 판단
          // (15:00 은 거래량 0 종가 봉, 15:30 은 종가 확정 봉일 수 있어 제외)
          const day = Math.floor(last.time / 86400);
          krPost = false;
          for (let i = d.candles.length - 1; i >= 0 && Math.floor(d.candles[i].time / 86400) === day; i--) {
            const sec = d.candles[i].time % 86400;
            if (sec > 15 * 3600 && sec < 15.5 * 3600) { krPost = true; break; }
          }
          updateKrNote();
        }
      } catch (e) {
        if (reqSym !== SYMBOL) return;
        console.error("[chart]", e);
        fail("데이터를 불러오지 못했습니다: " + e.message, `요청 주소: ${url}\n  페이지 주소: ${location.href}`);
      }
    }
    // 종목이 바뀔 때: 이전 종목 캔들/문구를 지움
    function reset() {
      series.setData([]); barCount = 0; first = true; curSymbol = null;
      info.textContent = "-"; msg.style.display = "none"; ttl.textContent = `차트 · ${label}`;
    }
    cells.push({ load, reset });
    load();
    setInterval(load, refresh);
  }

  // ── 종목코드 입력 → 모든 차트 + 시세 바를 새 종목으로 다시 불러옴 (worker.js 에는 ?symbol= 로 전달) ──
  const cells = [];
  const symForm = document.getElementById("symform");
  const symInput = document.getElementById("syminput");
  symInput.value = SYMBOL;
  symInput.addEventListener("input", () => symInput.setCustomValidity(""));
  symForm.addEventListener("submit", e => {
    e.preventDefault();
    const v = symInput.value.trim().toUpperCase();
    if (v && !SYM_RE.test(v)) {
      symInput.setCustomValidity("영문·숫자와 . ^ = - 만 사용할 수 있습니다 (예: 005930.KS, ^KS11, USDKRW=X)");
      symInput.reportValidity();
      return;
    }
    applySymbol(v);
  });
  // 종목 적용 (입력칸 / 테이프 클릭 공통)
  function applySymbol(v) {
    symInput.value = v;
    symInput.blur();
    SYMBOL = v;   // 비우면 worker.js 가 종목을 정함(자동모드/DEFAULT_SYMBOL)
    try { localStorage.setItem(SYM_KEY, v); } catch (_) {}
    try {
      const u = new URL(location.href);
      v ? u.searchParams.set("symbol", v) : u.searchParams.delete("symbol");
      history.replaceState(null, "", u);
    } catch (_) {}
    Object.assign(topState, { symbol: null, name: "", prev: null, price: null, priceTime: -1, asOf: null });
    topView.innerHTML = "";
    logEl.textContent = ""; logEl.style.display = "none";
    krPost = false;
    markTape();
    cells.forEach(c => { c.reset(); c.load(); });
  }

  // ── 종목 테이프: 오른쪽 → 왼쪽으로 계속 흐름. 클릭하면 그 종목 코드로 바로 적용 ──
  // 종목을 늘리거나 줄이려면 TAPE_ITEMS 만 고치면 됨 [표시 이름, 종목코드]
  const TAPE_ITEMS = [
    ["KOSPI", "^KS11"], ["KOSPI200", "^KS200"], ["삼성전자", "005930.KS"], ["SK하이닉스", "000660.KS"],
    ["SK Hynix", "SKHY"], ["TSMC", "TSM"], ["MICRON", "MU"], ["APPLE", "AAPL"], ["NVIDIA", "NVDA"],
    ["BROADCOM", "AVGO"], ["META", "META"], ["MICROSOFT", "MSFT"], ["GOOGLE", "GOOGL"], ["AMAZON", "AMZN"],
    ["SPACEX", "SPCX"], ["TESLA", "TSLA"], ["COUPANG", "CPNG"],
    ["나스닥 종합", "^IXIC"], ["나스닥100", "^NDX"],
    ["다우", "^DJI"], ["S&P500", "^GSPC"],
  ];
  const TAPE_SPEED = 60;   // 흐르는 속도 (px/초)
  // 한국 시가총액 상위 40 (2026-11-11 종가 기준, 코스피 시총 순). 우선주(삼성전자우)도 별도 종목으로 순위에 포함. [표시 이름, 6자리 코드] → 코드 뒤에 .KS 가 자동으로 붙음
  const TAPE_KR_ITEMS = [
    ["삼성전자","005930"], ["SK하이닉스","000660"], ["삼성전자우","005935"], ["SK스퀘어","402340"], ["LG에너지솔루션","373220"],
    ["삼성전기","009150"], ["삼성바이오로직스","207940"], ["현대차","005380"], ["KB금융","105560"], ["삼성생명","032830"],
    ["셀트리온","068270"], ["삼성물산","028260"], ["신한지주","055550"], ["삼성SDI","006400"], ["기아","000270"],
    ["SK","034730"], ["한화에어로스페이스","012450"], ["하나금융지주","086790"], ["현대모비스","012330"], ["두산에너빌리티","034020"],
    ["NAVER","035420"], ["HD현대중공업","329180"], ["삼성화재","000810"], ["우리금융지주","316140"], ["LG전자","066570"],
    ["POSCO홀딩스","005490"], ["메리츠금융지주","138040"], ["한국전력","015760"], ["고려아연","010130"], ["HMM","011200"],
    ["SK이노베이션","096770"], ["LS ELECTRIC","010120"], ["KT&G","033780"], ["삼성에스디에스","018260"], ["SK텔레콤","017670"],
    ["한미반도체","042700"], ["LG화학","051910"], ["HD한국조선해양","009540"], ["효성중공업","298040"], ["포스코퓨처엠","003670"],
  ].map(([n, c]) => [n, c + ".KS"]);

  // 테이프 하나를 만듦: 오른쪽 → 왼쪽으로 흐르고, 마우스를 올리면 멈추며, 클릭하면 그 종목 코드가 바로 적용됨
  const tapes = [];
  function makeTape(boxId, trackId, items, ranked) {
    const box = document.getElementById(boxId);
    const track = document.getElementById(trackId);
    const set = items.map(([n, c], i) =>
      `<button type="button" class="tape-item" data-sym="${c}">${ranked ? `<span class="rk">${i + 1}</span>` : ""}<span class="tn">${n}</span><span class="tc">${c}</span></button>`).join("");
    function mark() {
      const cur = (topState.symbol || SYMBOL || "").toUpperCase();
      track.querySelectorAll(".tape-item").forEach(b => b.classList.toggle("active", b.dataset.sym === cur));
    }
    function build() {
      track.innerHTML = set;
      const one = track.scrollWidth;
      if (!one) return;
      // 한 묶음이 화면보다 좁으면 반복해서 빈틈 없이 채우고, 같은 묶음을 한 번 더 이어붙여 -50% 이동으로 끊김 없이 순환
      const copies = Math.max(1, Math.ceil(box.clientWidth / one));
      track.innerHTML = set.repeat(copies * 2);
      track.style.setProperty("--tape-dur", (one * copies / TAPE_SPEED) + "s");
      mark();
    }
    track.addEventListener("click", e => {
      const b = e.target.closest(".tape-item");
      if (b) applySymbol(b.dataset.sym);
    });
    let w0 = 0;
    new ResizeObserver(() => { const w = box.clientWidth; if (w !== w0) { w0 = w; build(); } }).observe(box);
    tapes.push({ mark });
  }
  function markTape() { tapes.forEach(t => t.mark()); updateKrNote(); }
  makeTape("tapekr", "tapetrackkr", TAPE_KR_ITEMS, true);   // 1번째 줄: 한국 시총 상위 40
  makeTape("tape", "tapetrack", TAPE_ITEMS, false);         // 2번째 줄: 미국 등 주요 종목
  // KRX 종목(.KS/.KQ, 코스피·코스닥 지수)을 보고 있을 때만 안내 문구 표시
  const krNote = document.getElementById("krnote");
  function updateKrNote() {
    const kr = isKrNow();
    krNote.hidden = !kr;
    if (kr) krNote.textContent = "Yahoo에서 제공하는 KRX 시세는 21분 지연"
      + (krPost ? "됩니다." : "이며, 15시 이후에는 종가 데이터만 제공되므로, 캔들도 그려지지 않습니다.");
  }
  const isKrNow = () => /\.(KS|KQ)$|^\^(KS11|KS200|KQ11)$/i.test(topState.symbol || SYMBOL || "");
  setInterval(markTape, 2000);
  markTape();   // worker 자동모드로 종목이 바뀐 경우에도 강조 표시 따라감

  document.querySelectorAll(".cell").forEach(setup);
</script>
</body>
